<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafio do Dia — DataEng Playbook</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0b0f19;
    --bg-card: rgba(30, 41, 59, 0.45);
    --bg-code: #0f172a;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border-card: rgba(148, 163, 184, 0.12);
    --border-strong: rgba(148, 163, 184, 0.3);
    --sql-color: #0ea5e9;
    --sql-bg: rgba(14, 165, 233, 0.12);
    --pyspark-color: #a78bfa;
    --pyspark-bg: rgba(139, 92, 246, 0.14);
    --accent: #f59e0b;
    --accent-bg: rgba(245, 158, 11, 0.12);
    --radius: 14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem 3rem;
    line-height: 1.6;
    overflow-x: hidden;
  }

  .container { max-width: 860px; margin: 0 auto; }

  nav.top {
    display: flex; gap: 18px; flex-wrap: wrap;
    font-size: 12px; margin-bottom: 1.75rem;
  }
  nav.top a { color: var(--text-muted); text-decoration: none; }
  nav.top a:hover { color: var(--text-primary); }

  header h1 {
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  header p { color: var(--text-secondary); margin-top: .35rem; max-width: 640px; }

  .controls {
    display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
    margin: 1.5rem 0 1.25rem;
  }
  .seg { display: inline-flex; border: 1px solid var(--border-card); border-radius: 999px; overflow: hidden; }
  .seg button {
    background: transparent; border: 0; color: var(--text-secondary);
    font: 500 .8rem 'Inter', sans-serif; padding: .45rem .9rem; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--border-card); color: var(--text-primary); }
  select {
    background: var(--bg-card); color: var(--text-primary);
    border: 1px solid var(--border-card); border-radius: 999px;
    font: 500 .8rem 'Inter', sans-serif; padding: .45rem .8rem;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    padding: 1.5rem;
    backdrop-filter: blur(16px);
  }

  .meta { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .9rem; }
  .pill {
    font: 600 .7rem 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .05em;
    padding: .25rem .6rem; border-radius: 999px; border: 1px solid var(--border-card); color: var(--text-secondary);
  }
  .pill.sql { color: var(--sql-color); background: var(--sql-bg); border-color: transparent; }
  .pill.pyspark { color: var(--pyspark-color); background: var(--pyspark-bg); border-color: transparent; }
  .pill.extra { color: var(--accent); background: var(--accent-bg); border-color: transparent; }

  .ferramenta { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .origem { color: var(--text-secondary); font-size: .9rem; margin-top: .2rem; }
  .origem a { color: var(--text-primary); }

  .tabs { display: flex; gap: .25rem; margin: 1.4rem 0 1rem; border-bottom: 1px solid var(--border-card); }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    color: var(--text-muted); font: 600 .85rem 'Inter', sans-serif; padding: .5rem .8rem; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--text-primary); }

  .enunciado { font-size: 1rem; }
  .enunciado code, .nota code {
    font-family: 'JetBrains Mono', monospace; font-size: .85em;
    background: var(--bg-code); padding: .1rem .35rem; border-radius: 4px;
  }
  .nota { color: var(--text-secondary); font-size: .85rem; margin-top: .8rem; }

  .tabela { margin-top: 1.1rem; }
  .tabela h3 { font: 600 .75rem 'JetBrains Mono', monospace; color: var(--text-secondary); margin-bottom: .35rem; }
  .scroll { overflow-x: auto; border: 1px solid var(--border-card); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font: .8rem 'JetBrains Mono', monospace; }
  th, td { text-align: left; padding: .4rem .7rem; border-bottom: 1px solid var(--border-card); white-space: nowrap; }
  th small { display: block; color: var(--text-muted); font-weight: 400; }
  tr:last-child td { border-bottom: 0; }
  td.nulo { color: var(--text-muted); font-style: italic; }

  details { margin-top: 1.3rem; }
  summary {
    cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--text-secondary);
    list-style: none; display: inline-flex; gap: .4rem; align-items: center;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '▸'; transition: transform .2s; }
  details[open] summary::before { transform: rotate(90deg); }
  .code-wrap { position: relative; margin-top: .7rem; }
  pre {
    background: var(--bg-code); border: 1px solid var(--border-card); border-radius: 10px;
    padding: 1rem; overflow-x: auto; font: .82rem/1.55 'JetBrains Mono', monospace; color: #e2e8f0;
  }
  .copy {
    position: absolute; top: .5rem; right: .5rem;
    background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-card);
    border-radius: 6px; font: 500 .72rem 'Inter', sans-serif; padding: .25rem .55rem; cursor: pointer;
  }

  .acoes { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.25rem; }
  .btn {
    background: transparent; color: var(--text-primary); border: 1px solid var(--border-strong);
    border-radius: 999px; font: 600 .8rem 'Inter', sans-serif; padding: .5rem 1rem; cursor: pointer;
  }
  .btn:hover { background: var(--border-card); }

  .rodape { color: var(--text-muted); font-size: .8rem; margin-top: 1.5rem; }
  .vazio { color: var(--text-secondary); }
</style>
</head>

<script>
  const DESAFIOS = [{"id":"spk-01-dataframe-rdd","ref":"02_pyspark/01_fundamentos-dags-sql.md#dataframe-api-vs-rdd","ferramenta":"DataFrame API e explain","niveis":{"basico":{"enunciado":"Filtre as vendas FECHADO e mostre o plano físico com `explain`.","dados":[{"tabela":"vendas","colunas":["id","status","valor"],"tipos":["INT","STRING","INT"],"linhas":[[1,"FECHADO",10],[2,"ABERTO",20]]}],"solucao":"resultado = vendas.filter(F.col(\"status\") == \"FECHADO\")\nresultado.explain(\"formatted\")"},"intermediario":{"enunciado":"Converta para DataFrame API o código RDD abaixo, que soma valor por status:\n`rdd.map(lambda r: (r.status, r.valor)).reduceByKey(lambda a, b: a + b)`","dados":[{"tabela":"vendas","colunas":["id","status","valor"],"tipos":["INT","STRING","INT"],"linhas":[[1,"FECHADO",10],[2,"ABERTO",20],[3,"FECHADO",5]]}],"solucao":"resultado = vendas.groupBy(\"status\").agg(F.sum(\"valor\").alias(\"valor\"))\n# Vantagem: o Catalyst enxerga as colunas e pode podar leitura e escolher a agregação."},"avancado":{"enunciado":"Na sua base, procure usos de `.rdd`, `sparkContext` ou `parallelize`. Verifique quais quebrariam em computação serverless (Spark Connect) e reescreva um deles com DataFrame API.","dados":null,"solucao":"# Busca: grep -nE '\\.rdd\\b|sparkContext|parallelize' *.py\n# Exemplos de troca:\n#   sc.parallelize(lista).toDF(cols)  ->  spark.createDataFrame(lista, cols)\n#   df.rdd.map(f).toDF()              ->  df.select(<expressões nativas>)\n#   df.rdd.getNumPartitions()         ->  não disponível no Spark Connect; avalie pela Spark UI"}},"area":"pyspark","arquivo":"Fundamentos: Lazy Evaluation, DAGs e Spark SQL (PySpark)","secao":"DataFrame API vs RDD","link":"cheatsheets.html#pyspark-01-dataframe-api-vs-rdd","semana":6},{"id":"spk-01-spark-sql-views","ref":"02_pyspark/01_fundamentos-dags-sql.md#spark-sql-e-temp-views","ferramenta":"createOrReplaceTempView e spark.sql com args","niveis":{"basico":{"enunciado":"Registre o DataFrame como temp view e calcule em SQL a receita por região.","dados":[{"tabela":"vendas","colunas":["regiao","valor"],"tipos":["STRING","INT"],"linhas":[["SUL",10],["SUL",20],["NORTE",5]]}],"solucao":"vendas.createOrReplaceTempView(\"vw_vendas\")\nresultado = spark.sql(\"\"\"\n    SELECT regiao, SUM(valor) AS receita\n    FROM vw_vendas\n    GROUP BY regiao\n\"\"\")"},"intermediario":{"enunciado":"Filtre a região recebida em uma variável Python sem concatenar strings no SQL.","dados":[{"tabela":"vendas","colunas":["regiao","valor"],"tipos":["STRING","INT"],"linhas":[["SUL",10],["SUL",20],["NORTE",5]]}],"solucao":"regiao_param = \"SUL\"\nvendas.createOrReplaceTempView(\"vw_vendas\")\nresultado = spark.sql(\n    \"SELECT * FROM vw_vendas WHERE regiao = :regiao\",\n    args={\"regiao\": regiao_param},\n)"},"avancado":{"enunciado":"Combine as duas APIs: calcule em SQL o total por cliente e, em PySpark, junte com o DataFrame de clientes para trazer o nome. Explique por que os dois caminhos geram um único plano.","dados":[{"tabela":"vendas","colunas":["id_cliente","valor"],"tipos":["INT","INT"],"linhas":[[1,10],[1,30],[2,5]]},{"tabela":"clientes","colunas":["id_cliente","nome"],"tipos":["INT","STRING"],"linhas":[[1,"Ana"],[2,"Bruno"]]}],"solucao":"vendas.createOrReplaceTempView(\"vw_vendas\")\ntotais = spark.sql(\"SELECT id_cliente, SUM(valor) AS total FROM vw_vendas GROUP BY id_cliente\")\nresultado = totais.join(clientes, \"id_cliente\")\nresultado.explain()\n# spark.sql devolve um DataFrame: as duas partes viram um único plano lógico otimizado pelo Catalyst."}},"area":"pyspark","arquivo":"Fundamentos: Lazy Evaluation, DAGs e Spark SQL (PySpark)","secao":"Spark SQL e temp views","link":"cheatsheets.html#pyspark-01-spark-sql-e-temp-views","semana":6},{"id":"spk-01-transformacoes-acoes","ref":"02_pyspark/01_fundamentos-dags-sql.md#transformacoes-e-acoes","ferramenta":"Lazy evaluation: transformações × ações","niveis":{"basico":{"enunciado":"Filtre pessoas com nome preenchido e crie `idade_ajustada = idade + 1`. Indique no código qual linha dispara a execução.","dados":[{"tabela":"pessoas","colunas":["nome","idade"],"tipos":["STRING","INT"],"linhas":[["Ana",30],[null,40],["Bia",25]]}],"solucao":"resultado = (\n    pessoas\n    .filter(F.col(\"nome\").isNotNull())\n    .withColumn(\"idade_ajustada\", F.col(\"idade\") + 1)\n)  # transformações: nada executou ainda\n\nresultado.count()  # ação: executa o plano"},"intermediario":{"enunciado":"O código abaixo chama três ações sobre o mesmo DataFrame caro. Quantas vezes o plano é executado? Reescreva para calcular as três métricas em uma única ação.\n`total = df.count(); maior = df.agg(F.max('valor')).first()[0]; menor = df.agg(F.min('valor')).first()[0]`","dados":[{"tabela":"df","colunas":["id","valor"],"tipos":["INT","INT"],"linhas":[[1,10],[2,50],[3,30]]}],"solucao":"# Três ações = três execuções do plano desde a origem.\nresultado = df.agg(\n    F.count(\"*\").alias(\"total\"),\n    F.max(\"valor\").alias(\"maior\"),\n    F.min(\"valor\").alias(\"menor\"),\n)\nmetricas = resultado.first()   # uma única ação"},"avancado":{"enunciado":"Na sua base, abra um notebook de produção e liste todas as ações (`count`, `show`, `display`, `collect`, `toPandas`, `write`). Classifique cada uma como necessária ou de depuração e estime quantas execuções extras do plano as de depuração causam.","dados":null,"solucao":"# Busca rápida no notebook exportado:\n#   grep -nE '\\.(count|show|collect|toPandas)\\(|display\\(' notebook.py\n# Para cada ocorrência: é parte do resultado (write, métrica publicada) ou depuração?\n# Remova ou proteja depuração com uma flag (if DEBUG:) e meça a duração antes/depois."}},"area":"pyspark","arquivo":"Fundamentos: Lazy Evaluation, DAGs e Spark SQL (PySpark)","secao":"Transformações e ações","link":"cheatsheets.html#pyspark-01-transformacoes-e-acoes","semana":6},{"id":"spk-02-jdbc","ref":"02_pyspark/02_leitura-escrita-io.md#jdbc-paralelizado","ferramenta":"spark.read.jdbc com particionamento","niveis":{"basico":{"enunciado":"Leia a tabela `vendas.faturamento` via JDBC em 8 partições pela coluna `id_venda` (1 a 4.000.000), com credenciais vindas de secrets.","dados":null,"solucao":"df = spark.read.jdbc(\n    url=\"jdbc:sqlserver://servidor:1433;database=DB\",\n    table=\"vendas.faturamento\",\n    column=\"id_venda\",\n    lowerBound=1,\n    upperBound=4_000_000,\n    numPartitions=8,\n    properties={\n        \"user\": dbutils.secrets.get(\"erp\", \"usuario\"),\n        \"password\": dbutils.secrets.get(\"erp\", \"senha\"),\n    },\n)"},"intermediario":{"enunciado":"Com `lowerBound=1`, `upperBound=4.000.000` e `numPartitions=4`, qual faixa de `id_venda` cada partição lê? Para onde vão os ids acima de 4.000.000?","dados":null,"solucao":"# Passo = (4.000.000 - 1) / 4 ≈ 1.000.000\n# p0: id < 1.000.001 (inclui nulos e valores abaixo do lowerBound)\n# p1: 1.000.001 <= id < 2.000.001\n# p2: 2.000.001 <= id < 3.000.001\n# p3: id >= 3.000.001 (inclui tudo acima do upperBound)\n# Os limites não filtram: ids > 4.000.000 vão para a última partição."},"avancado":{"enunciado":"Na sua base, escolha uma leitura JDBC lenta. Meça a distribuição da coluna de particionamento (min, max, quantis) na origem e proponha limites e número de partições que equilibrem as tarefas sem sobrecarregar o banco.","dados":null,"solucao":"limites = spark.read.jdbc(url, \"(SELECT MIN(id) mn, MAX(id) mx, COUNT(*) n FROM vendas.faturamento) t\", properties=props).first()\n# Se a distribuição for desigual, use 'predicates' com faixas definidas por quantis:\npredicados = [\"id < 100000\", \"id >= 100000 AND id < 500000\", \"id >= 500000\"]\ndf = spark.read.jdbc(url, \"vendas.faturamento\", predicates=predicados, properties=props)\n# Combine o número de conexões simultâneas com o DBA."}},"area":"pyspark","arquivo":"Leitura e Escrita de Dados (PySpark I/O)","secao":"JDBC paralelizado","link":"cheatsheets.html#pyspark-02-jdbc-paralelizado","semana":7},{"id":"spk-02-particionamento","ref":"02_pyspark/02_leitura-escrita-io.md#particionamento-fisico-e-arquivos-pequenos","ferramenta":"partitionBy e arquivos pequenos","niveis":{"basico":{"enunciado":"Grave o DataFrame mensal particionado por ano e mês em `main.gold.vendas_mensal`.","dados":null,"solucao":"(\n    df_resultado.write\n    .mode(\"overwrite\")\n    .partitionBy(\"ano\", \"mes\")\n    .saveAsTable(\"main.gold.vendas_mensal\")\n)"},"intermediario":{"enunciado":"Antes de escolher a coluna de partição, calcule para cada candidata o número de valores distintos e o tamanho médio que cada partição teria (linhas por valor).","dados":[{"tabela":"vendas","colunas":["id","id_cliente","mes","uf"],"tipos":["INT","INT","STRING","STRING"],"linhas":[[1,100,"2025-01","SP"],[2,101,"2025-01","SP"],[3,102,"2025-02","RJ"],[4,103,"2025-02","SP"]]}],"solucao":"total = vendas.count()\nresultado = vendas.agg(*[\n    F.count_distinct(c).alias(c) for c in [\"id_cliente\", \"mes\", \"uf\"]\n])\ndistintos = resultado.first().asDict()\nlinhas_por_particao = {c: total / n for c, n in distintos.items()}\n# id_cliente: 1 linha por partição -> péssima escolha (arquivos minúsculos)."},"avancado":{"enunciado":"Na sua base, encontre uma tabela particionada. Calcule o tamanho médio dos arquivos e o número de arquivos por partição (`DESCRIBE DETAIL`) e decida se ela deveria migrar para liquid clustering.","dados":null,"solucao":"detalhe = spark.sql(\"DESCRIBE DETAIL main.gold.vendas_mensal\").first()\nprint(detalhe[\"numFiles\"], detalhe[\"sizeInBytes\"] / max(detalhe[\"numFiles\"], 1) / 1024**2, \"MB por arquivo\")\nprint(detalhe[\"partitionColumns\"])\n# Muitos arquivos pequenos ou tabela < 1 TB -> candidata a CLUSTER BY."}},"area":"pyspark","arquivo":"Leitura e Escrita de Dados (PySpark I/O)","secao":"Particionamento físico e arquivos pequenos","link":"cheatsheets.html#pyspark-02-particionamento-fisico-e-arquivos-pequenos","semana":7},{"id":"spk-02-schema-explicito","ref":"02_pyspark/02_leitura-escrita-io.md#arquivos-com-schema-explicito","ferramenta":"spark.read com schema, mode e columnNameOfCorruptRecord","niveis":{"basico":{"enunciado":"Declare um schema com `id` (inteiro, obrigatório) e `cidade` (texto) e leia CSVs separados por `;` com cabeçalho, de um Volume.","dados":null,"solucao":"schema_lote = T.StructType([\n    T.StructField(\"id\", T.IntegerType(), False),\n    T.StructField(\"cidade\", T.StringType(), True),\n])\n\ndf = (\n    spark.read\n    .schema(schema_lote)\n    .option(\"header\", \"true\")\n    .option(\"sep\", \";\")\n    .csv(\"/Volumes/main/bronze/landing/lotes/\")\n)"},"intermediario":{"enunciado":"Leia o mesmo CSV guardando as linhas inválidas em uma coluna `_corrupt` e conte quantas foram rejeitadas.","dados":null,"solucao":"schema_com_corrupt = T.StructType([\n    T.StructField(\"id\", T.IntegerType(), True),\n    T.StructField(\"cidade\", T.StringType(), True),\n    T.StructField(\"_corrupt\", T.StringType(), True),\n])\n\ndf = (\n    spark.read.schema(schema_com_corrupt)\n    .option(\"header\", \"true\").option(\"sep\", \";\")\n    .option(\"mode\", \"PERMISSIVE\")\n    .option(\"columnNameOfCorruptRecord\", \"_corrupt\")\n    .csv(\"/Volumes/main/bronze/landing/lotes/\")\n    .cache()   # recomendado antes de filtrar só pela coluna corrompida (clusters clássicos)\n)\nrejeitadas = df.filter(F.col(\"_corrupt\").isNotNull()).count()"},"avancado":{"enunciado":"Na sua base, escolha uma ingestão de arquivos que usa `inferSchema`. Gere o schema inferido uma vez, fixe-o no código (como DDL), e compare tempo de leitura e estabilidade de tipos entre duas cargas.","dados":null,"solucao":"inferido = spark.read.option(\"header\", \"true\").option(\"inferSchema\", \"true\").csv(caminho).schema\nprint(inferido.simpleString())   # copie e revise -> DDL fixo\nschema_fixo = \"id INT, cidade STRING, valor DECIMAL(12,2)\"\ndf = spark.read.schema(schema_fixo).option(\"header\", \"true\").csv(caminho)\n# Compare duração (sem a passada de inferência) e tipos entre cargas."}},"area":"pyspark","arquivo":"Leitura e Escrita de Dados (PySpark I/O)","secao":"Arquivos com schema explícito","link":"cheatsheets.html#pyspark-02-arquivos-com-schema-explicito","semana":7},{"id":"spk-02-tabelas","ref":"02_pyspark/02_leitura-escrita-io.md#tabelas","ferramenta":"read.table, saveAsTable, replaceWhere","niveis":{"basico":{"enunciado":"Leia `main.silver.clientes`, filtre os ativos e grave em `main.gold.clientes_ativos` substituindo o conteúdo.","dados":null,"solucao":"(\n    spark.read.table(\"main.silver.clientes\")\n    .filter(F.col(\"status\") == \"ATIVO\")\n    .write.mode(\"overwrite\")\n    .saveAsTable(\"main.gold.clientes_ativos\")\n)"},"intermediario":{"enunciado":"Reprocesse apenas o mês 2025-10 da tabela `main.gold.vendas_mensal`, sem apagar os outros meses.","dados":null,"solucao":"(\n    df_outubro\n    .write.mode(\"overwrite\")\n    .option(\"replaceWhere\", \"mes = '2025-10'\")\n    .saveAsTable(\"main.gold.vendas_mensal\")\n)\n# Todas as linhas de df_outubro precisam satisfazer a condição, senão a escrita falha."},"avancado":{"enunciado":"Na sua base, encontre um job que faz `overwrite` total para reprocessar só um período. Reescreva com `replaceWhere`, rode duas vezes seguidas e confirme pelo `DESCRIBE HISTORY` que o resultado é idempotente e que os outros períodos não mudaram.","dados":null,"solucao":"spark.sql(\"DESCRIBE HISTORY main.gold.vendas_mensal LIMIT 2\").select(\"version\", \"operation\", \"operationParameters\", \"operationMetrics\").show(truncate=False)\n# Compare contagem por período antes e depois:\nspark.read.table(\"main.gold.vendas_mensal\").groupBy(\"mes\").count().orderBy(\"mes\").show()"}},"area":"pyspark","arquivo":"Leitura e Escrita de Dados (PySpark I/O)","secao":"Tabelas","link":"cheatsheets.html#pyspark-02-tabelas","semana":7},{"id":"spk-03-casts","ref":"02_pyspark/03_exploracao-e-tipagem.md#casts-explicitos","ferramenta":"cast, DecimalType e perdas de conversão","niveis":{"basico":{"enunciado":"Converta `id` para long e `faturamento` (texto) para decimal(18,2).","dados":[{"tabela":"df","colunas":["id","faturamento"],"tipos":["STRING","STRING"],"linhas":[["1","1500.10"],["2","300"]]}],"solucao":"resultado = df.select(\n    F.col(\"id\").cast(T.LongType()).alias(\"id\"),\n    F.col(\"faturamento\").cast(T.DecimalType(18, 2)).alias(\"vl_faturamento\"),\n)"},"intermediario":{"enunciado":"Alguns faturamentos são inválidos. Converta sem falhar (ANSI ligado) e conte os valores presentes que se perderam.","dados":[{"tabela":"df","colunas":["id","faturamento"],"tipos":["STRING","STRING"],"linhas":[["1","1500.10"],["2","abc"],["3",null],["4","1.2.3"]]}],"solucao":"convertido = df.withColumn(\"vl_faturamento\", F.expr(\"try_cast(faturamento AS DECIMAL(18,2))\"))\nresultado = convertido.agg(\n    F.count_if(F.col(\"faturamento\").isNotNull() & F.col(\"vl_faturamento\").isNull()).alias(\"perdidos\")\n)"},"avancado":{"enunciado":"Converta várias colunas de uma vez a partir de um dicionário `coluna -> tipo`, usando conversão segura, e produza um relatório com quantos valores cada coluna perdeu.","dados":[{"tabela":"df","colunas":["idade","valor","dt"],"tipos":["STRING","STRING","STRING"],"linhas":[["30","10.5","2025-01-01"],["x","7","2025-13-01"],[null,"abc",null]]}],"solucao":"contrato = {\"idade\": \"INT\", \"valor\": \"DECIMAL(10,2)\", \"dt\": \"DATE\"}\nconvertido = df.select(\n    *[F.expr(f\"try_cast({c} AS {t})\").alias(c) for c, t in contrato.items()],\n    *[F.col(c).alias(f\"{c}_original\") for c in contrato],\n)\nresultado = convertido.agg(*[\n    F.count_if(F.col(f\"{c}_original\").isNotNull() & F.col(c).isNull()).alias(c)\n    for c in contrato\n])"}},"area":"pyspark","arquivo":"Exploração e Tipagem (PySpark)","secao":"Casts explícitos","link":"cheatsheets.html#pyspark-03-casts-explicitos","semana":6},{"id":"spk-03-datas-timezone","ref":"02_pyspark/03_exploracao-e-tipagem.md#datas-e-timezone","ferramenta":"to_date, from_utc_timestamp, date_trunc","niveis":{"basico":{"enunciado":"Converta a data de nascimento no formato `dd/MM/yyyy` para `DATE`.","dados":[{"tabela":"df","colunas":["id","dt_txt"],"tipos":["INT","STRING"],"linhas":[[1,"25/12/1990"],[2,"01/02/2001"]]}],"solucao":"resultado = df.withColumn(\"dt_nascimento\", F.to_date(\"dt_txt\", \"dd/MM/yyyy\"))"},"intermediario":{"enunciado":"Os eventos estão em UTC. Crie a coluna com horário de São Paulo e conte eventos por mês local com `date_trunc`.","dados":[{"tabela":"eventos","colunas":["id","ts_utc"],"tipos":["INT","TIMESTAMP"],"linhas":[[1,"2025-02-01T01:00:00"],[2,"2025-02-15T12:00:00"],[3,"2025-03-01T02:00:00"]]}],"solucao":"resultado = (\n    eventos\n    .withColumn(\"ts_br\", F.from_utc_timestamp(\"ts_utc\", \"America/Sao_Paulo\"))\n    .groupBy(F.date_trunc(\"month\", \"ts_br\").alias(\"mes_local\"))\n    .count()\n    .orderBy(\"mes_local\")\n)\n# Eventos 1 e 3 pertencem ao mês anterior no horário local."},"avancado":{"enunciado":"Calcule a idade em anos completos na data de referência 2025-06-30, a partir de `dt_nascimento`. Teste com quem faz aniversário exatamente nesse dia.","dados":[{"tabela":"pessoas","colunas":["nome","dt_nascimento"],"tipos":["STRING","DATE"],"linhas":[["Ana","1990-06-30"],["Bia","1990-07-01"],["Caio","2000-01-15"]]}],"solucao":"ref = F.lit(\"2025-06-30\").cast(\"date\")\nresultado = pessoas.withColumn(\n    \"idade\",\n    F.floor(F.months_between(ref, F.col(\"dt_nascimento\")) / 12).cast(\"int\"),\n)\n# Ana: 35; Bia: 34; Caio: 25"}},"area":"pyspark","arquivo":"Exploração e Tipagem (PySpark)","secao":"Datas e timezone","link":"cheatsheets.html#pyspark-03-datas-e-timezone","semana":6},{"id":"spk-03-inspecao","ref":"02_pyspark/03_exploracao-e-tipagem.md#inspecao-rapida","ferramenta":"printSchema, describe, summary","niveis":{"basico":{"enunciado":"Mostre o schema e as estatísticas básicas (count, média, min, max) de idade e faturamento.","dados":[{"tabela":"df","colunas":["nome","idade","faturamento"],"tipos":["STRING","INT","DOUBLE"],"linhas":[["Ana",30,1000.0],["Bia",45,2500.5],["Caio",null,800.0]]}],"solucao":"df.printSchema()\nresultado = df.select(\"idade\", \"faturamento\").describe()"},"intermediario":{"enunciado":"Mostre os quartis (25%, 50%, 75%) de faturamento com `summary`, e liste os nomes e tipos das colunas como dicionário.","dados":[{"tabela":"df","colunas":["nome","idade","faturamento"],"tipos":["STRING","INT","DOUBLE"],"linhas":[["Ana",30,1000.0],["Bia",45,2500.5],["Caio",22,800.0],["Duda",51,4000.0]]}],"solucao":"resultado = df.select(\"faturamento\").summary(\"count\", \"min\", \"25%\", \"50%\", \"75%\", \"max\")\ntipos = dict(df.dtypes)"},"avancado":{"enunciado":"Escreva uma função que valide o schema de um DataFrame contra um contrato (nome → tipo) e retorne colunas faltantes, sobrando e com tipo diferente.","dados":[{"tabela":"df","colunas":["id","valor","extra"],"tipos":["STRING","DOUBLE","STRING"],"linhas":[["1",10.0,"x"]]}],"solucao":"def validar_schema(df, contrato):\n    atual = dict(df.dtypes)\n    return {\n        \"faltando\": sorted(set(contrato) - set(atual)),\n        \"sobrando\": sorted(set(atual) - set(contrato)),\n        \"tipo_diferente\": {c: (atual[c], t) for c, t in contrato.items() if c in atual and atual[c] != t},\n    }\n\nresultado = validar_schema(df, {\"id\": \"bigint\", \"valor\": \"double\", \"dt\": \"date\"})"}},"area":"pyspark","arquivo":"Exploração e Tipagem (PySpark)","secao":"Inspeção rápida","link":"cheatsheets.html#pyspark-03-inspecao-rapida","semana":6},{"id":"spk-04-deduplicacao","ref":"02_pyspark/04_transformacoes-e-df-api.md#deduplicacao","ferramenta":"dropDuplicates × row_number","niveis":{"basico":{"enunciado":"Remova as linhas duplicadas idênticas pela chave (`id_pk`, `documento`).","dados":[{"tabela":"df","colunas":["id_pk","documento","valor"],"tipos":["INT","STRING","INT"],"linhas":[[1,"A",10],[1,"A",10],[2,"B",20]]}],"solucao":"resultado = df.dropDuplicates([\"id_pk\", \"documento\"])"},"intermediario":{"enunciado":"Mantenha a versão mais recente de cada `id_pk`. Por que `orderBy(...).dropDuplicates(...)` não garante isso?","dados":[{"tabela":"df","colunas":["id_pk","valor","atualizado_em"],"tipos":["INT","INT","TIMESTAMP"],"linhas":[[1,10,"2025-01-01T00:00:00"],[1,15,"2025-02-01T00:00:00"],[2,20,"2025-01-01T00:00:00"]]}],"solucao":"# dropDuplicates mantém uma linha qualquer: a ordem anterior não é preservada após o shuffle.\nultima = Window.partitionBy(\"id_pk\").orderBy(F.col(\"atualizado_em\").desc())\nresultado = (\n    df.withColumn(\"rn\", F.row_number().over(ultima))\n      .filter(\"rn = 1\")\n      .drop(\"rn\")\n)"},"avancado":{"enunciado":"Há empate de `atualizado_em` para o id 1. Mantenha a mais recente com desempate pela maior `versao` e produza também a lista de ids que tinham duplicidade para auditoria.","dados":[{"tabela":"df","colunas":["id_pk","valor","atualizado_em","versao"],"tipos":["INT","INT","TIMESTAMP","INT"],"linhas":[[1,10,"2025-02-01T00:00:00",1],[1,15,"2025-02-01T00:00:00",2],[2,20,"2025-01-01T00:00:00",1]]}],"solucao":"ultima = Window.partitionBy(\"id_pk\").orderBy(F.col(\"atualizado_em\").desc(), F.col(\"versao\").desc())\ncom_rn = df.withColumns({\n    \"rn\": F.row_number().over(ultima),\n    \"qtd\": F.count(\"*\").over(Window.partitionBy(\"id_pk\")),\n})\nresultado = com_rn.filter(\"rn = 1\").drop(\"rn\", \"qtd\")\nauditoria = com_rn.filter(\"qtd > 1\").select(\"id_pk\").distinct()"}},"area":"pyspark","arquivo":"Transformações e DataFrame API (PySpark)","secao":"Deduplicação","link":"cheatsheets.html#pyspark-04-deduplicacao","semana":6},{"id":"spk-04-filtros","ref":"02_pyspark/04_transformacoes-e-df-api.md#filtros","ferramenta":"filter com &, |, ~ e isin","niveis":{"basico":{"enunciado":"Filtre clientes VIP ou GOLD que não estejam banidos.","dados":[{"tabela":"clientes","colunas":["id","status","banido"],"tipos":["INT","STRING","BOOLEAN"],"linhas":[[1,"VIP",false],[2,"GOLD",true],[3,"BASIC",false]]}],"solucao":"resultado = clientes.filter(\n    F.col(\"status\").isin(\"VIP\", \"GOLD\") & ~F.col(\"banido\")\n)"},"intermediario":{"enunciado":"Regra: (nome preenchido E celular não vazio) OU status VIP. Escreva o filtro e mostre que, sem os parênteses de agrupamento, `A & B | C` e `A & (B | C)` dão resultados diferentes.","dados":[{"tabela":"clientes","colunas":["id","nome","celular","status"],"tipos":["INT","STRING","STRING","STRING"],"linhas":[[1,"Ana","999","BASIC"],[2,null,"","VIP"],[3,"Bia","","BASIC"]]}],"solucao":"A = F.col(\"nome\").isNotNull()\nB = F.col(\"celular\") != \"\"\nC = F.col(\"status\") == \"VIP\"\n\nresultado = clientes.filter((A & B) | C)        # ids 1 e 2\noutra_regra = clientes.filter(A & (B | C))     # só id 1"},"avancado":{"enunciado":"Construa o filtro a partir de uma lista de regras em dicionário (`coluna`, `operador`, `valor`), combinando-as com E. Suporte `==`, `>`, e `in`.","dados":[{"tabela":"vendas","colunas":["id","uf","valor"],"tipos":["INT","STRING","INT"],"linhas":[[1,"SP",100],[2,"RJ",50],[3,"SP",10]]}],"solucao":"from functools import reduce\n\nregras = [\n    {\"coluna\": \"uf\", \"operador\": \"in\", \"valor\": [\"SP\", \"MG\"]},\n    {\"coluna\": \"valor\", \"operador\": \">\", \"valor\": 20},\n]\nops = {\n    \"==\": lambda c, v: c == v,\n    \">\": lambda c, v: c > v,\n    \"in\": lambda c, v: c.isin(v),\n}\ncondicao = reduce(lambda a, b: a & b, [ops[r[\"operador\"]](F.col(r[\"coluna\"]), r[\"valor\"]) for r in regras])\nresultado = vendas.filter(condicao)"}},"area":"pyspark","arquivo":"Transformações e DataFrame API (PySpark)","secao":"Filtros","link":"cheatsheets.html#pyspark-04-filtros","semana":6},{"id":"spk-04-projecao-colunas","ref":"02_pyspark/04_transformacoes-e-df-api.md#projecao-novas-colunas-e-renomeacao","ferramenta":"select, withColumns, withColumnsRenamed, selectExpr","niveis":{"basico":{"enunciado":"Selecione id, nome e faturamento, renomeie `cliente_id` para `id_cliente` e adicione a coluna constante `sistema_origem = 'CRM'`.","dados":[{"tabela":"clientes","colunas":["cliente_id","nome","celular","faturamento"],"tipos":["INT","STRING","STRING","INT"],"linhas":[[1," ana ","999",1500],[2,"BIA",null,500]]}],"solucao":"resultado = (\n    clientes\n    .select(\"cliente_id\", \"nome\", \"faturamento\")\n    .withColumnsRenamed({\"cliente_id\": \"id_cliente\"})\n    .withColumn(\"sistema_origem\", F.lit(\"CRM\"))\n)"},"intermediario":{"enunciado":"Em um único passo, padronize o nome (trim + maiúsculas) e crie a faixa de faturamento (ALTA acima de 1000, senão BAIXA).","dados":[{"tabela":"clientes","colunas":["cliente_id","nome","faturamento"],"tipos":["INT","STRING","INT"],"linhas":[[1," ana ",1500],[2,"BIA",500]]}],"solucao":"resultado = clientes.withColumns({\n    \"nome\": F.trim(F.upper(\"nome\")),\n    \"faixa\": F.when(F.col(\"faturamento\") > 1000, \"ALTA\").otherwise(\"BAIXA\"),\n})"},"avancado":{"enunciado":"Converta todos os nomes de coluna para `snake_case` minúsculo (ex.: `Data Venda` → `data_venda`, `ValorTotal` → `valor_total`) sem escrever cada nome à mão.","dados":[{"tabela":"origem","colunas":["Data Venda","ValorTotal","ID"],"tipos":["STRING","INT","INT"],"linhas":[["2025-01-01",10,1]]}],"solucao":"import re\n\ndef snake(nome):\n    nome = re.sub(r\"(?<=[a-z0-9])(?=[A-Z])\", \"_\", nome.strip())\n    return re.sub(r\"[^0-9a-zA-Z]+\", \"_\", nome).strip(\"_\").lower()\n\nresultado = origem.withColumnsRenamed({c: snake(c) for c in origem.columns})"}},"area":"pyspark","arquivo":"Transformações e DataFrame API (PySpark)","secao":"Projeção, novas colunas e renomeação","link":"cheatsheets.html#pyspark-04-projecao-novas-colunas-e-renomeacao","semana":6},{"id":"spk-04-textos-datas","ref":"02_pyspark/04_transformacoes-e-df-api.md#textos-e-datas-com-funcoes-nativas","ferramenta":"date_add, datediff, regexp_replace, translate","niveis":{"basico":{"enunciado":"Calcule a data limite (compra + 15 dias) e o nome padronizado (trim + maiúsculas).","dados":[{"tabela":"compras","colunas":["id","nome","data_compra"],"tipos":["INT","STRING","DATE"],"linhas":[[1," ana ","2025-01-10"],[2,"Bia","2025-02-20"]]}],"solucao":"resultado = compras.withColumns({\n    \"data_limite\": F.date_add(\"data_compra\", 15),\n    \"nome_padrao\": F.trim(F.upper(\"nome\")),\n})"},"intermediario":{"enunciado":"Limpe o token deixando só letras e números e gere a versão sem acentos do nome.","dados":[{"tabela":"cadastro","colunas":["nome","token"],"tipos":["STRING","STRING"],"linhas":[["João Ávila","ab-12_cd!"],["Márcia","X 9.9"]]}],"solucao":"resultado = cadastro.withColumns({\n    \"token_limpo\": F.regexp_replace(\"token\", r\"[^A-Za-z0-9]\", \"\"),\n    \"nome_sem_acento\": F.translate(\"nome\", \"áàâãäéèêëíìîïóòôõöúùûüçÁÀÂÃÉÊÍÓÔÕÚÇ\", \"aaaaaeeeeiiiiooooouuuucAAAAEEIOOOUC\"),\n})"},"avancado":{"enunciado":"Substitua a UDF Python abaixo por funções nativas e confirme o mesmo resultado:\n`@udf('int') def dias_atraso(prazo, entrega): return max((entrega - prazo).days, 0) if prazo and entrega else None`","dados":[{"tabela":"entregas","colunas":["id","prazo","entrega"],"tipos":["INT","DATE","DATE"],"linhas":[[1,"2025-01-10","2025-01-15"],[2,"2025-01-10","2025-01-05"],[3,"2025-01-10",null]]}],"solucao":"resultado = entregas.withColumn(\n    \"dias_atraso\",\n    F.greatest(F.datediff(\"entrega\", \"prazo\"), F.lit(0)),\n)\n# datediff com entrega nula devolve null, e greatest(null, 0) = 0!\n# Para manter null como na UDF:\nresultado = entregas.withColumn(\n    \"dias_atraso\",\n    F.when(F.col(\"entrega\").isNotNull() & F.col(\"prazo\").isNotNull(),\n           F.greatest(F.datediff(\"entrega\", \"prazo\"), F.lit(0))),\n)"}},"area":"pyspark","arquivo":"Transformações e DataFrame API (PySpark)","secao":"Textos e datas com funções nativas","link":"cheatsheets.html#pyspark-04-textos-e-datas-com-funcoes-nativas","semana":6},{"id":"spk-04-union-sample","ref":"02_pyspark/04_transformacoes-e-df-api.md#empilhamento-e-amostragem","ferramenta":"unionByName e sample","niveis":{"basico":{"enunciado":"Empilhe janeiro e fevereiro. As colunas estão em ordem diferente nos dois DataFrames.","dados":[{"tabela":"janeiro","colunas":["id","valor"],"tipos":["INT","INT"],"linhas":[[1,10]]},{"tabela":"fevereiro","colunas":["valor","id"],"tipos":["INT","INT"],"linhas":[[20,2]]}],"solucao":"resultado = janeiro.unionByName(fevereiro)"},"intermediario":{"enunciado":"Fevereiro ganhou a coluna `canal`. Empilhe os dois meses preenchendo `canal` como nulo em janeiro. Mostre o que `union` (por posição) faria de errado.","dados":[{"tabela":"janeiro","colunas":["id","valor"],"tipos":["INT","INT"],"linhas":[[1,10]]},{"tabela":"fevereiro","colunas":["valor","id","canal"],"tipos":["INT","INT","STRING"],"linhas":[[20,2,"SITE"]]}],"solucao":"resultado = janeiro.unionByName(fevereiro, allowMissingColumns=True)\n# union por posição colocaria 20 em 'id' e 2 em 'valor' (e falharia pelo nº de colunas)."},"avancado":{"enunciado":"Extraia uma amostra de ~10% reprodutível para testes e verifique que ela preserva aproximadamente a proporção por UF. Depois gere uma amostra estratificada com frações por UF.","dados":[{"tabela":"vendas","colunas":["id","uf"],"tipos":["INT","STRING"],"linhas":[[1,"SP"],[2,"SP"],[3,"SP"],[4,"SP"],[5,"RJ"],[6,"RJ"],[7,"MG"],[8,"SP"],[9,"RJ"],[10,"SP"]]}],"solucao":"amostra = vendas.sample(withReplacement=False, fraction=0.1, seed=42)\n\ndef proporcao(df):\n    total = df.count()\n    return df.groupBy(\"uf\").agg(F.try_divide(F.count(\"*\"), F.lit(total)).alias(\"pct\"))\n\nproporcao(vendas).show()\nproporcao(amostra).show()   # em amostras pequenas a proporção oscila bastante\n\nresultado = vendas.sampleBy(\"uf\", fractions={\"SP\": 0.5, \"RJ\": 0.5, \"MG\": 1.0}, seed=42)\n# sample/sampleBy são aproximados: o tamanho exato varia."}},"area":"pyspark","arquivo":"Transformações e DataFrame API (PySpark)","secao":"Empilhamento e amostragem","link":"cheatsheets.html#pyspark-04-empilhamento-e-amostragem","semana":6},{"id":"spk-05-divisao-zero","ref":"02_pyspark/05_nulos-e-condicionais.md#divisao-por-zero","ferramenta":"try_divide e when","niveis":{"basico":{"enunciado":"Calcule `receita / custo` devolvendo nulo quando o custo for zero.","dados":[{"tabela":"df","colunas":["id","receita","custo"],"tipos":["INT","INT","INT"],"linhas":[[1,100,50],[2,80,0]]}],"solucao":"resultado = df.withColumn(\"rentabilidade\", F.try_divide(\"receita\", \"custo\"))"},"intermediario":{"enunciado":"Implemente a mesma regra com `when` (para versões sem `try_divide`) e adicione uma flag `is_custo_zero`.","dados":[{"tabela":"df","colunas":["id","receita","custo"],"tipos":["INT","INT","INT"],"linhas":[[1,100,50],[2,80,0],[3,10,null]]}],"solucao":"resultado = df.withColumns({\n    \"rentabilidade\": F.when(F.col(\"custo\") == 0, None).otherwise(F.col(\"receita\") / F.col(\"custo\")),\n    \"is_custo_zero\": (F.col(\"custo\") == 0).cast(\"int\"),\n})"},"avancado":{"enunciado":"Calcule o ticket médio por loja (receita total / pedidos) e uma métrica com o percentual de lojas sem ticket. Use uma única agregação final.","dados":[{"tabela":"vendas","colunas":["loja","receita","pedidos"],"tipos":["STRING","DECIMAL(10,2)","INT"],"linhas":[["A",1000.0,10],["B",0.0,0],["C",300.0,3],["D",50.0,0]]}],"solucao":"com_ticket = vendas.withColumn(\"ticket\", F.try_divide(\"receita\", \"pedidos\"))\nresultado = com_ticket.agg(\n    F.avg(\"ticket\").alias(\"ticket_medio_lojas\"),\n    (100 * F.avg(F.col(\"ticket\").isNull().cast(\"int\"))).alias(\"pct_sem_ticket\"),\n)"}},"area":"pyspark","arquivo":"Nulos e Condicionais (PySpark)","secao":"Divisão por zero","link":"cheatsheets.html#pyspark-05-divisao-por-zero","semana":7},{"id":"spk-05-dropna-fillna","ref":"02_pyspark/05_nulos-e-condicionais.md#dropna-fillna-e-replace","ferramenta":"dropna, fillna, replace","niveis":{"basico":{"enunciado":"Remova as linhas sem idade ou sem CPF e conte quantas foram removidas.","dados":[{"tabela":"pessoas","colunas":["nome","idade","cpf"],"tipos":["STRING","INT","STRING"],"linhas":[["Ana",30,"1"],["Bia",null,"2"],["Caio",40,null],[null,50,"4"]]}],"solucao":"resultado = pessoas.dropna(how=\"any\", subset=[\"idade\", \"cpf\"])\nremovidas = pessoas.count() - resultado.count()"},"intermediario":{"enunciado":"Normalize marcadores de ausência (`''`, `'N/A'`, `'NA'`) para nulo em e-mail e telefone e depois preencha o e-mail nulo com 'desconhecido@exemplo.com'.","dados":[{"tabela":"contatos","colunas":["id","email","telefone"],"tipos":["INT","STRING","STRING"],"linhas":[[1,"a@x","N/A"],[2,"","999"],[3,"NA",""],[4,null,null]]}],"solucao":"resultado = (\n    contatos\n    .replace([\"N/A\", \"NA\", \"\"], None, subset=[\"email\", \"telefone\"])\n    .fillna({\"email\": \"desconhecido@exemplo.com\"})\n)"},"avancado":{"enunciado":"`fillna({'idade': 0, 'nome': 'X'})` não preencheu a idade. Investigue o tipo da coluna, explique o comportamento e corrija preservando a regra.","dados":[{"tabela":"pessoas","colunas":["nome","idade"],"tipos":["STRING","STRING"],"linhas":[["Ana","30"],[null,null]]}],"solucao":"pessoas.printSchema()   # idade é string\n# fillna ignora colunas cujo tipo não combina com o valor (0 é int, idade é string).\nresultado = (\n    pessoas\n    .withColumn(\"idade\", F.col(\"idade\").cast(\"int\"))\n    .fillna({\"idade\": 0, \"nome\": \"X\"})\n)"}},"area":"pyspark","arquivo":"Nulos e Condicionais (PySpark)","secao":"dropna, fillna e replace","link":"cheatsheets.html#pyspark-05-dropna-fillna-e-replace","semana":7},{"id":"spk-05-when-coalesce","ref":"02_pyspark/05_nulos-e-condicionais.md#when-otherwise-e-coalesce","ferramenta":"when/otherwise, coalesce, eqNullSafe","niveis":{"basico":{"enunciado":"Classifique a entrega: até 3 dias EXPRESSA, senão PADRAO. Substitua categoria nula por -1.","dados":[{"tabela":"vendas","colunas":["id","prazo_dias","id_categoria"],"tipos":["INT","INT","INT"],"linhas":[[1,2,10],[2,5,null],[3,null,20]]}],"solucao":"resultado = vendas.withColumns({\n    \"tipo_entrega\": F.when(F.col(\"prazo_dias\") <= 3, \"EXPRESSA\").otherwise(\"PADRAO\"),\n    \"id_categoria\": F.coalesce(F.col(\"id_categoria\"), F.lit(-1)),\n})"},"intermediario":{"enunciado":"Repita a classificação, mas prazo nulo deve virar 'SEM_PRAZO' (hoje ele cai em PADRAO). Por que isso acontece?","dados":[{"tabela":"vendas","colunas":["id","prazo_dias"],"tipos":["INT","INT"],"linhas":[[1,2],[2,5],[3,null]]}],"solucao":"# null <= 3 é null (não verdadeiro): a linha cai no otherwise.\nresultado = vendas.withColumn(\n    \"tipo_entrega\",\n    F.when(F.col(\"prazo_dias\").isNull(), \"SEM_PRAZO\")\n     .when(F.col(\"prazo_dias\") <= 3, \"EXPRESSA\")\n     .otherwise(\"PADRAO\"),\n)"},"avancado":{"enunciado":"Compare duas versões de cadastro e marque as linhas em que o e-mail mudou, considerando nulo → valor e valor → nulo como mudança.","dados":[{"tabela":"v1","colunas":["id","email"],"tipos":["INT","STRING"],"linhas":[[1,"a@x"],[2,null],[3,"c@x"],[4,null]]},{"tabela":"v2","colunas":["id","email"],"tipos":["INT","STRING"],"linhas":[[1,"a@x"],[2,"b@x"],[3,null],[4,null]]}],"solucao":"a, b = v1.alias(\"a\"), v2.alias(\"b\")\nresultado = (\n    a.join(b, \"id\")\n    .withColumn(\"mudou\", ~F.col(\"a.email\").eqNullSafe(F.col(\"b.email\")))\n    .filter(\"mudou\")\n    .select(\"id\", F.col(\"a.email\").alias(\"antes\"), F.col(\"b.email\").alias(\"depois\"))\n)"}},"area":"pyspark","arquivo":"Nulos e Condicionais (PySpark)","secao":"when / otherwise e coalesce","link":"cheatsheets.html#pyspark-05-when-otherwise-e-coalesce","semana":7},{"id":"spk-06-agg-uma-passada","ref":"02_pyspark/06_agrupamentos-e-pivots.md#varias-agregacoes-em-uma-passada","ferramenta":"groupBy().agg com várias métricas","niveis":{"basico":{"enunciado":"Por UF: quantidade de vendas, lucro médio (2 casas) e quantidade de erros, em um único `agg`.","dados":[{"tabela":"fatos","colunas":["uf","id_transacao","lucro","status"],"tipos":["STRING","INT","DOUBLE","STRING"],"linhas":[["SP",1,10.0,"OK"],["SP",2,15.555,"ERRO"],["RJ",3,7.0,"OK"]]}],"solucao":"resultado = fatos.groupBy(\"uf\").agg(\n    F.count(\"id_transacao\").alias(\"qtd_vendas\"),\n    F.round(F.avg(\"lucro\"), 2).alias(\"lucro_medio\"),\n    F.count_if(F.col(\"status\") == \"ERRO\").alias(\"qtd_erros\"),\n)"},"intermediario":{"enunciado":"Por UF, some o valor vendido só na LOJA e conte clientes distintos de forma exata e aproximada (`rsd=0.02`).","dados":[{"tabela":"fatos","colunas":["uf","canal","valor","id_cliente"],"tipos":["STRING","STRING","INT","INT"],"linhas":[["SP","LOJA",10,1],["SP","SITE",20,2],["SP","LOJA",5,1],["RJ","SITE",7,3]]}],"solucao":"resultado = fatos.groupBy(\"uf\").agg(\n    F.sum(F.when(F.col(\"canal\") == \"LOJA\", F.col(\"valor\"))).alias(\"valor_loja\"),\n    F.count_distinct(\"id_cliente\").alias(\"clientes_exato\"),\n    F.approx_count_distinct(\"id_cliente\", rsd=0.02).alias(\"clientes_aprox\"),\n)"},"avancado":{"enunciado":"O código abaixo usa as funções nativas do Python sem perceber. Explique o erro e corrija:\n`from pyspark.sql.functions import *` seguido, mais adiante, de `total = sum([1, 2, 3])`.","dados":[{"tabela":"fatos","colunas":["uf","valor"],"tipos":["STRING","INT"],"linhas":[["SP",10],["RJ",20]]}],"solucao":"# 'import *' sombreia sum, max, min, round, filter... do Python.\n# sum([1, 2, 3]) passa a chamar pyspark.sql.functions.sum e falha.\nfrom pyspark.sql import functions as F\n\ntotal = sum([1, 2, 3])   # builtin do Python, volta a funcionar\nresultado = fatos.agg(F.sum(\"valor\").alias(\"total\"))"}},"area":"pyspark","arquivo":"Agrupamentos, Agregações e Pivots (PySpark)","secao":"Várias agregações em uma passada","link":"cheatsheets.html#pyspark-06-varias-agregacoes-em-uma-passada","semana":6},{"id":"spk-06-pivot","ref":"02_pyspark/06_agrupamentos-e-pivots.md#pivot","ferramenta":"groupBy().pivot()","niveis":{"basico":{"enunciado":"Gire a receita por categoria, com uma coluna por ano (2024 e 2025).","dados":[{"tabela":"vendas","colunas":["categoria","ano","receita"],"tipos":["STRING","INT","INT"],"linhas":[["A",2024,10],["A",2025,20],["B",2025,5]]}],"solucao":"resultado = vendas.groupBy(\"categoria\").pivot(\"ano\", [2024, 2025]).agg(F.sum(\"receita\"))"},"intermediario":{"enunciado":"Gire duas métricas ao mesmo tempo (soma da receita e quantidade de vendas) por canal, e preencha as combinações sem venda com 0.","dados":[{"tabela":"vendas","colunas":["categoria","canal","receita"],"tipos":["STRING","STRING","INT"],"linhas":[["A","LOJA",10],["A","SITE",20],["B","LOJA",5],["A","LOJA",1]]}],"solucao":"resultado = (\n    vendas.groupBy(\"categoria\")\n    .pivot(\"canal\", [\"LOJA\", \"SITE\"])\n    .agg(F.sum(\"receita\").alias(\"receita\"), F.count(\"receita\").alias(\"qtd\"))\n    .fillna(0)\n)\n# Colunas: LOJA_receita, LOJA_qtd, SITE_receita, SITE_qtd"},"avancado":{"enunciado":"O domínio de anos muda todo janeiro. Obtenha a lista de anos de forma controlada (consulta separada e ordenada), limite a no máximo 5 anos mais recentes e use-a no `pivot`.","dados":[{"tabela":"vendas","colunas":["categoria","ano","receita"],"tipos":["STRING","INT","INT"],"linhas":[["A",2020,1],["A",2021,2],["A",2022,3],["A",2023,4],["A",2024,5],["B",2025,6]]}],"solucao":"anos = [r[\"ano\"] for r in vendas.select(\"ano\").distinct().orderBy(F.desc(\"ano\")).limit(5).collect()]\nanos = sorted(anos)\nresultado = vendas.groupBy(\"categoria\").pivot(\"ano\", anos).agg(F.sum(\"receita\"))"}},"area":"pyspark","arquivo":"Agrupamentos, Agregações e Pivots (PySpark)","secao":"Pivot","link":"cheatsheets.html#pyspark-06-pivot","semana":6},{"id":"spk-06-rollup-cube","ref":"02_pyspark/06_agrupamentos-e-pivots.md#subtotais-rollup-e-cube","ferramenta":"rollup, cube, grouping_id","niveis":{"basico":{"enunciado":"Calcule o valor por país e região com subtotal por país e total geral.","dados":[{"tabela":"vendas","colunas":["pais","regiao","valor"],"tipos":["STRING","STRING","INT"],"linhas":[["BR","SUL",10],["BR","NE",20],["AR","NORTE",5]]}],"solucao":"resultado = vendas.rollup(\"pais\", \"regiao\").agg(F.sum(\"valor\").alias(\"valor\"))"},"intermediario":{"enunciado":"Use `cube` por ano e canal e rotule cada linha (DETALHE, SUBTOTAL_ANO, SUBTOTAL_CANAL, TOTAL) com `grouping_id`.","dados":[{"tabela":"vendas","colunas":["ano","canal","valor"],"tipos":["INT","STRING","INT"],"linhas":[[2024,"LOJA",10],[2024,"SITE",20],[2025,"LOJA",5]]}],"solucao":"nivel = F.grouping_id()\nresultado = (\n    vendas.cube(\"ano\", \"canal\")\n    .agg(F.sum(\"valor\").alias(\"valor\"), nivel.alias(\"gid\"))\n    .withColumn(\"rotulo\",\n        F.when(F.col(\"gid\") == 0, \"DETALHE\")\n         .when(F.col(\"gid\") == 1, \"SUBTOTAL_ANO\")\n         .when(F.col(\"gid\") == 2, \"SUBTOTAL_CANAL\")\n         .otherwise(\"TOTAL\"))\n)"},"avancado":{"enunciado":"A região tem valores nulos reais. Produza o rollup e substitua o nulo de subtotal por 'TOTAL PAÍS', mantendo o nulo real como 'SEM REGIÃO'.","dados":[{"tabela":"vendas","colunas":["pais","regiao","valor"],"tipos":["STRING","STRING","INT"],"linhas":[["BR","SUL",10],["BR",null,20],["AR","NORTE",5]]}],"solucao":"resultado = (\n    vendas.rollup(\"pais\", \"regiao\")\n    .agg(F.sum(\"valor\").alias(\"valor\"), F.grouping(\"regiao\").alias(\"g_regiao\"), F.grouping(\"pais\").alias(\"g_pais\"))\n    .withColumn(\"regiao\",\n        F.when(F.col(\"g_pais\") == 1, \"TOTAL GERAL\")\n         .when(F.col(\"g_regiao\") == 1, \"TOTAL PAÍS\")\n         .otherwise(F.coalesce(\"regiao\", F.lit(\"SEM REGIÃO\"))))\n    .drop(\"g_regiao\", \"g_pais\")\n)"}},"area":"pyspark","arquivo":"Agrupamentos, Agregações e Pivots (PySpark)","secao":"Subtotais: rollup e cube","link":"cheatsheets.html#pyspark-06-subtotais-rollup-e-cube","semana":6},{"id":"spk-06-unpivot","ref":"02_pyspark/06_agrupamentos-e-pivots.md#unpivot-melt","ferramenta":"DataFrame.unpivot (melt)","niveis":{"basico":{"enunciado":"Transforme as colunas de receita mensal em linhas (`mes`, `receita`).","dados":[{"tabela":"planilha","colunas":["regiao","receita_jan","receita_fev"],"tipos":["STRING","INT","INT"],"linhas":[["N",10,20],["S",30,40]]}],"solucao":"resultado = planilha.unpivot(\n    ids=[\"regiao\"],\n    values=[\"receita_jan\", \"receita_fev\"],\n    variableColumnName=\"mes\",\n    valueColumnName=\"receita\",\n)"},"intermediario":{"enunciado":"Faça o unpivot de todas as colunas que começam com `receita_` (sem listá-las à mão) e transforme `receita_jan` em `jan`.","dados":[{"tabela":"planilha","colunas":["regiao","receita_jan","receita_fev","receita_mar"],"tipos":["STRING","INT","INT","INT"],"linhas":[["N",10,20,30]]}],"solucao":"colunas_mes = [c for c in planilha.columns if c.startswith(\"receita_\")]\nresultado = (\n    planilha.unpivot([\"regiao\"], colunas_mes, \"mes\", \"receita\")\n    .withColumn(\"mes\", F.regexp_replace(\"mes\", \"^receita_\", \"\"))\n)"},"avancado":{"enunciado":"As colunas de valor têm tipos diferentes (int e decimal) e o unpivot falha. Corrija padronizando os tipos e descarte os meses sem valor.","dados":[{"tabela":"planilha","colunas":["regiao","receita_jan","receita_fev"],"tipos":["STRING","INT","DECIMAL(10,2)"],"linhas":[["N",10,20.5],["S",null,3.0]]}],"solucao":"colunas_mes = [\"receita_jan\", \"receita_fev\"]\npadronizada = planilha.withColumns({c: F.col(c).cast(\"decimal(12,2)\") for c in colunas_mes})\nresultado = (\n    padronizada.unpivot([\"regiao\"], colunas_mes, \"mes\", \"receita\")\n    .filter(F.col(\"receita\").isNotNull())\n)"}},"area":"pyspark","arquivo":"Agrupamentos, Agregações e Pivots (PySpark)","secao":"Unpivot (melt)","link":"cheatsheets.html#pyspark-06-unpivot-melt","semana":6},{"id":"spk-07-broadcast","ref":"02_pyspark/07_joins-relacionais.md#broadcast","ferramenta":"broadcast() e explain","niveis":{"basico":{"enunciado":"Faça o join da fato com a dimensão pequena usando `broadcast` e confirme no plano a estratégia `BroadcastHashJoin`.","dados":[{"tabela":"fato","colunas":["id","produto_id"],"tipos":["INT","INT"],"linhas":[[1,1],[2,2]]},{"tabela":"dimensao","colunas":["produto_id","nome"],"tipos":["INT","STRING"],"linhas":[[1,"A"],[2,"B"]]}],"solucao":"resultado = fato.join(F.broadcast(dimensao), \"produto_id\", \"left\")\nresultado.explain(\"formatted\")"},"intermediario":{"enunciado":"Desligue o broadcast automático, rode o mesmo join sem hint e compare os dois planos (quantos `Exchange` cada um tem).","dados":[{"tabela":"fato","colunas":["id","produto_id"],"tipos":["INT","INT"],"linhas":[[1,1],[2,2]]},{"tabela":"dimensao","colunas":["produto_id","nome"],"tipos":["INT","STRING"],"linhas":[[1,"A"],[2,"B"]]}],"solucao":"spark.conf.set(\"spark.sql.autoBroadcastJoinThreshold\", \"-1\")\nsem_hint = fato.join(dimensao, \"produto_id\")\ncom_hint = fato.join(F.broadcast(dimensao), \"produto_id\")\n\nsem_hint.explain()   # SortMergeJoin com Exchange nos dois lados\ncom_hint.explain()   # BroadcastHashJoin com BroadcastExchange\nspark.conf.unset(\"spark.sql.autoBroadcastJoinThreshold\")\nresultado = com_hint"},"avancado":{"enunciado":"Na sua base, encontre um `broadcast()` fixo no código. Meça o tamanho atual do DataFrame transmitido (após filtros) e o crescimento nos últimos meses. Decida se o hint deve ficar, sair (deixar o AQE decidir) ou ganhar uma checagem de tamanho.","dados":null,"solucao":"tamanho = spark.sql(\"DESCRIBE DETAIL main.silver.dim_produto\").first()[\"sizeInBytes\"] / 1024**2\nprint(f\"{tamanho:.1f} MB\")\n# Histórico de crescimento: DESCRIBE HISTORY + operationMetrics (numOutputBytes)\n# Se o tamanho pode passar da memória dos executores, remova o hint e deixe o AQE\n# converter para broadcast quando as estatísticas de runtime permitirem."}},"area":"pyspark","arquivo":"Joins em PySpark","secao":"Broadcast","link":"cheatsheets.html#pyspark-07-broadcast","semana":7},{"id":"spk-07-join-on","ref":"02_pyspark/07_joins-relacionais.md#chaves-com-o-mesmo-nome","ferramenta":"join com on=[...] e com aliases","niveis":{"basico":{"enunciado":"Junte vendas e lojas por `loja_id` mantendo todas as vendas e sem duplicar a coluna da chave.","dados":[{"tabela":"vendas","colunas":["id_venda","loja_id"],"tipos":["INT","INT"],"linhas":[[1,10],[2,99]]},{"tabela":"lojas","colunas":["loja_id","uf"],"tipos":["INT","STRING"],"linhas":[[10,"SP"]]}],"solucao":"resultado = vendas.join(lojas, on=[\"loja_id\"], how=\"left\")"},"intermediario":{"enunciado":"Converta o valor das vendas pela taxa de câmbio da mesma moeda e data. As chaves têm nomes diferentes nos dois lados.","dados":[{"tabela":"vendas","colunas":["id","moeda","data_venda","valor"],"tipos":["INT","STRING","DATE","DOUBLE"],"linhas":[[1,"USD","2025-01-01",10.0],[2,"EUR","2025-01-01",5.0],[3,"USD","2025-01-02",1.0]]},{"tabela":"cambio","colunas":["codigo","data_referencia","taxa"],"tipos":["STRING","DATE","DOUBLE"],"linhas":[["USD","2025-01-01",5.0],["EUR","2025-01-01",6.0]]}],"solucao":"v, c = vendas.alias(\"v\"), cambio.alias(\"c\")\nresultado = (\n    v.join(c,\n           (F.col(\"v.moeda\") == F.col(\"c.codigo\")) & (F.col(\"v.data_venda\") == F.col(\"c.data_referencia\")),\n           \"left\")\n    .select(\"v.*\", F.col(\"c.taxa\"), (F.col(\"v.valor\") * F.col(\"c.taxa\")).alias(\"valor_brl\"))\n)"},"avancado":{"enunciado":"Faça um self-join para comparar cada venda com a venda anterior do mesmo cliente (por `seq`). Use aliases para evitar ambiguidade. Depois compare com a solução por janela (`lag`) e diga qual é mais simples.","dados":[{"tabela":"vendas","colunas":["id_cliente","seq","valor"],"tipos":["INT","INT","INT"],"linhas":[[1,1,10],[1,2,30],[2,1,5]]}],"solucao":"a, b = vendas.alias(\"a\"), vendas.alias(\"b\")\nresultado = (\n    a.join(b, (F.col(\"a.id_cliente\") == F.col(\"b.id_cliente\")) & (F.col(\"b.seq\") == F.col(\"a.seq\") - 1), \"left\")\n    .select(\"a.id_cliente\", \"a.seq\", \"a.valor\", F.col(\"b.valor\").alias(\"valor_anterior\"))\n)\n# Equivalente mais simples e sem join:\njanela = vendas.withColumn(\"valor_anterior\", F.lag(\"valor\").over(Window.partitionBy(\"id_cliente\").orderBy(\"seq\")))"}},"area":"pyspark","arquivo":"Joins em PySpark","secao":"Chaves com o mesmo nome","link":"cheatsheets.html#pyspark-07-chaves-com-o-mesmo-nome","semana":7},{"id":"spk-07-semi-anti","ref":"02_pyspark/07_joins-relacionais.md#semi-e-anti-join","ferramenta":"left_semi e left_anti","niveis":{"basico":{"enunciado":"Liste os clientes que acessaram o app e os que nunca acessaram.","dados":[{"tabela":"clientes","colunas":["cliente_id","nome"],"tipos":["INT","STRING"],"linhas":[[1,"Ana"],[2,"Bia"],[3,"Caio"]]},{"tabela":"acessos","colunas":["cliente_id","ts"],"tipos":["INT","STRING"],"linhas":[[1,"a"],[1,"b"],[3,"c"]]}],"solucao":"com_acesso = clientes.join(acessos, \"cliente_id\", \"left_semi\")\nresultado = clientes.join(acessos, \"cliente_id\", \"left_anti\")"},"intermediario":{"enunciado":"Mostre que `left_semi` não duplica clientes com vários acessos, ao contrário de um `inner join` seguido de `select`.","dados":[{"tabela":"clientes","colunas":["cliente_id","nome"],"tipos":["INT","STRING"],"linhas":[[1,"Ana"],[2,"Bia"]]},{"tabela":"acessos","colunas":["cliente_id","ts"],"tipos":["INT","STRING"],"linhas":[[1,"a"],[1,"b"],[1,"c"]]}],"solucao":"via_inner = clientes.join(acessos, \"cliente_id\").select(clientes.columns)   # 3 linhas da Ana\nresultado = clientes.join(acessos, \"cliente_id\", \"left_semi\")              # 1 linha da Ana"},"avancado":{"enunciado":"Encontre as vendas cujo produto não existe no catálogo **considerando o mesmo país** (chave composta) e grave-as em uma tabela de quarentena junto com o motivo.","dados":[{"tabela":"vendas","colunas":["id","produto_id","pais"],"tipos":["INT","INT","STRING"],"linhas":[[1,10,"BR"],[2,10,"AR"],[3,20,"BR"]]},{"tabela":"catalogo","colunas":["produto_id","pais"],"tipos":["INT","STRING"],"linhas":[[10,"BR"],[20,"BR"]]}],"solucao":"resultado = (\n    vendas.join(catalogo, [\"produto_id\", \"pais\"], \"left_anti\")\n    .withColumn(\"motivo\", F.lit(\"produto_inexistente_no_pais\"))\n    .withColumn(\"detectado_em\", F.current_timestamp())\n)\n# resultado.write.mode(\"append\").saveAsTable(\"main.quarentena.vendas\")"}},"area":"pyspark","arquivo":"Joins em PySpark","secao":"Semi e anti join","link":"cheatsheets.html#pyspark-07-semi-e-anti-join","semana":7},{"id":"spk-08-dedup-row-number","ref":"02_pyspark/08_window-functions.md#deduplicacao-deterministica","ferramenta":"Window + row_number com desempate","niveis":{"basico":{"enunciado":"Mantenha o evento mais recente de cada dispositivo.","dados":[{"tabela":"eventos","colunas":["dispositivo_id","evento_id","extraido_em"],"tipos":["INT","INT","TIMESTAMP"],"linhas":[[1,1,"2025-01-01T10:00:00"],[1,2,"2025-01-02T10:00:00"],[2,3,"2025-01-01T08:00:00"]]}],"solucao":"por_dispositivo = Window.partitionBy(\"dispositivo_id\").orderBy(F.col(\"extraido_em\").desc())\nresultado = (\n    eventos.withColumn(\"ordem\", F.row_number().over(por_dispositivo))\n    .filter(F.col(\"ordem\") == 1)\n    .drop(\"ordem\")\n)"},"intermediario":{"enunciado":"Dois eventos do dispositivo 1 têm o mesmo `extraido_em`. Garanta resultado determinístico e mostre a diferença entre `row_number`, `rank` e `dense_rank` nesse empate.","dados":[{"tabela":"eventos","colunas":["dispositivo_id","evento_id","extraido_em"],"tipos":["INT","INT","TIMESTAMP"],"linhas":[[1,1,"2025-01-02T10:00:00"],[1,2,"2025-01-02T10:00:00"],[1,3,"2025-01-01T10:00:00"]]}],"solucao":"so_data = Window.partitionBy(\"dispositivo_id\").orderBy(F.col(\"extraido_em\").desc())\ncom_desempate = Window.partitionBy(\"dispositivo_id\").orderBy(F.col(\"extraido_em\").desc(), F.col(\"evento_id\").desc())\nresultado = eventos.withColumns({\n    \"row_number\": F.row_number().over(com_desempate),\n    \"rank\": F.rank().over(so_data),          # 1, 1, 3\n    \"dense_rank\": F.dense_rank().over(so_data),  # 1, 1, 2\n})"},"avancado":{"enunciado":"Implemente uma função reutilizável `ultima_versao(df, chaves, ordem)` que devolva a última versão por chave e falhe se alguma coluna de ordenação tiver nulo (o que tornaria a escolha ambígua).","dados":[{"tabela":"eventos","colunas":["id","versao","ts"],"tipos":["INT","INT","TIMESTAMP"],"linhas":[[1,1,"2025-01-01T00:00:00"],[1,2,"2025-01-02T00:00:00"],[2,1,"2025-01-01T00:00:00"]]}],"solucao":"def ultima_versao(df, chaves, ordem):\n    nulos = df.filter(\" OR \".join(f\"{c} IS NULL\" for c in ordem)).limit(1).count()\n    if nulos:\n        raise ValueError(f\"Colunas de ordenação com nulo: {ordem}\")\n    janela = Window.partitionBy(*chaves).orderBy(*[F.col(c).desc() for c in ordem])\n    return df.withColumn(\"_rn\", F.row_number().over(janela)).filter(\"_rn = 1\").drop(\"_rn\")\n\nresultado = ultima_versao(eventos, [\"id\"], [\"ts\", \"versao\"])"}},"area":"pyspark","arquivo":"Window Functions em PySpark","secao":"Deduplicação determinística","link":"cheatsheets.html#pyspark-08-deduplicacao-deterministica","semana":8},{"id":"spk-08-frames-tempo","ref":"02_pyspark/08_window-functions.md#frames-e-tempo","ferramenta":"rowsBetween × rangeBetween","niveis":{"basico":{"enunciado":"Calcule a média móvel das últimas 3 linhas por segmento.","dados":[{"tabela":"metricas","colunas":["segmento","data_referencia","valor"],"tipos":["STRING","DATE","INT"],"linhas":[["A","2025-01-01",10],["A","2025-01-02",20],["A","2025-01-03",30],["A","2025-01-04",40]]}],"solucao":"ultimas_tres = Window.partitionBy(\"segmento\").orderBy(\"data_referencia\").rowsBetween(-2, Window.currentRow)\nresultado = metricas.withColumn(\"media_3_linhas\", F.avg(\"valor\").over(ultimas_tres))"},"intermediario":{"enunciado":"A série tem dias faltando. Calcule a soma dos últimos 7 dias corridos com `rangeBetween` sobre o número de dias da data.","dados":[{"tabela":"metricas","colunas":["segmento","data_referencia","valor"],"tipos":["STRING","DATE","INT"],"linhas":[["A","2025-01-01",10],["A","2025-01-05",20],["A","2025-01-09",30],["A","2025-01-10",40]]}],"solucao":"dias = F.datediff(F.col(\"data_referencia\"), F.lit(\"1970-01-01\"))\nsete_dias = Window.partitionBy(\"segmento\").orderBy(dias).rangeBetween(-6, 0)\nresultado = metricas.withColumn(\"soma_7_dias\", F.sum(\"valor\").over(sete_dias))"},"avancado":{"enunciado":"Com eventos de timestamp, calcule a quantidade de eventos do mesmo usuário na última hora (janela deslizante de 3600 segundos) em cada evento.","dados":[{"tabela":"eventos","colunas":["usuario","ts"],"tipos":["STRING","TIMESTAMP"],"linhas":[["u1","2025-01-01T10:00:00"],["u1","2025-01-01T10:30:00"],["u1","2025-01-01T11:15:00"],["u1","2025-01-01T12:20:00"]]}],"solucao":"segundos = F.col(\"ts\").cast(\"long\")\nultima_hora = Window.partitionBy(\"usuario\").orderBy(segundos).rangeBetween(-3600, 0)\nresultado = eventos.withColumn(\"eventos_ultima_hora\", F.count(\"*\").over(ultima_hora))\n# 10:00 -> 1; 10:30 -> 2; 11:15 -> 2; 12:20 -> 1"}},"area":"pyspark","arquivo":"Window Functions em PySpark","secao":"Frames e tempo","link":"cheatsheets.html#pyspark-08-frames-e-tempo","semana":8},{"id":"spk-08-lag-acumulado","ref":"02_pyspark/08_window-functions.md#lag-e-acumulado","ferramenta":"lag, lead e soma acumulada","niveis":{"basico":{"enunciado":"Para cada cliente, traga o valor do evento anterior.","dados":[{"tabela":"eventos","colunas":["cliente_id","evento_em","evento_id","valor"],"tipos":["INT","TIMESTAMP","INT","INT"],"linhas":[[1,"2025-01-01T00:00:00",1,100],[1,"2025-01-02T00:00:00",2,80],[2,"2025-01-01T00:00:00",3,10]]}],"solucao":"ordem_cliente = Window.partitionBy(\"cliente_id\").orderBy(\"evento_em\", \"evento_id\")\nresultado = eventos.withColumn(\"valor_anterior\", F.lag(\"valor\").over(ordem_cliente))"},"intermediario":{"enunciado":"Calcule o saldo acumulado por conta e a variação de cada movimento em relação ao próximo (`lead`).","dados":[{"tabela":"movimentos","colunas":["conta_id","data_movimento","movimento_id","valor"],"tipos":["INT","DATE","INT","INT"],"linhas":[[1,"2025-01-01",1,100],[1,"2025-01-02",2,-30],[1,"2025-01-03",3,50],[2,"2025-01-01",4,10]]}],"solucao":"ordem = Window.partitionBy(\"conta_id\").orderBy(\"data_movimento\", \"movimento_id\")\nacumulado = ordem.rowsBetween(Window.unboundedPreceding, Window.currentRow)\nresultado = movimentos.withColumns({\n    \"saldo\": F.sum(\"valor\").over(acumulado),\n    \"proximo_valor\": F.lead(\"valor\").over(ordem),\n})"},"avancado":{"enunciado":"Identifique sessões: um novo evento abre sessão quando passa mais de 30 minutos desde o evento anterior do mesmo usuário. Numere as sessões por usuário.","dados":[{"tabela":"cliques","colunas":["usuario","ts"],"tipos":["STRING","TIMESTAMP"],"linhas":[["u1","2025-01-01T10:00:00"],["u1","2025-01-01T10:20:00"],["u1","2025-01-01T11:30:00"],["u2","2025-01-01T09:00:00"]]}],"solucao":"ordem = Window.partitionBy(\"usuario\").orderBy(\"ts\")\nresultado = (\n    cliques\n    .withColumn(\"gap_min\", (F.col(\"ts\").cast(\"long\") - F.lag(F.col(\"ts\").cast(\"long\")).over(ordem)) / 60)\n    .withColumn(\"nova_sessao\", F.when(F.col(\"gap_min\").isNull() | (F.col(\"gap_min\") > 30), 1).otherwise(0))\n    .withColumn(\"sessao\", F.sum(\"nova_sessao\").over(ordem.rowsBetween(Window.unboundedPreceding, Window.currentRow)))\n)"}},"area":"pyspark","arquivo":"Window Functions em PySpark","secao":"Lag e acumulado","link":"cheatsheets.html#pyspark-08-lag-e-acumulado","semana":8},{"id":"spk-09-colunas-ausentes","ref":"02_pyspark/09_json-structs-schemas.md#colunas-obrigatorias-ausentes","ferramenta":"Completar schema com lit(None).cast","niveis":{"basico":{"enunciado":"A carga de hoje não trouxe a coluna `campo_opcional` (string). Adicione-a como nula com o tipo correto.","dados":[{"tabela":"evento","colunas":["id","nome"],"tipos":["BIGINT","STRING"],"linhas":[[1,"Ana"]]}],"solucao":"resultado = evento.withColumn(\"campo_opcional\", F.lit(None).cast(\"string\"))"},"intermediario":{"enunciado":"Garanta todas as colunas obrigatórias de um contrato (dicionário nome → tipo), adicionando só as ausentes, e entregue as colunas na ordem do contrato.","dados":[{"tabela":"evento","colunas":["nome","id"],"tipos":["STRING","BIGINT"],"linhas":[["Ana",1]]}],"solucao":"contrato = {\"id\": \"bigint\", \"nome\": \"string\", \"campo_opcional\": \"string\", \"valor\": \"decimal(10,2)\"}\nresultado = (\n    evento\n    .withColumns({c: F.lit(None).cast(t) for c, t in contrato.items() if c not in evento.columns})\n    .select(*contrato)\n)"},"avancado":{"enunciado":"Estenda a função para também converter as colunas existentes ao tipo do contrato e reportar colunas que vieram a mais (fora do contrato) em vez de descartá-las silenciosamente.","dados":[{"tabela":"evento","colunas":["id","valor","extra"],"tipos":["STRING","STRING","STRING"],"linhas":[["1","10.5","x"]]}],"solucao":"def conformar(df, contrato):\n    extras = sorted(set(df.columns) - set(contrato))\n    if extras:\n        print(f\"Colunas fora do contrato: {extras}\")\n    return df.select(*[\n        (F.col(c).cast(t) if c in df.columns else F.lit(None).cast(t)).alias(c)\n        for c, t in contrato.items()\n    ])\n\nresultado = conformar(evento, {\"id\": \"bigint\", \"valor\": \"decimal(10,2)\", \"nome\": \"string\"})"}},"area":"pyspark","arquivo":"JSON, Structs e Schemas (PySpark)","secao":"Colunas obrigatórias ausentes","link":"cheatsheets.html#pyspark-09-colunas-obrigatorias-ausentes","semana":7},{"id":"spk-09-explode","ref":"02_pyspark/09_json-structs-schemas.md#explode-de-arrays","ferramenta":"split, explode_outer, filter/aggregate","niveis":{"basico":{"enunciado":"Transforme a lista de tags separada por vírgula em uma linha por tag.","dados":[{"tabela":"receitas","colunas":["id","tags_texto"],"tipos":["INT","STRING"],"linhas":[[1,"livro,caneta"],[2,"lapis"]]}],"solucao":"resultado = (\n    receitas\n    .withColumn(\"tag\", F.explode(F.split(\"tags_texto\", \",\")))\n    .select(\"id\", \"tag\")\n)"},"intermediario":{"enunciado":"Gere uma linha por item com a posição, mantendo pedidos sem itens (array vazio ou nulo).","dados":[{"tabela":"pedidos","colunas":["id_pedido","itens"],"tipos":["INT","ARRAY<STRING>"],"linhas":[[1,["A","B"]],[2,[]],[3,null]]}],"solucao":"resultado = pedidos.select(\"id_pedido\", F.posexplode_outer(\"itens\").alias(\"pos\", \"item\"))"},"avancado":{"enunciado":"Sem explodir, calcule por pedido o total dos itens (decimal) e a lista de itens caros (valor > 25).","dados":[{"tabela":"pedidos","colunas":["id_pedido","itens"],"tipos":["INT","ARRAY<STRUCT<cod: INT, valor: DECIMAL(10,2)>>"],"linhas":[[1,[{"cod":1,"valor":20.0},{"cod":2,"valor":30.0}]],[2,[{"cod":3,"valor":50.0}]]]}],"executavel":false,"solucao":"resultado = pedidos.withColumns({\n    \"itens_caros\": F.filter(\"itens\", lambda x: x[\"valor\"] > 25),\n    \"total\": F.aggregate(\n        \"itens\",\n        F.lit(0).cast(\"decimal(12,2)\"),\n        lambda acc, x: (acc + x[\"valor\"]).cast(\"decimal(12,2)\"),\n    ),\n})"}},"area":"pyspark","arquivo":"JSON, Structs e Schemas (PySpark)","secao":"Explode de arrays","link":"cheatsheets.html#pyspark-09-explode-de-arrays","semana":7},{"id":"spk-09-schema-from-json","ref":"02_pyspark/09_json-structs-schemas.md#schema-explicito-na-leitura-e-from-json","ferramenta":"StructType, from_json e registros corrompidos","niveis":{"basico":{"enunciado":"Converta o JSON em texto para struct usando um schema DDL e projete nome e idade.","dados":[{"tabela":"bronze","colunas":["payload_txt"],"tipos":["STRING"],"linhas":[["{\"nome\":\"Ana\",\"idade\":30,\"ativo\":true}"],["{\"nome\":\"Bia\",\"idade\":25}"]]}],"solucao":"schema_evento = \"STRUCT<nome: STRING, idade: INT, ativo: BOOLEAN>\"\nresultado = bronze.select(F.from_json(\"payload_txt\", schema_evento).alias(\"e\")).select(\"e.nome\", \"e.idade\")"},"intermediario":{"enunciado":"Use `schema_of_json` em um exemplo para sugerir o schema, imprima-o e então aplique um schema fixo revisado (com `valor` decimal).","dados":[{"tabela":"bronze","colunas":["payload_txt"],"tipos":["STRING"],"linhas":[["{\"id\":1,\"valor\":10.5}"],["{\"id\":2,\"valor\":3}"]]}],"solucao":"sugerido = spark.range(1).select(F.schema_of_json(F.lit('{\"id\":1,\"valor\":10.5}'))).first()[0]\nprint(sugerido)   # STRUCT<id: BIGINT, valor: DOUBLE>\nschema_fixo = \"STRUCT<id: BIGINT, valor: DECIMAL(10,2)>\"\nresultado = bronze.select(F.from_json(\"payload_txt\", schema_fixo).alias(\"v\")).select(\"v.*\")"},"avancado":{"enunciado":"Leia arquivos JSON de vendas com schema explícito capturando registros fora do schema em `_corrupt`, conte-os e grave os inválidos em quarentena.","dados":null,"solucao":"schema_vendas = T.StructType([\n    T.StructField(\"id_venda\", T.StringType()),\n    T.StructField(\"valor\", T.DecimalType(12, 2)),\n    T.StructField(\"_corrupt\", T.StringType()),\n])\ndf = (\n    spark.read.schema(schema_vendas)\n    .option(\"columnNameOfCorruptRecord\", \"_corrupt\")\n    .json(\"/Volumes/main/bronze/landing/vendas/\")\n)\ninvalidos = df.filter(F.col(\"_corrupt\").isNotNull())\nprint(invalidos.count())\ninvalidos.write.mode(\"append\").saveAsTable(\"main.quarentena.vendas_json\")\nresultado = df.filter(F.col(\"_corrupt\").isNull()).drop(\"_corrupt\")"}},"area":"pyspark","arquivo":"JSON, Structs e Schemas (PySpark)","secao":"Schema explícito na leitura e from_json","link":"cheatsheets.html#pyspark-09-schema-explicito-na-leitura-e-from-json","semana":7},{"id":"spk-09-struct-json-texto","ref":"02_pyspark/09_json-structs-schemas.md#acessar-campos-de-structs-e-de-texto-json","ferramenta":"Notação de ponto e get_json_object","niveis":{"basico":{"enunciado":"A coluna `metadata` já é struct. Projete a versão TLS aninhada em `metadata.rede.versao_tls`.","dados":null,"solucao":"resultado = df_ingestao.select(\n    \"id_registro\",\n    F.col(\"metadata.rede.versao_tls\").alias(\"versao_tls\"),\n)"},"intermediario":{"enunciado":"A coluna `payload_txt` é texto JSON. Extraia o primeiro identificador e o nome do cliente.","dados":[{"tabela":"bronze","colunas":["id","payload_txt"],"tipos":["INT","STRING"],"linhas":[[1,"{\"root\":{\"ids\":[\"A1\",\"A2\"]},\"cliente\":{\"nome\":\"Ana\"}}"],[2,"{\"root\":{\"ids\":[]}}"]]}],"solucao":"resultado = bronze.select(\n    \"id\",\n    F.get_json_object(\"payload_txt\", \"$.root.ids[0]\").alias(\"primeiro_id\"),\n    F.get_json_object(\"payload_txt\", \"$.cliente.nome\").alias(\"nome\"),\n)"},"avancado":{"enunciado":"Converta o texto para struct uma única vez e expanda todos os campos do cliente em colunas com `cliente.*`. Compare o plano com a versão que chama `get_json_object` três vezes.","dados":[{"tabela":"bronze","colunas":["payload_txt"],"tipos":["STRING"],"linhas":[["{\"cliente\":{\"id\":1,\"nome\":\"Ana\",\"uf\":\"SP\"}}"]]}],"solucao":"schema = \"STRUCT<cliente: STRUCT<id: INT, nome: STRING, uf: STRING>>\"\nresultado = bronze.select(F.from_json(\"payload_txt\", schema).alias(\"j\")).select(\"j.cliente.*\")\nresultado.explain()\n# Uma conversão (from_json) em vez de três parsings do mesmo texto."}},"area":"pyspark","arquivo":"JSON, Structs e Schemas (PySpark)","secao":"Acessar campos de structs e de texto JSON","link":"cheatsheets.html#pyspark-09-acessar-campos-de-structs-e-de-texto-json","semana":7},{"id":"spk-09-variant","ref":"02_pyspark/09_json-structs-schemas.md#variant","ferramenta":"parse_json e try_variant_get (Python)","niveis":{"basico":{"enunciado":"Converta o texto JSON para VARIANT e extraia o campo `a.b` como inteiro.","dados":[{"tabela":"bronze","colunas":["payload_txt"],"tipos":["STRING"],"linhas":[["{\"a\":{\"b\":2}}"],["{\"a\":{}}"]]}],"solucao":"resultado = bronze.select(F.try_variant_get(F.parse_json(\"payload_txt\"), \"$.a.b\", \"int\").alias(\"b\"))"},"intermediario":{"enunciado":"O campo `valor` vem em formatos diferentes. Extraia-o como decimal e conte quantos não puderam ser convertidos.","dados":[{"tabela":"bronze","colunas":["payload_txt"],"tipos":["STRING"],"linhas":[["{\"valor\":10.5}"],["{\"valor\":\"x\"}"],["{\"valor\":null}"],["{}"]]}],"solucao":"v = F.parse_json(\"payload_txt\")\nresultado = bronze.select(\n    F.try_variant_get(v, \"$.valor\", \"decimal(10,2)\").alias(\"valor\"),\n    F.variant_get(v, \"$.valor\", \"string\").alias(\"valor_bruto\"),\n).agg(F.count_if(F.col(\"valor_bruto\").isNotNull() & F.col(\"valor\").isNull()).alias(\"nao_convertidos\"))"},"avancado":{"enunciado":"Na sua base (Spark 4.0+ ou DBR 15.3+), grave uma tabela com coluna VARIANT a partir de um JSON instável e escreva a consulta que lista as chaves de primeiro nível presentes e sua frequência.","dados":null,"solucao":"df = spark.read.table(\"main.bronze.eventos\").withColumn(\"v\", F.parse_json(\"payload\"))\ndf.write.mode(\"overwrite\").saveAsTable(\"main.tmp.eventos_variant\")\nspark.sql(\"\"\"\n    SELECT key, COUNT(*) AS n\n    FROM main.tmp.eventos_variant, LATERAL variant_explode(v)\n    GROUP BY key ORDER BY n DESC\n\"\"\").show()"}},"area":"pyspark","arquivo":"JSON, Structs e Schemas (PySpark)","secao":"VARIANT","link":"cheatsheets.html#pyspark-09-variant","semana":7},{"id":"spk-10-merge","ref":"02_pyspark/10_delta-lake-api.md#merge","ferramenta":"DeltaTable.merge","niveis":{"basico":{"enunciado":"Com `DeltaTable`, faça upsert de `df_incremental` em `gold.vendas` pela chave `venda_id` (atualiza preço ou insere).","dados":null,"solucao":"from delta.tables import DeltaTable\n\ntarget = DeltaTable.forName(spark, \"gold.vendas\")\n(\n    target.alias(\"t\")\n    .merge(df_incremental.alias(\"s\"), \"t.venda_id = s.venda_id\")\n    .whenMatchedUpdate(set={\"preco\": \"s.preco\"})\n    .whenNotMatchedInsert(values={\"venda_id\": \"s.venda_id\", \"preco\": \"s.preco\"})\n    .execute()\n)"},"intermediario":{"enunciado":"Antes do merge, deduplique a origem (mais recente por `venda_id`) e só atualize quando o preço mudou, inclusive de/para nulo. Prepare a origem e mostre o resultado do passo de deduplicação.","dados":[{"tabela":"df_incremental","colunas":["venda_id","preco","extraido_em"],"tipos":["INT","DECIMAL(10,2)","TIMESTAMP"],"linhas":[[2,22.0,"2025-01-01T10:00:00"],[2,25.0,"2025-01-01T11:00:00"],[3,30.0,"2025-01-01T10:00:00"]]}],"solucao":"ultima = Window.partitionBy(\"venda_id\").orderBy(F.col(\"extraido_em\").desc())\nresultado = (\n    df_incremental.withColumn(\"rn\", F.row_number().over(ultima))\n    .filter(\"rn = 1\").drop(\"rn\", \"extraido_em\")\n)\n# Depois:\n# target.alias(\"t\").merge(resultado.alias(\"s\"), \"t.venda_id = s.venda_id\")\n#   .whenMatchedUpdate(condition=\"NOT (t.preco <=> s.preco)\", set={\"preco\": \"s.preco\"})\n#   .whenNotMatchedInsertAll().execute()"},"avancado":{"enunciado":"Na sua base, envolva um merge real numa função que valide a unicidade da origem pela chave antes de executar e registre as métricas da operação (`history(1)`) depois.","dados":null,"solucao":"from delta.tables import DeltaTable\n\ndef merge_seguro(df_origem, tabela, chave):\n    dup = df_origem.groupBy(chave).count().filter(\"count > 1\").limit(1).count()\n    if dup:\n        raise ValueError(f\"Origem com chaves duplicadas em {chave}\")\n    alvo = DeltaTable.forName(spark, tabela)\n    cond = \" AND \".join(f\"t.{c} = s.{c}\" for c in chave)\n    (alvo.alias(\"t\").merge(df_origem.alias(\"s\"), cond)\n         .whenMatchedUpdateAll().whenNotMatchedInsertAll().execute())\n    return alvo.history(1).select(\"version\", \"operationMetrics\").first()"}},"area":"pyspark","arquivo":"Delta Lake API em PySpark","secao":"Merge","link":"cheatsheets.html#pyspark-10-merge","semana":5},{"id":"spk-10-mergeschema","ref":"02_pyspark/10_delta-lake-api.md#evolucao-de-schema","ferramenta":"mergeSchema","niveis":{"basico":{"enunciado":"Acrescente linhas com uma coluna nova em `silver.clientes`, permitindo a evolução de schema.","dados":null,"solucao":"(\n    df_com_novas_colunas.write\n    .format(\"delta\")\n    .mode(\"append\")\n    .option(\"mergeSchema\", \"true\")\n    .saveAsTable(\"silver.clientes\")\n)"},"intermediario":{"enunciado":"Antes de habilitar `mergeSchema`, compare o schema da origem com o da tabela e liste colunas novas e colunas com tipo diferente.","dados":[{"tabela":"tabela_atual","colunas":["id","nome"],"tipos":["BIGINT","STRING"],"linhas":[[1,"Ana"]]},{"tabela":"origem","colunas":["id","nome","email"],"tipos":["STRING","STRING","STRING"],"linhas":[["2","Bia","b@x"]]}],"solucao":"atual = dict(tabela_atual.dtypes)\nnovo = dict(origem.dtypes)\nresultado = {\n    \"colunas_novas\": sorted(set(novo) - set(atual)),\n    \"tipo_diferente\": {c: (atual[c], novo[c]) for c in atual.keys() & novo.keys() if atual[c] != novo[c]},\n}\n# id chegou como string: corrigir o cast antes de gravar, não deixar o merge decidir."},"avancado":{"enunciado":"Na sua base, crie uma checagem que bloqueie a escrita se a origem trouxer colunas fora de uma lista aprovada, e só então grave com `mergeSchema`.","dados":null,"solucao":"aprovadas = {\"id\", \"nome\", \"email\", \"telefone\"}\nnao_aprovadas = set(df.columns) - aprovadas\nif nao_aprovadas:\n    raise ValueError(f\"Colunas não aprovadas: {sorted(nao_aprovadas)}\")\ndf.write.mode(\"append\").option(\"mergeSchema\", \"true\").saveAsTable(\"silver.clientes\")"}},"area":"pyspark","arquivo":"Delta Lake API em PySpark","secao":"Evolução de schema","link":"cheatsheets.html#pyspark-10-evolucao-de-schema","semana":5},{"id":"spk-10-optimize-clustering","ref":"02_pyspark/10_delta-lake-api.md#otimizacao-e-layout","ferramenta":"optimize().executeCompaction() e clusterBy","niveis":{"basico":{"enunciado":"Compacte os arquivos pequenos de `gold.vendas` pela API Python.","dados":null,"solucao":"from delta.tables import DeltaTable\n\nDeltaTable.forName(spark, \"gold.vendas\").optimize().executeCompaction()"},"intermediario":{"enunciado":"Crie a tabela `main.gold.vendas_lc` a partir de um DataFrame já com liquid clustering por data e loja.","dados":null,"solucao":"(\n    df_vendas.writeTo(\"main.gold.vendas_lc\")\n    .clusterBy(\"dt_venda\", \"loja_id\")\n    .createOrReplace()\n)"},"avancado":{"enunciado":"Na sua base, meça o número de arquivos e o tamanho médio antes e depois de `executeCompaction()` em uma tabela com muitas escritas pequenas e registre o ganho em uma consulta típica.","dados":null,"solucao":"def resumo(tabela):\n    d = spark.sql(f\"DESCRIBE DETAIL {tabela}\").first()\n    return d[\"
