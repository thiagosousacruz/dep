numFiles\"], d[\"sizeInBytes\"] / max(d[\"numFiles\"], 1) / 1024**2\n\nprint(\"antes\", resumo(\"gold.vendas\"))\nDeltaTable.forName(spark, \"gold.vendas\").optimize().executeCompaction()\nprint(\"depois\", resumo(\"gold.vendas\"))"}},"area":"pyspark","arquivo":"Delta Lake API em PySpark","secao":"Otimização e layout","link":"cheatsheets.html#pyspark-10-otimizacao-e-layout","semana":5},{"id":"spk-10-restore-vacuum","ref":"02_pyspark/10_delta-lake-api.md#restore-e-vacuum","ferramenta":"history, restoreToVersion, vacuum","niveis":{"basico":{"enunciado":"Mostre as últimas 5 operações da tabela `gold.vendas` com versão, operação e data.","dados":null,"solucao":"from delta.tables import DeltaTable\n\nDeltaTable.forName(spark, \"gold.vendas\").history(5).select(\"version\", \"timestamp\", \"operation\").show()"},"intermediario":{"enunciado":"Leia a versão anterior da tabela, compare a contagem com a atual e restaure se a versão atual perdeu mais de 10% das linhas.","dados":null,"solucao":"from delta.tables import DeltaTable\n\nalvo = DeltaTable.forName(spark, \"gold.vendas\")\natual = alvo.history(1).first()[\"version\"]\nn_atual = spark.read.table(\"gold.vendas\").count()\nn_anterior = spark.read.option(\"versionAsOf\", atual - 1).table(\"gold.vendas\").count()\nif n_anterior and n_atual < 0.9 * n_anterior:\n    alvo.restoreToVersion(atual - 1)"},"avancado":{"enunciado":"Antes de rodar `vacuum`, verifique se a retenção configurada cobre a janela de time travel que o time precisa (ex.: 14 dias) e só então execute.","dados":null,"solucao":"from delta.tables import DeltaTable\n\nprops = {r[\"key\"]: r[\"value\"] for r in spark.sql(\"SHOW TBLPROPERTIES gold.vendas\").collect()}\nretencao = props.get(\"delta.deletedFileRetentionDuration\", \"interval 7 days\")\nprint(retencao)\n# Se for menor que 14 dias, ajuste antes:\n# ALTER TABLE gold.vendas SET TBLPROPERTIES ('delta.deletedFileRetentionDuration' = 'interval 14 days')\nDeltaTable.forName(spark, \"gold.vendas\").vacuum(14 * 24)"}},"area":"pyspark","arquivo":"Delta Lake API em PySpark","secao":"Restore e vacuum","link":"cheatsheets.html#pyspark-10-restore-e-vacuum","semana":5},{"id":"spk-11-dbutils-fs","ref":"02_pyspark/11_dbutils-workspace.md#arquivos-dbutils-fs-e-volumes","ferramenta":"dbutils.fs e Volumes","niveis":{"basico":{"enunciado":"Liste os arquivos de um Volume mostrando nome, tamanho em KB e data de modificação.","dados":null,"solucao":"from datetime import datetime\n\nfor f in dbutils.fs.ls(\"/Volumes/main/silver/arquivos/lotes/\"):\n    print(f.name, round(f.size / 1024, 1), datetime.fromtimestamp(f.modificationTime / 1000))"},"intermediario":{"enunciado":"Mova para a pasta `processados/` os arquivos `.csv` da pasta de entrada que já foram carregados (lista recebida em `carregados`).","dados":null,"solucao":"entrada = \"/Volumes/main/bronze/landing/entrada/\"\ndestino = \"/Volumes/main/bronze/landing/processados/\"\ncarregados = {\"lote_01.csv\", \"lote_02.csv\"}\n\nfor f in dbutils.fs.ls(entrada):\n    if f.name.endswith(\".csv\") and f.name in carregados:\n        dbutils.fs.mv(f.path, destino + f.name)"},"avancado":{"enunciado":"Escreva uma função de limpeza que apague uma pasta temporária com `rm(recurse=True)` só se o caminho estiver dentro de um prefixo permitido e não for uma tabela Delta.","dados":null,"solucao":"PREFIXO_PERMITIDO = \"/Volumes/main/tmp/\"\n\ndef limpar(caminho):\n    if not caminho.startswith(PREFIXO_PERMITIDO) or \"..\" in caminho:\n        raise ValueError(f\"Caminho fora do permitido: {caminho}\")\n    nomes = {f.name.rstrip(\"/\") for f in dbutils.fs.ls(caminho)}\n    if \"_delta_log\" in nomes:\n        raise ValueError(\"Pasta é uma tabela Delta: use DROP/DELETE/VACUUM\")\n    dbutils.fs.rm(caminho, recurse=True)"}},"area":"pyspark","arquivo":"Databricks Utilities (dbutils)","secao":"Arquivos: dbutils.fs e Volumes","link":"cheatsheets.html#pyspark-11-arquivos-dbutils-fs-e-volumes","semana":10},{"id":"spk-11-secrets","ref":"02_pyspark/11_dbutils-workspace.md#segredos","ferramenta":"dbutils.secrets","niveis":{"basico":{"enunciado":"Leia usuário e senha do scope `erp-prod` e use-os em uma leitura JDBC.","dados":null,"solucao":"usuario = dbutils.secrets.get(scope=\"erp-prod\", key=\"usuario\")\nsenha = dbutils.secrets.get(scope=\"erp-prod\", key=\"senha\")\n\ndf = spark.read.jdbc(\n    url=\"jdbc:oracle:thin:@servidor:1521/XDB\",\n    table=\"VENDAS\",\n    properties={\"user\": usuario, \"password\": senha},\n)"},"intermediario":{"enunciado":"Liste os scopes disponíveis e as chaves do scope `erp-prod` sem revelar valores.","dados":null,"solucao":"for s in dbutils.secrets.listScopes():\n    print(s.name)\nfor k in dbutils.secrets.list(\"erp-prod\"):\n    print(k.key)"},"avancado":{"enunciado":"Na sua base, procure credenciais escritas em notebooks, arquivos de configuração ou parâmetros de job. Para cada uma, proponha o scope/chave de destino e quem deve ter permissão de leitura.","dados":null,"solucao":"# Busca no repositório: grep -rniE 'password|senha|token|secret|apikey' --include=*.py --include=*.json .\n# Para cada ocorrência: criar a chave no scope (CLI: databricks secrets put-secret <scope> <chave>),\n# substituir no código por dbutils.secrets.get e conceder READ só ao grupo/service principal do job."}},"area":"pyspark","arquivo":"Databricks Utilities (dbutils)","secao":"Segredos","link":"cheatsheets.html#pyspark-11-segredos","semana":10},{"id":"spk-11-widgets","ref":"02_pyspark/11_dbutils-workspace.md#parametros-widgets-e-job-parameters","ferramenta":"dbutils.widgets","niveis":{"basico":{"enunciado":"Crie um widget de texto `data_corte` (padrão 2025-01-01) e um dropdown `ambiente` (dev, hml, prod) e leia os valores.","dados":null,"solucao":"dbutils.widgets.text(\"data_corte\", \"2025-01-01\", \"Data de corte\")\ndbutils.widgets.dropdown(\"ambiente\", \"dev\", [\"dev\", \"hml\", \"prod\"], \"Ambiente\")\n\ndata_corte = dbutils.widgets.get(\"data_corte\")\nambiente = dbutils.widgets.get(\"ambiente\")"},"intermediario":{"enunciado":"Valide os parâmetros: a data deve ser ISO válida e não futura; o ambiente deve estar na lista. Falhe com mensagem clara.","dados":null,"solucao":"import datetime as dt\n\ntry:\n    data_corte = dt.date.fromisoformat(dbutils.widgets.get(\"data_corte\"))\nexcept ValueError:\n    raise ValueError(\"data_corte deve estar no formato AAAA-MM-DD\")\nif data_corte > dt.date.today():\n    raise ValueError(\"data_corte não pode ser futura\")\n\nambiente = dbutils.widgets.get(\"ambiente\")\nif ambiente not in {\"dev\", \"hml\", \"prod\"}:\n    raise ValueError(f\"Ambiente inválido: {ambiente}\")"},"avancado":{"enunciado":"Na sua base, escolha um notebook com datas ou ambientes fixos no código. Transforme-os em parâmetros, configure-os como job parameters na tarefa do job e rode-o para dois valores diferentes.","dados":null,"solucao":"# No notebook: widgets com padrão seguro (dev) e validação como no nível intermediário.\n# No job (Workflows > tarefa > Parameters): data_corte = {{job.start_time.iso_date}}, ambiente = prod\n# Rode 'Run now with different parameters' para testar outra data sem editar o código."}},"area":"pyspark","arquivo":"Databricks Utilities (dbutils)","secao":"Parâmetros: widgets e job parameters","link":"cheatsheets.html#pyspark-11-parametros-widgets-e-job-parameters","semana":10},{"id":"spk-12-expectativas","ref":"02_pyspark/12_data-quality-operacional.md#frameworks-e-expectativas-declarativas","ferramenta":"Expectations (Lakeflow/DLT) e restrições Delta","niveis":{"basico":{"enunciado":"Em um pipeline declarativo (Lakeflow/DLT), defina uma tabela Silver que descarte linhas com `id_cliente` nulo e falhe se aparecer idade negativa.","dados":null,"solucao":"import dlt\n\n@dlt.table(name=\"clientes_silver\")\n@dlt.expect_or_drop(\"id_preenchido\", \"id_cliente IS NOT NULL\")\n@dlt.expect_or_fail(\"idade_nao_negativa\", \"idade >= 0\")\ndef clientes_silver():\n    return spark.read.table(\"main.bronze.clientes\")"},"intermediario":{"enunciado":"Sem DLT, implemente o mesmo comportamento em PySpark: separe as linhas válidas, as descartadas (com motivo) e falhe na regra crítica.","dados":[{"tabela":"bronze","colunas":["id_cliente","idade"],"tipos":["INT","INT"],"linhas":[[1,30],[null,20],[3,40]]}],"solucao":"if bronze.filter(F.col(\"idade\") < 0).limit(1).count():\n    raise ValueError(\"idade negativa encontrada\")\nvalida = F.col(\"id_cliente\").isNotNull()\nresultado = bronze.filter(valida)\ndescartadas = bronze.filter(~valida).withColumn(\"motivo\", F.lit(\"id_cliente nulo\"))"},"avancado":{"enunciado":"Na sua base, escolha um pipeline com checagens em `if`/`print`. Liste as regras, classifique cada uma em warn/drop/fail e proponha onde cada uma deve morar (restrição Delta, expectation ou código).","dados":null,"solucao":"| regra | ação | onde |\n|---|---|---|\n| id não nulo | fail | ALTER TABLE ... ALTER COLUMN id SET NOT NULL |\n| idade 0–120 | drop + quarentena | expectation / código com left_anti |\n| % e-mail nulo < 25% | warn | métrica do pipeline + alerta |"}},"area":"pyspark","arquivo":"Data Quality Operacional (PySpark)","secao":"Frameworks e expectativas declarativas","link":"cheatsheets.html#pyspark-12-frameworks-e-expectativas-declarativas","semana":7},{"id":"spk-12-nulos-coluna","ref":"02_pyspark/12_data-quality-operacional.md#percentual-de-nulos-por-coluna","ferramenta":"Percentual de nulos em uma ação","niveis":{"basico":{"enunciado":"Calcule o percentual de nulos da coluna telefone.","dados":[{"tabela":"clientes","colunas":["id","telefone"],"tipos":["INT","STRING"],"linhas":[[1,"9"],[2,null],[3,null],[4,"8"]]}],"solucao":"resultado = clientes.select((F.avg(F.col(\"telefone\").isNull().cast(\"int\")) * 100).alias(\"pct_nulo\"))"},"intermediario":{"enunciado":"Calcule o percentual de nulos de todas as colunas em uma única ação e liste as que passam de 25%.","dados":[{"tabela":"clientes","colunas":["id","telefone","email","cpf"],"tipos":["INT","STRING","STRING","STRING"],"linhas":[[1,"9",null,"1"],[2,null,null,"2"],[3,null,"c@x","3"],[4,"8","d@x","4"]]}],"solucao":"linha = clientes.select([\n    (F.avg(F.col(c).isNull().cast(\"int\")) * 100).alias(c) for c in clientes.columns\n]).first().asDict()\nresultado = {c: p for c, p in linha.items() if p > 25.0}"},"avancado":{"enunciado":"Trate também strings vazias e só espaços como ausência, e produza o resultado em formato longo (coluna, pct_ausente) ordenado.","dados":[{"tabela":"clientes","colunas":["id","telefone","email"],"tipos":["INT","STRING","STRING"],"linhas":[[1," ","a@x"],[2,null,""],[3,"9","c@x"],[4,"",null]]}],"solucao":"def ausente(c, tipo):\n    col = F.col(c)\n    return (col.isNull() | (F.trim(col) == \"\")) if tipo == \"string\" else col.isNull()\n\nlarga = clientes.select([\n    (F.avg(ausente(c, t).cast(\"int\")) * 100).alias(c) for c, t in clientes.dtypes\n])\nresultado = (\n    larga.unpivot([], larga.columns, \"coluna\", \"pct_ausente\")\n    .orderBy(F.desc(\"pct_ausente\"))\n)"}},"area":"pyspark","arquivo":"Data Quality Operacional (PySpark)","secao":"Percentual de nulos por coluna","link":"cheatsheets.html#pyspark-12-percentual-de-nulos-por-coluna","semana":7},{"id":"spk-12-perda-join","ref":"02_pyspark/12_data-quality-operacional.md#perda-de-linhas-em-joins","ferramenta":"Reconciliação com left_anti","niveis":{"basico":{"enunciado":"Encontre as vendas cujo produto não existe na dimensão.","dados":[{"tabela":"vendas","colunas":["id_venda","id_produto"],"tipos":["INT","INT"],"linhas":[[1,10],[2,20],[3,99]]},{"tabela":"produtos","colunas":["id_produto","nome"],"tipos":["INT","STRING"],"linhas":[[10,"A"],[20,"B"]]}],"solucao":"resultado = vendas.join(produtos, \"id_produto\", \"left_anti\")"},"intermediario":{"enunciado":"Calcule o percentual de vendas órfãs e falhe se passar de 1%. Os dados de exemplo devem falhar; trate a exceção para mostrar a mensagem.","dados":[{"tabela":"vendas","colunas":["id_venda","id_produto"],"tipos":["INT","INT"],"linhas":[[1,10],[2,20],[3,99]]},{"tabela":"produtos","colunas":["id_produto","nome"],"tipos":["INT","STRING"],"linhas":[[10,"A"],[20,"B"]]}],"solucao":"orfas = vendas.join(produtos, \"id_produto\", \"left_anti\").count()\ntotal = vendas.count()\ntry:\n    if total and orfas / total > 0.01:\n        raise ValueError(f\"{orfas} de {total} vendas sem produto ({orfas / total:.1%})\")\nexcept ValueError as erro:\n    resultado = str(erro)"},"avancado":{"enunciado":"Um `inner join` com a dimensão manteve a contagem igual, mas a soma do valor mudou. Explique como isso é possível e escreva a checagem que detecta perda e duplicação ao mesmo tempo.","dados":[{"tabela":"vendas","colunas":["id_venda","id_produto","valor"],"tipos":["INT","INT","INT"],"linhas":[[1,10,100],[2,99,50]]},{"tabela":"produtos","colunas":["id_produto","nome"],"tipos":["INT","STRING"],"linhas":[[10,"A"],[10,"A-v2"]]}],"solucao":"# A venda 2 foi perdida (sem produto) e a venda 1 duplicou (produto com 2 versões):\n# a contagem empatou por coincidência.\njuntado = vendas.join(produtos, \"id_produto\")\nantes = vendas.agg(F.count(\"*\").alias(\"n\"), F.sum(\"valor\").alias(\"s\")).first()\ndepois = juntado.agg(F.count(\"*\").alias(\"n\"), F.count_distinct(\"id_venda\").alias(\"vendas\"), F.sum(\"valor\").alias(\"s\")).first()\nresultado = {\n    \"perdidas\": antes[\"n\"] - depois[\"vendas\"],\n    \"duplicadas\": depois[\"n\"] - depois[\"vendas\"],\n    \"soma_antes\": antes[\"s\"], \"soma_depois\": depois[\"s\"],\n}"}},"area":"pyspark","arquivo":"Data Quality Operacional (PySpark)","secao":"Perda de linhas em joins","link":"cheatsheets.html#pyspark-12-perda-de-linhas-em-joins","semana":7},{"id":"spk-12-unicidade","ref":"02_pyspark/12_data-quality-operacional.md#unicidade-do-grao","ferramenta":"count × count_distinct com raise","niveis":{"basico":{"enunciado":"Verifique se cada `id_transacao` aparece uma vez e levante erro se houver duplicidade.","dados":[{"tabela":"df_final","colunas":["id_transacao","valor"],"tipos":["INT","INT"],"linhas":[[1,10],[2,20],[3,30]]}],"solucao":"resumo = df_final.agg(\n    F.count(\"*\").alias(\"linhas\"),\n    F.count_distinct(\"id_transacao\").alias(\"chaves\"),\n).first()\nif resumo[\"linhas\"] != resumo[\"chaves\"]:\n    raise ValueError(f\"Grão violado: {resumo['linhas']} linhas para {resumo['chaves']} chaves\")\nresultado = resumo"},"intermediario":{"enunciado":"Em vez de só falhar, mostre as 10 chaves mais duplicadas para facilitar o diagnóstico.","dados":[{"tabela":"df_final","colunas":["id_transacao","valor"],"tipos":["INT","INT"],"linhas":[[1,10],[2,20],[2,20],[3,30],[3,31],[3,32]]}],"solucao":"resultado = (\n    df_final.groupBy(\"id_transacao\").count()\n    .filter(\"count > 1\")\n    .orderBy(F.desc(\"count\"))\n    .limit(10)\n)"},"avancado":{"enunciado":"Generalize em uma função `checar_grao(df, chaves)` para chave composta, que retorne um dicionário com linhas, chaves distintas e excedente, e levante erro quando o excedente for maior que zero.","dados":[{"tabela":"itens","colunas":["id_pedido","id_item","qtd"],"tipos":["INT","INT","INT"],"linhas":[[1,1,2],[1,2,1],[2,1,5]]}],"solucao":"def checar_grao(df, chaves):\n    linhas = df.count()\n    distintas = df.select(*chaves).distinct().count()\n    resumo = {\"linhas\": linhas, \"chaves\": distintas, \"excedente\": linhas - distintas}\n    if resumo[\"excedente\"] > 0:\n        raise ValueError(f\"Grão {chaves} violado: {resumo}\")\n    return resumo\n\nresultado = checar_grao(itens, [\"id_pedido\", \"id_item\"])"}},"area":"pyspark","arquivo":"Data Quality Operacional (PySpark)","secao":"Unicidade do grão","link":"cheatsheets.html#pyspark-12-unicidade-do-grao","semana":7},{"id":"spk-13-aqe-particoes","ref":"02_pyspark/13_performance-e-arquitetura.md#aqe-e-particoes","ferramenta":"repartition × coalesce e AQE","niveis":{"basico":{"enunciado":"Confira se o AQE está ligado na sessão e qual o número padrão de partições de shuffle.","dados":null,"solucao":"print(spark.conf.get(\"spark.sql.adaptive.enabled\"))\nprint(spark.conf.get(\"spark.sql.shuffle.partitions\"))"},"intermediario":{"enunciado":"Redistribua por `cliente_id` em 4 partições e, depois de um filtro forte, reduza para 1 partição sem shuffle completo. Mostre o número de partições em cada passo com `spark_partition_id`.","dados":[{"tabela":"df","colunas":["cliente_id","valor"],"tipos":["INT","INT"],"linhas":[[1,10],[2,20],[3,30],[4,40],[5,50],[6,60]]}],"solucao":"por_cliente = df.repartition(4, \"cliente_id\")\nfiltrado = por_cliente.filter(F.col(\"valor\") > 40).coalesce(1)\n\nconta = lambda d: d.select(F.spark_partition_id().alias(\"p\")).distinct().count()\nprint(conta(por_cliente), conta(filtrado))\nresultado = filtrado"},"avancado":{"enunciado":"Na sua base, encontre um `repartition(n)` ou `coalesce(n)` com número fixo. Explique o objetivo dele, remova-o num teste e compare duração, número de tarefas e número de arquivos escritos. Decida se ele fica.","dados":null,"solucao":"# Antes/depois: Spark UI (nº de tarefas e duração do estágio) e\n# DESCRIBE DETAIL <tabela_destino> (numFiles, tamanho médio).\n# Com AQE e escrita otimizada (optimizeWrite/auto compaction) o número fixo muitas vezes é desnecessário."}},"area":"pyspark","arquivo":"Performance, Arquitetura e Testes em PySpark","secao":"AQE e partições","link":"cheatsheets.html#pyspark-13-aqe-e-particoes","semana":6},{"id":"spk-13-diagnostico","ref":"02_pyspark/13_performance-e-arquitetura.md#diagnostico-antes-da-otimizacao","ferramenta":"explain(\"formatted\") e Spark UI","niveis":{"basico":{"enunciado":"Gere o plano formatado de uma agregação com join e identifique os `Exchange` (shuffles).","dados":[{"tabela":"vendas","colunas":["id","loja_id","valor"],"tipos":["INT","INT","INT"],"linhas":[[1,10,5],[2,20,7]]},{"tabela":"lojas","colunas":["loja_id","uf"],"tipos":["INT","STRING"],"linhas":[[10,"SP"],[20,"RJ"]]}],"solucao":"resultado = vendas.join(lojas, \"loja_id\").groupBy(\"uf\").agg(F.sum(\"valor\").alias(\"total\"))\nresultado.explain(\"formatted\")"},"intermediario":{"enunciado":"Compare o plano de um filtro aplicado antes do join com o de um filtro aplicado depois. O otimizador empurrou o filtro nos dois casos?","dados":[{"tabela":"vendas","colunas":["id","loja_id","valor"],"tipos":["INT","INT","INT"],"linhas":[[1,10,5],[2,20,7]]},{"tabela":"lojas","colunas":["loja_id","uf"],"tipos":["INT","STRING"],"linhas":[[10,"SP"],[20,"RJ"]]}],"solucao":"antes = vendas.filter(F.col(\"valor\") > 6).join(lojas, \"loja_id\")\ndepois = vendas.join(lojas, \"loja_id\").filter(F.col(\"valor\") > 6)\nantes.explain()\ndepois.explain()\n# Em geral o Catalyst empurra o filtro para antes do join nos dois casos (predicate pushdown).\nresultado = depois"},"avancado":{"enunciado":"Na sua base, rode um job lento e, na Spark UI, registre: estágio mais longo, nº de tarefas, duração máxima vs mediana, shuffle read/write e spill. Formule uma hipótese de gargalo baseada nesses números antes de mudar qualquer coisa.","dados":null,"solucao":"# Spark UI > Jobs > job lento > Stages > estágio mais longo > Summary Metrics\n# Hipóteses típicas:\n#   max >> mediana             -> skew\n#   spill alto                 -> partições grandes demais / memória\n#   shuffle muito maior que entrada -> join explodindo linhas\n#   muitas tarefas minúsculas  -> partições demais / arquivos pequenos"}},"area":"pyspark","arquivo":"Performance, Arquitetura e Testes em PySpark","secao":"Diagnóstico antes da otimização","link":"cheatsheets.html#pyspark-13-diagnostico-antes-da-otimizacao","semana":6},{"id":"spk-13-separacao","ref":"02_pyspark/13_performance-e-arquitetura.md#separacao-de-responsabilidades","ferramenta":"Transformações puras e testáveis","niveis":{"basico":{"enunciado":"Extraia para uma função pura a regra que calcula imposto de 17% e aplique-a.","dados":[{"tabela":"df","colunas":["valor"],"tipos":["DOUBLE"],"linhas":[[100.0],[10.0]]}],"solucao":"def aplicar_imposto(df):\n    return df.withColumn(\"imposto\", F.col(\"valor\") * F.lit(0.17))\n\nresultado = aplicar_imposto(df)"},"intermediario":{"enunciado":"Encadeie duas funções puras (`limpar` e `aplicar_imposto`) com `DataFrame.transform`, recebendo a alíquota como parâmetro.","dados":[{"tabela":"df","colunas":["valor"],"tipos":["DOUBLE"],"linhas":[[100.0],[-5.0],[null]]}],"solucao":"def limpar(df):\n    return df.filter(F.col(\"valor\").isNotNull() & (F.col(\"valor\") >= 0))\n\ndef aplicar_imposto(df, aliquota):\n    return df.withColumn(\"imposto\", F.col(\"valor\") * F.lit(aliquota))\n\nresultado = df.transform(limpar).transform(aplicar_imposto, 0.17)"},"avancado":{"enunciado":"Na sua base, escolha um notebook que mistura leitura, regra e escrita na mesma célula. Separe em: leitura (função), regras (funções puras), escrita (função), e um bloco principal que só orquestra.","dados":null,"solucao":"def ler(spark, data):\n    return spark.read.table(\"main.bronze.vendas\").filter(F.col(\"dt\") == data)\n\ndef transformar(df):\n    return df.transform(limpar).transform(aplicar_imposto, 0.17)\n\ndef gravar(df):\n    df.write.mode(\"overwrite\").option(\"replaceWhere\", \"dt = ...\").saveAsTable(\"main.silver.vendas\")\n\nif __name__ == \"__main__\":\n    gravar(transformar(ler(spark, dbutils.widgets.get(\"data\"))))"}},"area":"pyspark","arquivo":"Performance, Arquitetura e Testes em PySpark","secao":"Separação de responsabilidades","link":"cheatsheets.html#pyspark-13-separacao-de-responsabilidades","semana":6},{"id":"spk-13-skew-salting","ref":"02_pyspark/13_performance-e-arquitetura.md#skew-e-salting","ferramenta":"Frequência de chaves e salting","niveis":{"basico":{"enunciado":"Liste as 5 chaves mais frequentes para avaliar skew.","dados":[{"tabela":"df","colunas":["chave"],"tipos":["STRING"],"linhas":[["A"],["A"],["A"],["A"],["B"],["C"],["A"],["B"]]}],"solucao":"resultado = df.groupBy(\"chave\").count().orderBy(F.desc(\"count\")).limit(5)"},"intermediario":{"enunciado":"Calcule a razão entre a chave mais frequente e a mediana das frequências. Acima de quanto você investigaria skew?","dados":[{"tabela":"df","colunas":["chave"],"tipos":["STRING"],"linhas":[["A"],["A"],["A"],["A"],["A"],["A"],["B"],["C"],["D"]]}],"solucao":"freq = df.groupBy(\"chave\").count()\nresultado = freq.agg(\n    F.max(\"count\").alias(\"maior\"),\n    F.percentile_approx(\"count\", 0.5).alias(\"mediana\"),\n).withColumn(\"razao\", F.col(\"maior\") / F.col(\"mediana\"))\n# Não há número universal: compare com a duração das tarefas na Spark UI."},"avancado":{"enunciado":"Aplique salting numa agregação com skew: some o valor por chave em duas etapas (com sal de 0 a 3 e depois sem sal) e confirme que o resultado é igual ao da agregação direta.","dados":[{"tabela":"df","colunas":["chave","valor"],"tipos":["STRING","INT"],"linhas":[["A",1],["A",2],["A",3],["A",4],["B",5],["C",6]]}],"solucao":"N = 4\nparcial = (\n    df.withColumn(\"sal\", (F.rand(seed=42) * N).cast(\"int\"))\n    .groupBy(\"chave\", \"sal\").agg(F.sum(\"valor\").alias(\"parcial\"))\n)\nresultado = parcial.groupBy(\"chave\").agg(F.sum(\"parcial\").alias(\"total\"))\ndireto = df.groupBy(\"chave\").agg(F.sum(\"valor\").alias(\"total\"))\nassert resultado.exceptAll(direto).count() == 0"}},"area":"pyspark","arquivo":"Performance, Arquitetura e Testes em PySpark","secao":"Skew e salting","link":"cheatsheets.html#pyspark-13-skew-e-salting","semana":6},{"id":"spk-13-teste-local","ref":"02_pyspark/13_performance-e-arquitetura.md#teste-local","ferramenta":"Testes com SparkSession local","niveis":{"basico":{"enunciado":"Escreva um teste para `aplicar_imposto` com uma linha de entrada e o valor esperado.","dados":[{"tabela":"df","colunas":["valor"],"tipos":["DOUBLE"],"linhas":[[100.0]]}],"solucao":"def aplicar_imposto(df):\n    return df.withColumn(\"imposto\", F.col(\"valor\") * F.lit(0.17))\n\ndef test_aplicar_imposto(spark):\n    entrada = spark.createDataFrame([(100.0,)], [\"valor\"])\n    assert aplicar_imposto(entrada).first().imposto == 17.0\n\ntest_aplicar_imposto(spark)\nresultado = aplicar_imposto(df)"},"intermediario":{"enunciado":"Teste a função `limpar` com casos de borda (nulo, negativo, zero) comparando o DataFrame inteiro com o esperado via `assertDataFrameEqual`.","dados":[{"tabela":"df","colunas":["valor"],"tipos":["DOUBLE"],"linhas":[[0.0]]}],"solucao":"from pyspark.testing import assertDataFrameEqual\n\ndef limpar(df):\n    return df.filter(F.col(\"valor\").isNotNull() & (F.col(\"valor\") >= 0))\n\nentrada = spark.createDataFrame([(None,), (-1.0,), (0.0,), (5.0,)], \"valor double\")\nesperado = spark.createDataFrame([(0.0,), (5.0,)], \"valor double\")\nassertDataFrameEqual(limpar(entrada), esperado)\nresultado = limpar(entrada)"},"avancado":{"enunciado":"Monte a estrutura de testes do projeto: fixture `spark` de sessão em `conftest.py`, um teste por regra e execução com `pytest`. Garanta que nenhum teste lê tabelas reais.","dados":null,"solucao":"# conftest.py\nimport pytest\nfrom pyspark.sql import SparkSession\n\n@pytest.fixture(scope=\"session\")\ndef spark():\n    s = (SparkSession.builder.master(\"local[2]\")\n         .config(\"spark.sql.shuffle.partitions\", \"2\")\n         .config(\"spark.ui.enabled\", \"false\").getOrCreate())\n    yield s\n    s.stop()\n\n# tests/test_regras.py usa spark.createDataFrame(...) e as funções puras.\n# Rode: python -m pytest -q"}},"area":"pyspark","arquivo":"Performance, Arquitetura e Testes em PySpark","secao":"Teste local","link":"cheatsheets.html#pyspark-13-teste-local","semana":6},{"id":"spk-13-udfs","ref":"02_pyspark/13_performance-e-arquitetura.md#funcoes-nativas-python-udf-e-pandas-udf","ferramenta":"Funções nativas × UDF × Pandas UDF","niveis":{"basico":{"enunciado":"Classifique clientes com saldo acima de 2.500.000 como VIP usando função nativa.","dados":[{"tabela":"df","colunas":["id","saldo"],"tipos":["INT","BIGINT"],"linhas":[[1,3000000],[2,10]]}],"solucao":"resultado = df.withColumn(\"classificacao\", F.when(F.col(\"saldo\") > 2_500_000, \"VIP\").otherwise(\"STANDARD\"))"},"intermediario":{"enunciado":"Reescreva com funções nativas a UDF que padroniza CEP (só dígitos, 8 posições com zeros à esquerda):\n`@udf('string') def cep(x): return re.sub(r'\\D', '', x).zfill(8) if x else None`","dados":[{"tabela":"enderecos","colunas":["cep"],"tipos":["STRING"],"linhas":[["01310-100"],["1310100"],[null]]}],"solucao":"resultado = enderecos.withColumn(\n    \"cep_padrao\",\n    F.lpad(F.regexp_replace(\"cep\", r\"\\D\", \"\"), 8, \"0\"),\n)"},"avancado":{"enunciado":"Implemente o mesmo cálculo (valor com imposto de 17%) como Python UDF e como Pandas UDF, confirme que os resultados batem com a versão nativa e explique a ordem esperada de desempenho.","dados":[{"tabela":"df","colunas":["valor"],"tipos":["DOUBLE"],"linhas":[[100.0],[50.0]]}],"executavel":false,"solucao":"import pandas as pd\nfrom pyspark.sql.functions import udf, pandas_udf\n\n@udf(\"double\")\ndef imposto_udf(v):\n    return v * 1.17 if v is not None else None\n\n@pandas_udf(\"double\")\ndef imposto_pandas(v: pd.Series) -> pd.Series:\n    return v * 1.17\n\nresultado = df.select(\n    (F.col(\"valor\") * 1.17).alias(\"nativo\"),\n    imposto_udf(\"valor\").alias(\"udf\"),\n    imposto_pandas(\"valor\").alias(\"pandas\"),\n)\n# Esperado: nativo < Pandas UDF (lotes Arrow) < Python UDF (linha a linha). Meça no volume real."}},"area":"pyspark","arquivo":"Performance, Arquitetura e Testes em PySpark","secao":"Funções nativas, Python UDF e Pandas UDF","link":"cheatsheets.html#pyspark-13-funcoes-nativas-python-udf-e-pandas-udf","semana":6},{"id":"spk-14-colunas-tecnicas","ref":"02_pyspark/14_medallion-architecture.md#4-colunas-tecnicas-uteis","ferramenta":"ingestion_ts, source_file, record_hash","niveis":{"basico":{"enunciado":"Adicione na Bronze `ingestion_ts`, `load_date` e `source_system`.","dados":[{"tabela":"bruto","colunas":["id","valor"],"tipos":["INT","INT"],"linhas":[[1,10]]}],"solucao":"resultado = bruto.withColumns({\n    \"ingestion_ts\": F.current_timestamp(),\n    \"load_date\": F.current_date(),\n    \"source_system\": F.lit(\"erp\"),\n})"},"intermediario":{"enunciado":"Gere um `record_hash` das colunas de negócio para detectar mudança entre cargas, tratando nulos de forma estável.","dados":[{"tabela":"clientes","colunas":["id","nome","email"],"tipos":["INT","STRING","STRING"],"linhas":[[1,"Ana",null],[2,"Bia","b@x"]]}],"solucao":"colunas_negocio = [\"nome\", \"email\"]\nresultado = clientes.withColumn(\n    \"record_hash\",\n    F.sha2(F.concat_ws(\"||\", *[F.coalesce(F.col(c).cast(\"string\"), F.lit(\"<null>\")) for c in colunas_negocio]), 256),\n)"},"avancado":{"enunciado":"Use o `record_hash` para classificar os registros da carga nova em NOVO, ALTERADO ou INALTERADO em relação à versão atual.","dados":[{"tabela":"atual","colunas":["id","nome"],"tipos":["INT","STRING"],"linhas":[[1,"Ana"],[2,"Bia"]]},{"tabela":"nova","colunas":["id","nome"],"tipos":["INT","STRING"],"linhas":[[1,"Ana"],[2,"Beatriz"],[3,"Caio"]]}],"solucao":"h = lambda df: df.withColumn(\"record_hash\", F.sha2(F.coalesce(F.col(\"nome\"), F.lit(\"<null>\")), 256))\na, n = h(atual).alias(\"a\"), h(nova).alias(\"n\")\nresultado = (\n    n.join(a, \"id\", \"left\")\n    .select(\"id\", F.col(\"n.nome\"),\n        F.when(F.col(\"a.record_hash\").isNull(), \"NOVO\")\n         .when(F.col(\"a.record_hash\") != F.col(\"n.record_hash\"), \"ALTERADO\")\n         .otherwise(\"INALTERADO\").alias(\"situacao\"))\n)"}},"area":"pyspark","arquivo":"Medalhao: Bronze, Silver e Gold no Databricks","secao":"4. Colunas tecnicas uteis","link":"cheatsheets.html#pyspark-14-4-colunas-tecnicas-uteis","semana":5},{"id":"spk-14-erros-comuns","ref":"02_pyspark/14_medallion-architecture.md#6-erros-comuns","ferramenta":"Antipadrões de arquitetura","niveis":{"basico":{"enunciado":"Para cada situação, diga qual erro comum ela ilustra: (a) a Bronze descarta linhas com e-mail inválido; (b) o dashboard lê direto da Bronze; (c) a Silver só tem a receita mensal agregada.","dados":null,"solucao":"(a) Limpeza destrutiva na Bronze: perde-se a origem para reprocessar.\n(b) Pular a Silver: regras de tipagem e deduplicação ficam espalhadas no consumo.\n(c) Agregar cedo demais: perde-se o detalhe para outras análises."},"intermediario":{"enunciado":"A Bronze filtrou e-mails inválidos. Reescreva para preservar tudo na Bronze e marcar a validade, aplicando o filtro só na Silver.","dados":[{"tabela":"origem","colunas":["id","email"],"tipos":["INT","STRING"],"linhas":[[1,"a@x.com"],[2,"invalido"],[3,null]]}],"solucao":"bronze = origem.withColumn(\"ingestion_ts\", F.current_timestamp())   # sem filtro\nsilver = (\n    bronze.withColumn(\"is_email_valido\", F.col(\"email\").rlike(r\"^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$\"))\n    .filter(F.col(\"is_email_valido\"))\n)\nresultado = silver"},"avancado":{"enunciado":"Na sua base, escolha uma tabela Gold e verifique: o grão está documentado? Ela tem colunas técnicas que só servem à engenharia? Existem versões duplicadas do mesmo dataset? Registre os achados e uma proposta.","dados":null,"solucao":"DESCRIBE TABLE EXTENDED <gold>;            -- comentário da tabela documenta o grão?\nSHOW TABLES IN <schema_gold> LIKE '*vendas*';   -- versões duplicadas?\n-- Proposta: COMMENT ON TABLE com o grão; remover colunas técnicas não usadas pelo consumo;\n-- consolidar versões duplicadas em uma tabela oficial."}},"area":"pyspark","arquivo":"Medalhao: Bronze, Silver e Gold no Databricks","secao":"6. Erros comuns","link":"cheatsheets.html#pyspark-14-6-erros-comuns","semana":5},{"id":"spk-14-granularidade","ref":"02_pyspark/14_medallion-architecture.md#2-como-pensar-granularidade","ferramenta":"Grão por camada","niveis":{"basico":{"enunciado":"Declare o grão de cada tabela em uma frase ('uma linha por ...'): eventos de clique crus, sessões de usuário, visitas por dia e canal.","dados":null,"solucao":"Bronze cliques: uma linha por evento recebido (pode ter duplicatas).\nSilver sessões: uma linha por sessão de usuário.\nGold visitas: uma linha por dia e canal."},"intermediario":{"enunciado":"Verifique se a tabela Gold respeita o grão declarado 'uma linha por dia e canal'.","dados":[{"tabela":"gold_visitas","colunas":["dia","canal","visitas"],"tipos":["DATE","STRING","INT"],"linhas":[["2025-01-01","APP",10],["2025-01-01","WEB",5],["2025-01-01","APP",3]]}],"solucao":"resultado = (\n    gold_visitas.groupBy(\"dia\", \"canal\").count()\n    .filter(\"count > 1\")\n)\n# Linhas retornadas = violações do grão (APP em 2025-01-01)."},"avancado":{"enunciado":"Um KPI de ticket médio está errado porque a Gold mistura linhas de pedido e de item. Mostre a diferença entre média por item e por pedido e corrija ajustando o grão.","dados":[{"tabela":"itens","colunas":["id_pedido","id_item","valor_item"],"tipos":["INT","INT","INT"],"linhas":[[1,1,10],[1,2,10],[1,3,10],[2,1,50]]}],"solucao":"media_item = itens.agg(F.avg(\"valor_item\")).first()[0]          # 20.0 (errado para ticket)\npedidos = itens.groupBy(\"id_pedido\").agg(F.sum(\"valor_item\").alias(\"valor_pedido\"))\nresultado = pedidos.agg(F.avg(\"valor_pedido\").alias(\"ticket_medio\"))   # 40.0"}},"area":"pyspark","arquivo":"Medalhao: Bronze, Silver e Gold no Databricks","secao":"2. Como pensar granularidade","link":"cheatsheets.html#pyspark-14-2-como-pensar-granularidade","semana":5},{"id":"spk-14-papel-camadas","ref":"02_pyspark/14_medallion-architecture.md#1-papel-de-cada-camada","ferramenta":"Bronze, Silver e Gold","niveis":{"basico":{"enunciado":"Classifique cada tabela na camada correta: (a) JSON da API como chegou + data de carga; (b) clientes tipados e deduplicados; (c) receita mensal por região para o dashboard.","dados":null,"solucao":"(a) Bronze: preserva a origem e o contexto de carga.\n(b) Silver: dado confiável e reutilizável.\n(c) Gold: consumo analítico com grão definido pelo caso de uso."},"intermediario":{"enunciado":"Escreva o fluxo mínimo das três camadas para pedidos: Bronze com metadados de carga, Silver tipada e deduplicada, Gold agregada por dia.","dados":[{"tabela":"bruto","colunas":["id_pedido","valor_txt","dt_txt"],"tipos":["STRING","STRING","STRING"],"linhas":[["1","10.50","2025-01-01"],["1","10.50","2025-01-01"],["2","7","2025-01-02"]]}],"solucao":"bronze = bruto.withColumns({\"ingestion_ts\": F.current_timestamp(), \"source_system\": F.lit(\"api_pedidos\")})\nsilver = (\n    bronze.select(\n        F.col(\"id_pedido\").cast(\"bigint\").alias(\"id_pedido\"),\n        F.col(\"valor_txt\").cast(\"decimal(12,2)\").alias(\"valor\"),\n        F.to_date(\"dt_txt\").alias(\"dt_pedido\"),\n    ).dropDuplicates([\"id_pedido\"])\n)\nresultado = silver.groupBy(\"dt_pedido\").agg(F.sum(\"valor\").alias(\"receita\"), F.count(\"*\").alias(\"pedidos\"))"},"avancado":{"enunciado":"Na sua base, mapeie um pipeline real nas três camadas. Para cada tabela, registre camada, grão, dono e consumidores, e aponte tabelas que estão na camada errada (ex.: regra de dashboard na Silver).","dados":null,"solucao":"| tabela | camada | grão | dono | consumidores | observação |\n|---|---|---|---|---|---|\n| bronze.pedidos_api | Bronze | 1 payload por chamada | eng. dados | silver.pedidos | ok |\n| silver.pedidos_kpi | Silver | 1 linha por dia | ... | dashboard | regra de dashboard: mover para Gold |"}},"area":"pyspark","arquivo":"Medalhao: Bronze, Silver e Gold no Databricks","secao":"1. Papel de cada camada","link":"cheatsheets.html#pyspark-14-1-papel-de-cada-camada","semana":5},{"id":"spk-14-qualidade-camada","ref":"02_pyspark/14_medallion-architecture.md#5-regras-praticas-de-qualidade-por-camada","ferramenta":"Checagens por camada","niveis":{"basico":{"enunciado":"Para a Bronze: verifique se a carga do dia chegou e se tem linhas.","dados":[{"tabela":"bronze","colunas":["id","load_date"],"tipos":["INT","DATE"],"linhas":[[1,"2025-01-01"],[2,"2025-01-02"]]}],"solucao":"hoje = \"2025-01-02\"\nresultado = bronze.filter(F.col(\"load_date\") == hoje).count()\nif resultado == 0:\n    raise ValueError(f\"Carga de {hoje} não chegou\")"},"intermediario":{"enunciado":"Para a Silver: em uma única ação, verifique tipos inválidos (id não numérico na origem), nulos críticos e duplicidade do grão.","dados":[{"tabela":"bronze","colunas":["id_txt","email"],"tipos":["STRING","STRING"],"linhas":[["1","a@x"],["x","b@x"],["2",null],["2","c@x"]]}],"solucao":"silver = bronze.withColumn(\"id\", F.expr(\"try_cast(id_txt AS BIGINT)\"))\nresultado = silver.agg(\n    F.count_if(F.col(\"id_txt\").isNotNull() & F.col(\"id\").isNull()).alias(\"id_invalido\"),\n    F.count_if(F.col(\"email\").isNull()).alias(\"email_nulo\"),\n    (F.count(\"id\") - F.count_distinct(\"id\")).alias(\"ids_duplicados\"),\n)"},"avancado":{"enunciado":"Para a Gold: confira que a receita total da Gold bate com a soma da Silver no mesmo período (reconciliação entre camadas) e falhe se a diferença passar de 0,01.","dados":[{"tabela":"silver","colunas":["dt","valor"],"tipos":["DATE","DECIMAL(12,2)"],"linhas":[["2025-01-01",10.5],["2025-01-01",4.5],["2025-01-02",7.0]]},{"tabela":"gold","colunas":["dt","receita"],"tipos":["DATE","DECIMAL(12,2)"],"linhas":[["2025-01-01",15.0],["2025-01-02",7.0]]}],"solucao":"s = silver.agg(F.sum(\"valor\")).first()[0]\ng = gold.agg(F.sum(\"receita\")).first()[0]\nif abs(s - g) > 0.01:\n    raise ValueError(f\"Gold ({g}) diverge da Silver ({s})\")\nresultado = {\"silver\": s, \"gold\": g}"}},"area":"pyspark","arquivo":"Medalhao: Bronze, Silver e Gold no Databricks","secao":"5. Regras praticas de qualidade por camada","link":"cheatsheets.html#pyspark-14-5-regras-praticas-de-qualidade-por-camada","semana":5},{"id":"sql-01-distinct","ref":"01_sql/01_sintaxe-basica.md#distinct-com-proposito","ferramenta":"DISTINCT","niveis":{"basico":{"enunciado":"Obtenha a lista de clientes distintos que compraram, ignorando registros sem cliente.","dados":[{"tabela":"pedidos","colunas":["id_pedido","id_cliente"],"tipos":["INT","INT"],"linhas":[[1,10],[2,10],[3,20],[4,null]]}],"solucao":"SELECT DISTINCT id_cliente\nFROM pedidos\nWHERE id_cliente IS NOT NULL;"},"intermediario":{"enunciado":"Um colega resolveu linhas duplicadas com `SELECT DISTINCT *` depois de um join entre pedidos e endereços. Descubra qual lado multiplicou as linhas e corrija na origem.","dados":[{"tabela":"pedidos","colunas":["id_pedido","id_cliente","valor"],"tipos":["INT","INT","INT"],"linhas":[[1,10,100],[2,20,50]]},{"tabela":"enderecos","colunas":["id_cliente","cidade","principal"],"tipos":["INT","STRING","BOOLEAN"],"linhas":[[10,"Recife",true],[10,"Olinda",false],[20,"Natal",true]]}],"solucao":"-- Diagnóstico: o cliente 10 tem 2 endereços\nSELECT id_cliente, COUNT(*) FROM enderecos GROUP BY id_cliente HAVING COUNT(*) > 1;\n-- Correção: definir a regra (endereço principal) antes do join\nSELECT p.id_pedido, p.valor, e.cidade\nFROM pedidos AS p\nLEFT JOIN enderecos AS e\n  ON p.id_cliente = e.id_cliente AND e.principal;"},"avancado":{"enunciado":"Na sua base, encontre uma consulta ou view com `SELECT DISTINCT` sobre muitas colunas. Meça o número de linhas antes e depois do `DISTINCT` e identifique a causa da duplicidade (join, carga duplicada ou grão mal definido). Documente se o `DISTINCT` pode ser removido.","dados":null,"solucao":"SELECT COUNT(*) AS linhas, COUNT(DISTINCT chave_do_grao) AS chaves FROM (<consulta sem DISTINCT>);\n-- Se linhas > chaves, investigue cada join com:\nSELECT chave, COUNT(*) FROM <tabela_do_join> GROUP BY chave HAVING COUNT(*) > 1;\n-- Remova o DISTINCT só depois de corrigir a regra que gera a duplicidade."}},"area":"sql","arquivo":"Sintaxe Básica (SQL / Databricks)","secao":"DISTINCT com propósito","link":"cheatsheets.html#sql-01-distinct-com-proposito","semana":1},{"id":"sql-01-filtros-in-between-like","ref":"01_sql/01_sintaxe-basica.md#filtros-in-between-e-like","ferramenta":"IN, BETWEEN, ILIKE e NOT IN com NULL","niveis":{"basico":{"enunciado":"Liste os clientes de SP ou RJ cujo nome começa com 'ana', sem diferenciar maiúsculas e minúsculas.","dados":[{"tabela":"clientes","colunas":["id","nome","uf"],"tipos":["INT","STRING","STRING"],"linhas":[[1,"Ana Paula","SP"],[2,"ANA Clara","RJ"],[3,"Mariana","SP"],[4,"ana","MG"]]}],"solucao":"SELECT *\nFROM clientes\nWHERE uf IN ('SP', 'RJ')\n  AND nome ILIKE 'ana%';"},"intermediario":{"enunciado":"Retorne os eventos do dia 2025-01-31 inteiro. Por que `ts BETWEEN DATE '2025-01-31' AND DATE '2025-01-31'` não funciona?","dados":[{"tabela":"eventos","colunas":["id","ts"],"tipos":["INT","TIMESTAMP"],"linhas":[[1,"2025-01-30T23:59:00"],[2,"2025-01-31T00:00:00"],[3,"2025-01-31T18:30:00"],[4,"2025-02-01T00:00:00"]]}],"solucao":"-- O DATE vira TIMESTAMP 00:00:00: o BETWEEN só pega o instante da meia-noite.\nSELECT *\nFROM eventos\nWHERE ts >= TIMESTAMP '2025-01-31 00:00:00'\n  AND ts <  TIMESTAMP '2025-02-01 00:00:00';"},"avancado":{"enunciado":"Liste os clientes que **não** estão bloqueados. A tabela `bloqueados` tem um `id_cliente` nulo. Mostre por que `NOT IN` retorna zero linhas e escreva a versão correta.","dados":[{"tabela":"clientes","colunas":["id_cliente","nome"],"tipos":["INT","STRING"],"linhas":[[1,"Ana"],[2,"Bruno"],[3,"Carla"]]},{"tabela":"bloqueados","colunas":["id_cliente"],"tipos":["INT"],"linhas":[[2],[null]]}],"solucao":"-- NOT IN (2, NULL) vira id <> 2 AND id <> NULL -> desconhecido para todas as linhas.\nSELECT c.*\nFROM clientes AS c\nWHERE NOT EXISTS (\n    SELECT 1 FROM bloqueados AS b WHERE b.id_cliente = c.id_cliente\n);"}},"area":"sql","arquivo":"Sintaxe Básica (SQL / Databricks)","secao":"Filtros: IN, BETWEEN e LIKE","link":"cheatsheets.html#sql-01-filtros-in-between-e-like","semana":1},{"id":"sql-01-operadores-conjunto","ref":"01_sql/01_sintaxe-basica.md#operadores-de-conjunto","ferramenta":"UNION ALL, EXCEPT, INTERSECT","niveis":{"basico":{"enunciado":"Empilhe as vendas da loja física e do site em um único resultado, mantendo todas as linhas.","dados":[{"tabela":"vendas_loja","colunas":["id","valor"],"tipos":["INT","INT"],"linhas":[[1,10],[2,20]]},{"tabela":"vendas_site","colunas":["id","valor"],"tipos":["INT","INT"],"linhas":[[2,20],[3,30]]}],"solucao":"SELECT id, valor, 'LOJA' AS canal FROM vendas_loja\nUNION ALL\nSELECT id, valor, 'SITE' AS canal FROM vendas_site;"},"intermediario":{"enunciado":"Concilie o extrato do banco com a base interna: liste as transações que estão no extrato e não estão na base, e as que estão nos dois.","dados":[{"tabela":"extrato","colunas":["id_transacao"],"tipos":["INT"],"linhas":[[1],[2],[3],[4]]},{"tabela":"base_interna","colunas":["id_transacao"],"tipos":["INT"],"linhas":[[2],[4],[5]]}],"solucao":"SELECT id_transacao, 'FALTANDO_NA_BASE' AS situacao FROM (\n    SELECT id_transacao FROM extrato\n    EXCEPT\n    SELECT id_transacao FROM base_interna\n)\nUNION ALL\nSELECT id_transacao, 'CONCILIADA' FROM (\n    SELECT id_transacao FROM extrato\n    INTERSECT\n    SELECT id_transacao FROM base_interna\n);"},"avancado":{"enunciado":"Compare duas versões de uma tabela migrada linha a linha, inclusive duplicatas. `EXCEPT` comum diz que são iguais; mostre a diferença real.","dados":[{"tabela":"origem","colunas":["id","valor"],"tipos":["INT","INT"],"linhas":[[1,10],[1,10],[2,20]]},{"tabela":"destino","colunas":["id","valor"],"tipos":["INT","INT"],"linhas":[[1,10],[2,20]]}],"solucao":"-- EXCEPT remove duplicatas; EXCEPT ALL preserva a multiplicidade\nSELECT 'so_na_origem' AS lado, * FROM (SELECT * FROM origem EXCEPT ALL SELECT * FROM destino)\nUNION ALL\nSELECT 'so_no_destino', * FROM (SELECT * FROM destino EXCEPT ALL SELECT * FROM origem);"}},"area":"sql","arquivo":"Sintaxe Básica (SQL / Databricks)","secao":"Operadores de conjunto","link":"cheatsheets.html#sql-01-operadores-de-conjunto","semana":1},{"id":"sql-01-ordem-logica","ref":"01_sql/01_sintaxe-basica.md#ordem-logica-de-avaliacao","ferramenta":"WHERE × HAVING × ordem lógica","niveis":{"basico":{"enunciado":"Some o valor das vendas `FECHADA` por categoria e mostre só as categorias com receita acima de 100, da maior para a menor.","dados":[{"tabela":"vendas","colunas":["id","categoria","status","valor"],"tipos":["INT","STRING","STRING","INT"],"linhas":[[1,"A","FECHADA",80],[2,"A","FECHADA",50],[3,"B","ABERTA",300],[4,"B","FECHADA",90],[5,"C","FECHADA",200]]}],"solucao":"SELECT categoria, SUM(valor) AS receita\nFROM vendas\nWHERE status = 'FECHADA'\nGROUP BY categoria\nHAVING SUM(valor) > 100\nORDER BY receita DESC;"},"intermediario":{"enunciado":"A consulta abaixo falha. Explique por que e corrija-a sem repetir a expressão inteira:\n`SELECT valor * 0.9 AS valor_liquido FROM vendas WHERE valor_liquido > 50`","dados":[{"tabela":"vendas","colunas":["id","valor"],"tipos":["INT","INT"],"linhas":[[1,40],[2,60],[3,100]]}],"solucao":"-- WHERE é avaliado antes da projeção: o alias ainda não existe.\nWITH base AS (\n    SELECT id, valor * 0.9 AS valor_liquido FROM vendas\n)\nSELECT * FROM base WHERE valor_liquido > 50;"},"avancado":{"enunciado":"Na sua base, escolha uma consulta com `GROUP BY` e um filtro no `HAVING` que **não** usa agregado (ex.: `HAVING regiao = 'SUL'`). Mova o filtro para o lugar correto e compare no `EXPLAIN FORMATTED` onde o filtro é aplicado em cada versão.","dados":null,"solucao":"-- Antes\nSELECT regiao, SUM(valor) FROM vendas GROUP BY regiao HAVING regiao = 'SUL';\n-- Depois: filtra linhas antes de agregar\nSELECT regiao, SUM(valor) FROM vendas WHERE regiao = 'SUL' GROUP BY regiao;\n-- No plano, o otimizador costuma empurrar o filtro do HAVING para antes do Aggregate,\n-- mas escrever no WHERE deixa a intenção explícita e não depende dessa otimização."}},"area":"sql","arquivo":"Sintaxe Básica (SQL / Databricks)","secao":"Ordem lógica de avaliação","link":"cheatsheets.html#sql-01-ordem-logica-de-avaliacao","semana":1},{"id":"sql-02-cast-try-cast","ref":"01_sql/02_tipos-e-formatos.md#cast-try-cast-e-modo-ansi","ferramenta":"CAST × TRY_CAST","niveis":{"basico":{"enunciado":"Converta `idade_txt` para inteiro sem derrubar a consulta quando houver texto inválido.","dados":[{"tabela":"cadastro","colunas":["id","idade_txt"],"tipos":["INT","STRING"],"linhas":[[1,"34"],[2,"abc"],[3,null],[4," 27"]]}],"solucao":"SELECT id, idade_txt, TRY_CAST(idade_txt AS INT) AS idade\nFROM cadastro;"},"intermediario":{"enunciado":"Conte quantos valores **presentes** foram perdidos na conversão (texto não nulo que virou `NULL`) e liste-os para análise.","dados":[{"tabela":"cadastro","colunas":["id","idade_txt"],"tipos":["INT","STRING"],"linhas":[[1,"34"],[2,"abc"],[3,null],[4,"2x"],[5,"40"]]}],"solucao":"SELECT\n    count_if(idade_txt IS NOT NULL AND TRY_CAST(idade_txt AS INT) IS NULL) AS perdidos,\n    collect_list(CASE WHEN idade_txt IS NOT NULL AND TRY_CAST(idade_txt AS INT) IS NULL THEN idade_txt END) AS exemplos\nFROM cadastro;"},"avancado":{"enunciado":"No seu ambiente, descubra se o modo ANSI está ligado e prove o efeito: rode um `CAST` inválido com ANSI ligado e desligado (na sessão). Depois decida, para uma coluna real da Bronze, se ela deve usar `CAST` (falhar) ou `TRY_CAST` (medir) e justifique.","dados":null,"solucao":"SET ansi_mode;                      -- Databricks SQL (ou SET spark.sql.ansi.enabled; em clusters)\nSELECT CAST('abc' AS INT);          -- ANSI ligado: erro CAST_INVALID_INPUT\nSET spark.sql.ansi.enabled = false; -- só para o teste, na sessão\nSELECT CAST('abc' AS INT);          -- devolve NULL silenciosamente\n-- Regra: chave e campos de contrato -> CAST (parar é melhor que publicar errado);\n-- campos descritivos de origem instável -> TRY_CAST + contagem de perdas."}},"area":"sql","arquivo":"Tipos, Conversões e Timezones (SQL / Databricks)","secao":"CAST, TRY_CAST e modo ANSI","link":"cheatsheets.html#sql-02-cast-try-cast-e-modo-ansi","semana":3},{"id":"sql-02-datas-timezone","ref":"01_sql/02_tipos-e-formatos.md#datas-formatos-e-timezone","ferramenta":"to_date, to_timestamp, from_utc_timestamp","niveis":{"basico":{"enunciado":"Converta `data_txt` no formato `dd/MM/yyyy` para `DATE` e calcule os dias até 31/12/2025.","dados":[{"tabela":"contratos","colunas":["id","data_txt"],"tipos":["INT","STRING"],"linhas":[[1,"01/12/2025"],[2,"15/06/2025"]]}],"solucao":"SELECT id,\n       to_date(data_txt, 'dd/MM/yyyy') AS data_inicio,\n       datediff(DATE '2025-12-31', to_date(data_txt, 'dd/MM/yyyy')) AS dias_ate_fim_do_ano\nFROM contratos;"},"intermediario":{"enunciado":"Os eventos estão em UTC. Mostre o horário de Brasília e conte os eventos por dia **local**. Algum evento muda de dia?","dados":[{"tabela":"eventos","colunas":["id","ts_utc"],"tipos":["INT","TIMESTAMP"],"linhas":[[1,"2025-03-01T01:30:00"],[2,"2025-03-01T12:00:00"],[3,"2025-03-02T02:59:00"]]}],"solucao":"SELECT to_date(from_utc_timestamp(ts_utc, 'America/Sao_Paulo')) AS dia_local,\n       COUNT(*) AS eventos\nFROM eventos\nGROUP BY 1\nORDER BY 1;\n-- Os eventos 1 e 3 caem no dia anterior em horário local (UTC-3)."},"avancado":{"enunciado":"A coluna `data_hora_txt` mistura formatos `dd-MM-yyyy HH:mm:ss` e `yyyy-MM-dd HH:mm:ss`, além de lixo. Converta para `TIMESTAMP` aceitando os dois formatos e conte o que não foi possível converter.","dados":[{"tabela":"logs","colunas":["id","data_hora_txt"],"tipos":["INT","STRING"],"linhas":[[1,"31-01-2025 10:00:00"],[2,"2025-01-31 11:00:00"],[3,"ontem"],[4,null]]}],"solucao":"WITH conv AS (\n    SELECT id, data_hora_txt,\n           coalesce(try_to_timestamp(data_hora_txt, 'dd-MM-yyyy HH:mm:ss'),\n                    try_to_timestamp(data_hora_txt, 'yyyy-MM-dd HH:mm:ss')) AS ts\n    FROM logs\n)\nSELECT *, count_if(data_hora_txt IS NOT NULL AND ts IS NULL) OVER () AS nao_convertidos\nFROM conv;"}},"area":"sql","arquivo":"Tipos, Conversões e Timezones (SQL / Databricks)","secao":"Datas, formatos e timezone","link":"cheatsheets.html#sql-02-datas-formatos-e-timezone","semana":3},{"id":"sql-02-decimal","ref":"01_sql/02_tipos-e-formatos.md#decimal-para-valores-financeiros","ferramenta":"DECIMAL(p, s)","niveis":{"basico":{"enunciado":"Converta `valor_txt` para um tipo adequado a dinheiro com 2 casas decimais e some o total.","dados":[{"tabela":"pagamentos","colunas":["id","valor_txt"],"tipos":["INT","STRING"],"linhas":[[1,"10.10"],[2,"20.20"],[3,"0.70"]]}],"solucao":"SELECT SUM(CAST(valor_txt AS DECIMAL(18, 2))) AS total\nFROM pagamentos;"},"intermediario":{"enunciado":"Compare a soma de 0.1 + 0.2 em `DOUBLE` e em `DECIMAL`. Qual delas passa no teste `= 0.3`?","dados":[{"tabela":"parcelas","colunas":["valor"],"tipos":["DOUBLE"],"linhas":[[0.1],[0.2]]}],"solucao":"SELECT\n    SUM(valor)                         AS soma_double,\n    SUM(valor) = 0.3                   AS double_igual,\n    SUM(CAST(valor AS DECIMAL(10, 2))) AS soma_decimal,\n    SUM(CAST(valor AS DECIMAL(10, 2))) = 0.3 AS decimal_igual\nFROM parcelas;"},"avancado":{"enunciado":"Na sua base, encontre uma coluna monetária armazenada como `DOUBLE` ou `FLOAT`. Compare a soma mensal dela com a soma convertida para `DECIMAL` e meça a divergência. Proponha a precisão e escala adequadas ao maior valor observado.","dados":null,"solucao":"SELECT date_trunc('MONTH', dt) AS mes,\n       SUM(valor_double) AS soma_double,\n       SUM(CAST(valor_double AS DECIMAL(18, 2))) AS soma_decimal,\n       SUM(valor_double) - SUM(CAST(valor_double AS DECIMAL(18, 2))) AS diferenca,\n       MAX(abs(valor_double)) AS maior_valor\nFROM <tabela>\nGROUP BY 1 ORDER BY 1;\n-- p = dígitos do maior valor + casas + folga para somas; s = casas exigidas pela regra."}},"area":"sql","arquivo":"Tipos, Conversões e Timezones (SQL / Databricks)","secao":"DECIMAL para valores financeiros","link":"cheatsheets.html#sql-02-decimal-para-valores-financeiros","semana":3},{"id":"sql-03-limpeza-aliases","ref":"01_sql/03_sanitizacao-e-nomenclatura.md#limpeza-basica-e-aliases","ferramenta":"TRIM, UPPER, LOWER e aliases","niveis":{"basico":{"enunciado":"Padronize cidade (maiúsculas, sem espaços nas pontas) e e-mail (minúsculas) e renomeie as colunas para o padrão `nm_`, `ds_`.","dados":[{"tabela":"lojas","colunas":["cidade","email"],"tipos":["STRING","STRING"],"linhas":[["  sao paulo ","Contato@Loja.COM "],["Recife"," vendas@loja.com"]]}],"solucao":"SELECT UPPER(TRIM(cidade)) AS nm_cidade,\n       LOWER(TRIM(email))  AS ds_email\nFROM lojas;"},"intermediario":{"enunciado":"A tabela de origem tem colunas com espaço e acento (`Data Venda`, `Valor Líquido`) e uma flag `FlgAtv`. Publique-as com nomes no padrão `snake_case` e prefixo `is_` para o booleano.","dados":[{"tabela":"origem","colunas":["Data Venda","Valor Líquido","FlgAtv"],"tipos":["STRING","DOUBLE","BOOLEAN"],"linhas":[["2025-01-01",10.5,true]]}],"solucao":"SELECT `Data Venda`    AS dt_venda,\n       `Valor Líquido` AS vl_liquido,\n       FlgAtv          AS is_ativo\nFROM origem;"},"avancado":{"enunciado":"Na sua base, encontre uma chave textual usada em join (ex.: código de loja, e-mail) e meça quantos valores só casam depois de `TRIM`/`UPPER`. Proponha onde (Bronze → Silver) essa padronização deve acontecer e como preservar o valor original.","dados":null,"solucao":"SELECT\n    count_if(a.chave = b.chave) AS casam_sem_limpeza,\n    count_if(UPPER(TRIM(a.chave)) = UPPER(TRIM(b.chave))) AS casam_com_limpeza\nFROM <tabela_a> a JOIN <tabela_b> b ON UPPER(TRIM(a.chave)) = UPPER(TRIM(b.chave));\n-- Padronize na Silver em uma coluna nova (chave_norm) e mantenha a original para auditoria."}},"area":"sql","arquivo":"Sanitização de Strings e Nomenclatura (SQL)","secao":"Limpeza básica e aliases","link":"cheatsheets.html#sql-03-limpeza-basica-e-aliases","semana":3},{"id":"sql-03-regex","ref":"01_sql/03_sanitizacao-e-nomenclatura.md#expressoes-regulares","ferramenta":"REGEXP_REPLACE, REGEXP_EXTRACT, RLIKE","niveis":{"basico":{"enunciado":"Remova a máscara do CPF, deixando só os dígitos.","dados":[{"tabela":"clientes","colunas":["id","cpf"],"tipos":["INT","STRING"],"linhas":[[1,"123.456.789-09"],[2,"987 654 321 00"]]}],"solucao":"SELECT id, REGEXP_REPLACE(cpf, '[^0-9]', '') AS cpf_digitos\nFROM clientes;"},"intermediario":{"enunciado":"Extraia o domínio de cada e-mail e marque quais e-mails têm formato válido (algo@algo.algo).","dados":[{"tabela":"usuarios","colunas":["email"],"tipos":["STRING"],"linhas":[["ana@empresa.com.br"],["bruno@@x.com"],["carla@site"],["d@e.io"]]}],"solucao":"SELECT email,\n       REGEXP_EXTRACT(email, '@(.+)$', 1) AS dominio,\n       email RLIKE '^[^@\\\\s]+@[^@\\\\s]+\\\\.[^@\\\\s]+$' AS formato_valido\nFROM usuarios;"},"avancado":{"enunciado":"Normalize descrições com espaços duplicados, tabulações e quebras de linha para um único espaço, e extraia o primeiro número de pedido no formato `PED-` seguido de 6 dígitos.","dados":[{"tabela":"chamados","colunas":["id","descricao"],"tipos":["INT","STRING"],"linhas":[[1,"Cliente   reclama\tdo PED-123456  e PED-654321"],[2,"Sem   pedido\ninformado"]]}],"solucao":"SELECT id,\n       TRIM(REGEXP_REPLACE(descricao, '\\\\s+', ' ')) AS descricao_normalizada,\n       NULLIF(REGEXP_EXTRACT(descricao, '(PED-[0-9]{6})', 1), '') AS primeiro_pedido\nFROM chamados;"}},"area":"sql","arquivo":"Sanitização de Strings e Nomenclatura (SQL)","secao":"Expressões regulares","link":"cheatsheets.html#sql-03-expressoes-regulares","semana":3},{"id":"sql-03-rename-column","ref":"01_sql/03_sanitizacao-e-nomenclatura.md#renomear-colunas-em-tabelas-delta","ferramenta":"ALTER TABLE RENAME COLUMN + column mapping","niveis":{"basico":{"enunciado":"Escreva os comandos para renomear a coluna `id_prod` para `id_produto` na tabela Delta `silver.vendas`, que ainda não tem column mapping.","dados":null,"solucao":"ALTER TABLE silver.vendas SET TBLPROPERTIES ('delta.columnMapping.mode' = 'name');\nALTER TABLE silver.vendas RENAME COLUMN id_prod TO id_produto;"},"intermediario":{"enunciado":"Antes de renomear uma coluna em uma tabela publicada, liste o que precisa ser verificado. Escreva a consulta que mostra as propriedades atuais da tabela (protocolo e column mapping).","dados":null,"solucao":"SHOW TBLPROPERTIES silver.vendas;\nDESCRIBE DETAIL silver.vendas;   -- minReaderVersion / minWriterVersion\n-- Verificar: leitores externos suportam o protocolo novo? Há streaming ou Change Data Feed\n-- lendo a tabela? Quais views, jobs e dashboards citam o nome antigo?"},"avancado":{"enunciado":"Na sua base, escolha uma tabela com nome de coluna fora do padrão. Planeje a renomeação sem quebrar consumidores: crie uma view de compatibilidade com o nome antigo, defina prazo de descontinuação e descreva a ordem dos passos.","dados":null,"solucao":"-- 1. Habilitar column mapping e renomear\nALTER TABLE silver.t SET TBLPROPERTIES ('delta.columnMapping.mode' = 'name');\nALTER TABLE silver.t RENAME COLUMN nomeAntigo TO nome_novo;\n-- 2. View de compatibilidade temporária\nCREATE OR REPLACE VIEW silver.t_compat AS SELECT *, nome_novo AS nomeAntigo FROM silver.t;\n-- 3. Migrar consumidores, monitorar uso da view e removê-la no prazo combinado."}},"area":"sql","arquivo":"Sanitização de Strings e Nomenclatura (SQL)","secao":"Renomear colunas em tabelas Delta","link":"cheatsheets.html#sql-03-renomear-colunas-em-tabelas-delta","semana":3},{"id":"sql-03-translate","ref":"01_sql/03_sanitizacao-e-nomenclatura.md#remocao-de-acentos-com-translate","ferramenta":"TRANSLATE","niveis":{"basico":{"enunciado":"Gere uma chave de comparação sem acentos e em minúsculas para os nomes.","dados":[{"tabela":"pdvs","colunas":["nome"],"tipos":["STRING"],"linhas":[["João do Caminhão"],["Joao do Caminhao"],["Açaí da Praça"]]}],"solucao":"SELECT nome,\n       TRANSLATE(LOWER(nome), 'áàâãäéèêëíìîïóòôõöúùûüç', 'aaaaaeeeeiiiiooooouuuuc') AS nome_chave\nFROM pdvs;"},"intermediario":{"enunciado":"Junte os cadastros do CRM e do ERP pelo nome, tolerando diferenças de acento e caixa. Quantos pares casam com e sem a normalização?","dados":[{"tabela":"crm","colunas":["id_crm","nome"],"tipos":["INT","STRING"],"linhas":[[1,"João Silva"],[2,"Márcia Lima"],[3,"Pedro"]]},{"tabela":"erp","colunas":["id_erp","nome"],"tipos":["INT","STRING"],"linhas":[[10,"JOAO SILVA"],[20,"Marcia Lima"],[30,"Paulo"]]}],"solucao":"WITH c AS (SELECT id_crm, nome, TRANSLATE(LOWER(nome), 'áàâãäéèêëíìîïóòôõöúùûüç', 'aaaaaeeeeiiiiooooouuuuc') AS chave FROM crm),\n     e AS (SELECT id_erp, nome, TRANSLATE(LOWER(nome), 'áàâãäéèêëíìîïóòôõöúùûüç', 'aaaaaeeeeiiiiooooouuuuc') AS chave FROM erp)\nSELECT\n    (SELECT COUNT(*) FROM crm JOIN erp ON crm.nome = erp.nome) AS casam_sem_normalizar,\n    (SELECT COUNT(*) FROM c JOIN e ON c.chave = e.chave)       AS casam_normalizado;"},"avancado":{"enunciado":"Na sua base, descubra quais caracteres acentuados ou especiais aparecem em uma coluna de nomes e não estão cobertos pela lista do `TRANSLATE` do cheatsheet. Amplie a lista e documente os casos que exigem outra estratégia.","dados":null,"solucao":"SELECT c AS caractere, COUNT(*) AS ocorrencias\nFROM <tabela>\nLATERAL VIEW explode(split(nome, '')) t AS c\nWHERE c RLIKE '[^A-Za-z0-9 ]'\n  AND NOT instr('áàâãäéèêëíìîïóòôõöúùûüçÁÀÂÃÄÉÈÊËÍÌÎÏÓÒÔÕÖÚÙÛÜÇ', c) > 0\nGROUP BY c ORDER BY ocorrencias DESC;"}},"area":"sql","arquivo":"Sanitização de Strings e Nomenclatura (SQL)","secao":"Remoção de acentos com TRANSLATE","link":"cheatsheets.html#sql-03-remocao-de-acentos-com-translate","semana":3},{"id":"sql-04-coalesce-case","ref":"01_sql/04_nulos-e-condicionais.md#coalesce-e-case-when","ferramenta":"COALESCE e CASE WHEN","niveis":{"basico":{"enunciado":"Substitua o nome nulo por 'SEM NOME' e a categoria nula por -1.","dados":[{"tabela":"produtos","colunas":["id","nome","id_categoria"],"tipos":["INT","STRING","INT"],"linhas":[[1,"Caneta",10],[2,null,null],[3,"Lápis",null]]}],"solucao":"SELECT id,\n       COALESCE(nome, 'SEM NOME') AS nome,\n       COALESCE(id_categoria, -1) AS id_categoria\nFROM produtos;"},"intermediario":{"enunciado":"Classifique o risco: status 'A' → ALTO; status 'M' e ativo → MEDIO; o resto → BAIXO. O que acontece com status nulo?","dados":[{"tabela":"contas","colunas":["id","status","is_ativo"],"tipos":["INT","STRING","BOOLEAN"],"linhas":[[1,"A",true],[2,"M",true],[3,"M",false],[4,null,true]]}],"solucao":"SELECT id,\n       CASE\n           WHEN status = 'A'                THEN 'ALTO'\n           WHEN status = 'M' AND is_ativo   THEN 'MEDIO'\n           ELSE 'BAIXO'\n       END AS risco\nFROM contas;\n-- status NULL não satisfaz nenhum WHEN e cai no ELSE (BAIXO). Se isso não for a regra,\n-- trate explicitamente: WHEN status IS NULL THEN 'DESCONHECIDO'."},"avancado":{"enunciado":"Use a chave substituta -1 para vendas sem categoria e garanta que o join com a dimensão não perca linhas. A dimensão ainda não tem o membro desconhecido.","dados":[{"tabela":"vendas","colunas":["id_venda","id_categoria","valor"],"tipos":["INT","INT","INT"],"linhas":[[1,10,100],[2,null,50]]},{"tabela":"dim_categoria","colunas":["id_categoria","nome"],"tipos":["INT","STRING"],"linhas":[[10,"Papelaria"]]}],"solucao":"WITH dim AS (\n    SELECT id_categoria, nome FROM dim_categoria\n    UNION ALL\n    SELECT -1, 'Desconhecido'\n)\nSELECT v.id_venda, v.valor, d.nome AS categoria\nFROM vendas AS v\nJOIN dim AS d ON COALESCE(v.id_categoria, -1) = d.id_categoria;"}},"area":"sql","arquivo":"Nulos e Condicionais (SQL)","secao":"COALESCE e CASE WHEN","link":"cheatsheets.html#sql-04-coalesce-e-case-when","semana":3},{"id":"sql-04-divisao-por-zero","ref":"01_sql/04_nulos-e-condicionais.md#divisao-por-zero-nullif-e-funcoes-try","ferramenta":"NULLIF e try_divide","niveis":{"basico":{"enunciado":"Calcule `receita / custo` sem erro quando o custo for zero.","dados":[{"tabela":"produtos","colunas":["id","receita","custo"],"tipos":["INT","INT","INT"],"linhas":[[1,100,50],[2,80,0],[3,30,null]]}],"solucao":"SELECT id, receita / NULLIF(custo, 0) AS margem\nFROM produtos;"},"intermediario":{"enunciado":"Calcule a margem com `try_divide` e crie uma flag de qualidade portável (sem `IFF`) que separe custo zero de custo ausente.","dados":[{"tabela":"produtos","colunas":["id","receita","custo"],"tipos":["INT","INT","INT"],"linhas":[[1,100,50],[2,80,0],[3,30,null]]}],"solucao":"SELECT id,\n       try_divide(receita, custo) AS margem,\n       CASE WHEN custo IS NULL THEN 'AUSENTE'\n            WHEN custo = 0     THEN 'ZERO'\n            ELSE 'OK' END AS qualidade_custo\nFROM produtos;"},"avancado":{"enunciado":"Calcule o ticket médio por loja (`receita / pedidos`) em uma agregação. Lojas sem pedido devem aparecer com ticket nulo e uma métrica separada deve contar quantas lojas ficaram sem ticket.","dados":[{"tabela":"lojas_mes","colunas":["loja","receita","pedidos"],"tipos":["STRING","DECIMAL(10,2)","INT"],"linhas":[["A",1000.0,10],["B",0.0,0],["C",450.5,3]]}],"solucao":"WITH t AS (\n    SELECT loja, try_divide(receita, pedidos) AS ticket FROM lojas_mes\n)\nSELECT loja, ticket, count_if(ticket IS NULL) OVER () AS lojas_sem_ticket\nFROM t;"}},"area":"sql","arquivo":"Nulos e Condicionais (SQL)","secao":"Divisão por zero, NULLIF e funções try_","link":"cheatsheets.html#sql-04-divisao-por-zero-nullif-e-funcoes-try","semana":3},{"id":"sql-04-null-agregacoes","ref":"01_sql/04_nulos-e-condicionais.md#null-em-agregacoes-e-comparacoes","ferramenta":"COUNT(col), AVG com NULL, <=>","niveis":{"basico":{"enunciado":"Conte o total de envios e quantos têm telefone preenchido.","dados":[{"tabela":"envios","colunas":["id","telefone"],"tipos":["INT","STRING"],"linhas":[[1,"9999"],[2,null],[3,null],[4,"8888"]]}],"solucao":"SELECT COUNT(*) AS total, COUNT(telefone) AS com_telefone\nFROM envios;"},"intermediario":{"enunciado":"Calcule a média das notas ignorando nulos e tratando nulos como zero. Qual a diferença e quando cada uma é correta?","dados":[{"tabela":"avaliacoes","colunas":["id","nota"],"tipos":["INT","INT"],"linhas":[[1,10],[2,8],[3,null],[4,null]]}],"solucao":"SELECT AVG(nota)              AS media_respondentes,   -- 9.0\n       AVG(COALESCE(nota, 0)) AS media_todos            -- 4.5\nFROM avaliacoes;\n-- Ignorar nulos: média de quem respondeu. Zero: só se 'não respondeu' significar nota 0."},"avancado":{"enunciado":"Compare duas versões de cadastro e liste as linhas cujo e-mail mudou, inclusive de valor para nulo e de nulo para valor. Por que `a.email <> b.email` não basta?","dados":[{"tabela":"v1","colunas":["id","email"],"tipos":["INT","STRING"],"linhas":[[1,"a@x.com"],[2,null],[3,"c@x.com"],[4,null]]},{"tabela":"v2","colunas":["id","email"],"tipos":["INT","STRING"],"linhas":[[1,"a@x.com"],[2,"b@x.com"],[3,null],[4,null]]}],"solucao":"-- <> com NULL resulta em desconhecido e descarta os ids 2 e 3.\nSELECT v1.id, v1.email AS antes, v2.email AS depois\nFROM v1 JOIN v2 USING (id)\nWHERE NOT (v1.email <=> v2.email);"}},"area":"sql","arquivo":"Nulos e Condicionais (SQL)","secao":"NULL em agregações e comparações","link":"cheatsheets.html#sql-04-null-em-agregacoes-e-comparacoes","semana":3},{"id":"sql-05-cte-recursiva","ref":"01_sql/05_ctes.md#cte-recursiva","ferramenta":"WITH RECURSIVE","niveis":{"basico":{"enunciado":"Gere os números de 1 a 5 com uma CTE recursiva.","dados":null,"solucao":"WITH RECURSIVE seq (n) AS (\n    SELECT 1\n    UNION ALL\n    SELECT n + 1 FROM seq WHERE n < 5\n)\nSELECT n FROM seq;"},"intermediario":{"enunciado":"Monte o organograma: para cada colaborador, o nível hierárquico a partir do diretor (sem gestor).","dados":[{"tabela":"colaboradores","colunas":["id","nome","id_gestor"],"tipos":["INT","STRING","INT"],"linhas":[[1,"Diretora",null],[2,"Gerente A",1],[3,"Gerente B",1],[4,"Analista",2],[5,"Estagiário",4]]}],"solucao":"WITH RECURSIVE hierarquia (id, nome, id_gestor, nivel) AS (\n    SELECT id, nome, id_gestor, 0 FROM colaboradores WHERE id_gestor IS NULL\n    UNION ALL\n    SELECT c.id, c.nome, c.id_gestor, h.nivel + 1\n    FROM colaboradores AS c\n    JOIN hierarquia AS h ON c.id_gestor = h.id\n)\nSELECT * FROM hierarquia ORDER BY nivel, id;"},"avancado":{"enunciado":"Monte o caminho completo de cada categoria (ex.: `Casa > Cozinha > Panelas`). Depois explique o que acontece se houver um ciclo (categoria apontando para uma descendente) e como se proteger.","dados":[{"tabela":"categorias","colunas":["id","nome","id_pai"],"tipos":["INT","STRING","INT"],"linhas":[[1,"Casa",null],[2,"Cozinha",1],[3,"Panelas",2],[4,"Jardim",1]]}],"solucao":"WITH RECURSIVE arvore (id, caminho, profundidade) AS (\n    SELECT id, nome, 0 FROM categorias WHERE id_pai IS NULL\n    UNION ALL\n    SELECT c.id, concat(a.caminho, ' > ', c.nome), a.profundidade + 1\n    FROM categorias AS c\n    JOIN arvore AS a ON c.id_pai = a.id\n    WHERE a.profundidade < 20   -- proteção contra ciclos\n)\nSELECT * FROM arvore ORDER BY caminho;\n-- Com ciclo e sem a proteção, a recursão cresce até o limite (padrão 100) e falha\n-- com RECURSION_LEVEL_LIMIT_EXCEEDED."}},"area":"sql","arquivo":"CTEs e Views Temporárias (Databricks / Spark SQL)","secao":"CTE recursiva","link":"cheatsheets.html#sql-05-cte-recursiva","semana":3},{"id":"sql-05-ctes-organizar","ref":"01_sql/05_ctes.md#ctes-para-organizar-a-logica","ferramenta":"WITH (CTE)","niveis":{"basico":{"enunciado":"Com uma CTE para clientes ativos e outra para o total comprado por cliente, liste nome e total dos clientes ativos.","dados":[{"tabela":"clientes","colunas":["id_cliente","nome","status"],"tipos":["INT","STRING","STRING"],"linhas":[[1,"Ana","ATIVO"],[2,"Bruno","INATIVO"],[3,"Carla","ATIVO"]]},{"tabela":"vendas","colunas":["id_cliente","receita"],"tipos":["INT","INT"],"linhas":[[1,100],[1,50],[2,70],[3,30]]}],"solucao":"WITH clientes_ativos AS (\n    SELECT id_cliente, nome FROM clientes WHERE status = 'ATIVO'\n),\nfaturamento AS (\n    SELECT id_cliente, SUM(receita) AS total FROM vendas GROUP BY id_cliente\n)\nSELECT c.nome, f.total\nFROM clientes_ativos AS c\nJOIN faturamento AS f USING (id_cliente);"},"intermediario":{"enunciado":"Reescreva com CTEs nomeadas por conteúdo a consulta aninhada:\n`SELECT * FROM (SELECT uf, SUM(v) s FROM (SELECT uf, valor v FROM pedidos WHERE valor > 0) GROUP BY uf) WHERE s > 100`","dados":[{"tabela":"pedidos","colunas":["uf","valor"],"tipos":["STRING","INT"],"linhas":[["SP",80],["SP",40],["RJ",90],["RJ",-5]]}],"solucao":"WITH pedidos_validos AS (\n    SELECT uf, valor FROM pedidos WHERE valor > 0\n),\ntotal_por_uf AS (\n    SELECT uf, SUM(valor) AS total FROM pedidos_validos GROUP BY uf\n)\nSELECT * FROM total_por_uf WHERE total > 100;"},"avancado":{"enunciado":"Na sua base, pegue a consulta mais longa que você mantém e refatore-a em CTEs com uma responsabilidade cada (filtrar, padronizar, agregar, juntar). Valide que o resultado é idêntico comparando as duas versões com `EXCEPT ALL` nos dois sentidos.","dados":null,"solucao":"WITH antiga AS (<consulta original>), nova AS (<consulta refatorada>)\nSELECT 'so_antiga' AS lado, * FROM (SELECT * FROM antiga EXCEPT ALL SELECT * FROM nova)\nUNION ALL\nSELECT 'so_nova', * FROM (SELECT * FROM nova EXCEPT ALL SELECT * FROM antiga);\n-- Resultado vazio = mesma saída, inclusive multiplicidade."}},"area":"sql","arquivo":"CTEs e Views Temporárias (Databricks / Spark SQL)","secao":"CTEs para organizar a lógica","link":"cheatsheets.html#sql-05-ctes-para-organizar-a-logica","semana":3},{"id":"sql-05-reaproveitamento","ref":"01_sql/05_ctes.md#reaproveitamento-e-materializacao","ferramenta":"EXPLAIN de CTE reutilizada, CACHE TABLE","niveis":{"basico":{"enunciado":"Use a mesma CTE de vendas recentes duas vezes (uma por região) e rode `EXPLAIN FORMATTED`. Procure se aparece `ReusedExchange` ou duas leituras da tabela.","dados":[{"tabela":"vendas","colunas":["id","regiao","dt_venda"],"tipos":["INT","STRING","DATE"],"linhas":[[1,"N","2025-02-01"],[2,"S","2025-03-01"],[3,"S","2024-12-31"]]}],"solucao":"EXPLAIN FORMATTED\nWITH vendas_recentes AS (\n    SELECT * FROM vendas WHERE dt_venda >= DATE '2025-01-01'\n)\nSELECT 'N' AS regiao, COUNT(*) FROM vendas_recentes WHERE regiao = 'N'\nUNION ALL\nSELECT 'S', COUNT(*) FROM vendas_recentes WHERE regiao = 'S';"},"intermediario":{"enunciado":"Em um cluster clássico (não serverless), materialize em cache o passo caro, use-o nas duas consultas e libere a memória no final.","dados":null,"solucao":"CACHE TABLE vendas_recentes AS\nSELECT * FROM silver.vendas WHERE dt_venda >= DATE '2025-01-01';\n\nSELECT regiao, COUNT(*) FROM vendas_recentes GROUP BY regiao;\nSELECT MAX(valor) FROM vendas_recentes;\n\nUNCACHE TABLE vendas_recentes;"},"avancado":{"enunciado":"Na sua base, encontre uma consulta em que uma CTE pesada é usada 2+ vezes. Meça o tempo e os bytes lidos (Query Profile ou Spark UI) da versão original e de uma versão com tabela intermediária. Registre se a materialização compensou, considerando o custo de escrita.","dados":null,"solucao":"-- Versão A: consulta original com a CTE.\n-- Versão B:\nCREATE OR REPLACE TABLE main.tmp.passo_caro AS <corpo da CTE>;\n<consulta usando main.tmp.passo_caro>;\nDROP TABLE main.tmp.passo_caro;\n-- Compare: duração total, bytes lidos, nº de scans da origem no plano.\n-- Só mantenha B se o ganho superar o custo de escrita e limpeza."}},"area":"sql","arquivo":"CTEs e Views Temporárias (Databricks / Spark SQL)","secao":"Reaproveitamento e materialização","link":"cheatsheets.html#sql-05-reaproveitamento-e-materializacao","semana":3},{"id":"sql-05-temp-views","ref":"01_sql/05_ctes.md#views-temporarias","ferramenta":"CREATE TEMP VIEW","niveis":{"basico":{"enunciado":"Crie uma temp view que marque usuários sem e-mail com uma flag e consulte só os problemáticos.","dados":[{"tabela":"usuarios","colunas":["id","email"],"tipos":["INT","STRING"],"linhas":[[1,"a@x.com"],[2,null],[3,null]]}],"solucao":"CREATE OR REPLACE TEMP VIEW v_qualidade_usuarios AS\nSELECT *, CASE WHEN email IS NULL THEN 1 ELSE 0 END AS flag_sem_email\nFROM usuarios;\n\nSELECT * FROM v_qualidade_usuarios WHERE flag_sem_email = 1;"},"intermediario":{"enunciado":"Crie uma temp view com o resumo de qualidade (total, sem e-mail, % sem e-mail) a partir da view anterior, para reaproveitar em outras células do notebook.","dados":[{"tabela":"usuarios","colunas":["id","email"],"tipos":["INT","STRING"],"linhas":[[1,"a@x.com"],[2,null],[3,null],[4,"d@x.com"]]}],"solucao":"CREATE OR REPLACE TEMP VIEW v_qualidade_usuarios AS\nSELECT *, CASE WHEN email IS NULL THEN 1 ELSE 0 END AS flag_sem_email FROM usuarios;\n\nCREATE OR REPLACE TEMP VIEW v_resumo_qualidade AS\nSELECT COUNT(*) AS total,\n       SUM(flag_sem_email) AS sem_email,\n       ROUND(100 * AVG(flag_sem_email), 1) AS pct_sem_email\nFROM v_qualidade_usuarios;\n\nSELECT * FROM v_resumo_qualidade;"},"avancado":{"enunciado":"Um job serverless precisa compartilhar um resultado intermediário entre dois notebooks (tarefas diferentes). Explique por que temp view e global temp view não servem e implemente a alternativa com limpeza ao final.","dados":null,"solucao":"-- Temp view vive só na sessão; global temp view não é suportada em serverless.\n-- Tarefa 1:\nCREATE OR REPLACE TABLE main.tmp.resultado_intermediario AS SELECT ...;\n-- Tarefa 2:\nSELECT * FROM main.tmp.resultado_intermediario;\n-- Última tarefa (ou em caso de falha, num passo de limpeza):\nDROP TABLE IF EXISTS main.tmp.resultado_intermediario;"}},"area":"sql","arquivo":"CTEs e Views Temporárias (Databricks / Spark SQL)","secao":"Views temporárias","link":"cheatsheets.html#sql-05-views-temporarias","semana":3},{"id":"sql-06-agregacoes-filter","ref":"01_sql/06_group-by-e-pivots.md#agregacoes-e-filtros-por-agregacao","ferramenta":"count_if, FILTER (WHERE), approx_count_distinct","niveis":{"basico":{"enunciado":"Por região: total de pedidos, frete total e quantos pedidos falharam (sem `CASE WHEN`).","dados":[{"tabela":"despachos","colunas":["regiao","status","frete"],"tipos":["STRING","STRING","INT"],"linhas":[["N","OK",10],["N","FALHA",5],["S","OK",20],["S","OK",15]]}],"solucao":"SELECT regiao,\n       COUNT(*) AS pedidos,\n       SUM(frete) AS frete_total,\n       count_if(status = 'FALHA') AS falhas\nFROM despachos\nGROUP BY regiao;"},"intermediario":{"enunciado":"Por região, mostre o frete da LOJA e do SITE em colunas separadas usando `FILTER (WHERE ...)`, e só as regiões com frete total acima de 20.","dados":[{"tabela":"despachos","colunas":["regiao","canal","frete"],"tipos":["STRING","STRING","INT"],"linhas":[["N","LOJA",10],["N","SITE",5],["S","LOJA",20],["S","SITE",15]]}],"solucao":"SELECT regiao,\n       SUM(frete) FILTER (WHERE canal = 'LOJA') AS frete_loja,\n       SUM(frete) FILTER (WHERE canal = 'SITE') AS frete_site\nFROM despachos\nGROUP BY regiao\nHAVING SUM(frete) > 20;"},"avancado":{"enunciado":"Na sua base, compare `COUNT(DISTINCT id_cliente)` com `approx_count_distinct(id_cliente)` (padrão) e com `approx_count_distinct(id_cliente, 0.01)` por mês. Meça o erro relativo e o tempo de cada versão e decida qual usar no dashboard.","dados":null,"solucao":"SELECT date_trunc('MONTH', dt_venda) AS mes,\n       COUNT(DISTINCT id_cliente)               AS exato,\n       approx_count_distinct(id_cliente)        AS aprox_5pct,\n       approx_count_distinct(id_cliente, 0.01)  AS aprox_1pct,\n       ROUND(100 * (approx_count_distinct(id_cliente) - COUNT(DISTINCT id_cliente)) / COUNT(DISTINCT id_cliente), 2) AS erro_pct\nFROM <tabela>\nGROUP BY 1 ORDER BY 1;\n-- Rode cada métrica isolada para comparar tempo; o erro padrão esperado é ~5% (relativeSD = 0.05)."}},"area":"sql","arquivo":"Agrupamentos e Pivots (SQL / Databricks)","secao":"Agregações e filtros por agregação","link":"cheatsheets.html#sql-06-agregacoes-e-filtros-por-agregacao","semana":2},{"id":"sql-06-pivot-unpivot","ref":"01_sql/06_group-by-e-pivots.md#pivot-e-unpivot","ferramenta":"PIVOT e UNPIVOT","niveis":{"basico":{"enunciado":"Gire as vendas por região, com uma coluna por ano (2024 e 2025).","dados":[{"tabela":"vendas_anuais","colunas":["regiao","ano","vendas"],"tipos":["STRING","INT","INT"],"linhas":[["N",2024,10],["N",2025,15],["S",2024,20],["S",2025,5],["S",2025,5]]}],"solucao":"SELECT *\nFROM (SELECT regiao, ano, vendas FROM vendas_anuais)\nPIVOT (SUM(vendas) FOR ano IN (2024, 2025));"},"intermediario":{"enunciado":"A planilha tem uma coluna por mês. Transforme em linhas (`mes`, `receita`) com nomes curtos para os meses.","dados":[{"tabela":"planilha","colunas":["loja","receita_jan","receita_fev","receita_mar"],"tipos":["STRING","INT","INT","INT"],"linhas":[["A",10,20,30],["B",5,null,7]]}],"solucao":"SELECT *\nFROM planilha\nUNPIVOT (\n    receita FOR mes IN (receita_jan AS jan, receita_fev AS fev, receita_mar AS mar)\n);\n-- A loja B não terá a linha de fevereiro: UNPIVOT descarta NULL por padrão."},"avancado":{"enunciado":"Repita o unpivot preservando os meses sem valor e, em seguida, pivote de volta para conferir que o resultado reconstrói a planilha original.","dados":[{"tabela":"planilha","colunas":["loja","receita_jan","receita_fev"],"tipos":["STRING","INT","INT"],"linhas":[["A",10,20],["B",5,null]]}],"solucao":"WITH longo AS (\n    SELECT * FROM planilha\n    UNPIVOT INCLUDE NULLS (receita FOR mes IN (receita_jan AS jan, receita_fev AS fev))\n)\nSELECT *\nFROM longo\nPIVOT (first(receita) FOR mes IN ('jan' AS receita_jan, 'fev' AS receita_fev));"}},"area":"sql","arquivo":"Agrupamentos e Pivots (SQL / Databricks)","secao":"PIVOT e UNPIVOT","link":"cheatsheets.html#sql-06-pivot-e-unpivot","semana":2},{"id":"sql-06-rollup-cube","ref":"01_sql/06_group-by-e-pivots.md#subtotais-rollup-cube-e-grouping-sets","ferramenta":"ROLLUP, CUBE, GROUPING SETS, grouping_id","niveis":{"basico":{"enunciado":"Some o volume por país e região com subtotal por país e total geral.","dados":[{"tabela":"transporte","colunas":["pais","regiao","volume"],"tipos":["STRING","STRING","INT"],"linhas":[["BR","SUL",10],["BR","NE",20],["AR","NORTE",5]]}],"solucao":"SELECT pais, regiao, SUM(volume) AS volume\nFROM transporte\nGROUP BY ROLLUP (pais, regiao)\nORDER BY pais NULLS LAST, regiao NULLS LAST;"},"intermediario":{"enunciado":"Faça o mesmo rollup, mas rotule as linhas como 'DETALHE', 'SUBTOTAL PAÍS' e 'TOTAL'. Atenção: existe uma região nula de verdade nos dados.","dados":[{"tabela":"transporte","colunas":["pais","regiao","volume"],"tipos":["STRING","STRING","INT"],"linhas":[["BR","SUL",10],["BR",null,20],["AR","NORTE",5]]}],"solucao":"SELECT pais, regiao, SUM(volume) AS volume,\n       CASE grouping_id(pais, regiao)\n           WHEN 0 THEN 'DETALHE'\n           WHEN 1 THEN 'SUBTOTAL PAÍS'\n           ELSE 'TOTAL'\n       END AS nivel\nFROM transporte\nGROUP BY ROLLUP (pais, regiao);"},"avancado":{"enunciado":"Gere em uma consulta: total por (ano, região), total por ano e total por região — mas **não** o total geral nem outras combinações.","dados":[{"tabela":"faturamento","colunas":["ano","regiao","vendas"],"tipos":["INT","STRING","INT"],"linhas":[[2024,"N",10],[2024,"S",20],[2025,"N",30]]}],"solucao":"SELECT ano, regiao, SUM(vendas) AS vendas, grouping_id(ano, regiao) AS nivel\nFROM faturamento\nGROUP BY GROUPING SETS ((ano, regiao), (ano), (regiao))\nORDER BY nivel, ano, regiao;"}},"area":"sql","arquivo":"Agrupamentos e Pivots (SQL / Databricks)","secao":"Subtotais: ROLLUP, CUBE e GROUPING SETS","link":"cheatsheets.html#sql-06-subtotais-rollup-cube-e-grouping-sets","semana":2},{"id":"sql-07-cardinalidade","ref":"01_sql/07_joins.md#cardinalidade-e-exploding-join","ferramenta":"Diagnóstico de exploding join","niveis":{"basico":{"enunciado":"Antes de juntar vendas com a dimensão de loja, verifique se a dimensão tem uma linha por loja.","dados":[{"tabela":"dim_loja","colunas":["loja_id","uf","atualizado_em"],"tipos":["INT","STRING","DATE"],"linhas":[[10,"SP","2025-01-01"],[10,"SP","2025-03-01"],[20,"RJ","2025-01-01"]]}],"solucao":"SELECT loja_id, COUNT(*) AS quantidade\nFROM dim_loja\nGROUP BY loja_id\nHAVING COUNT(*) > 1;"},"intermediario":{"enunciado":"Some a receita por UF. A dimensão de loja tem versões duplicadas e infla o resultado. Mostre o total errado e o correto, usando a versão mais recente de cada loja.","dados":[{"tabela":"fato_vendas","colunas":["id_venda","loja_id","valor"],"tipos":["INT","INT","INT"],"linhas":[[1,10,100],[2,20,50]]},{"tabela":"dim_loja","colunas":["loja_id","uf","atualizado_em","versao"],"tipos":["INT","STRING","DATE","INT"],"linhas":[[10,"SP","2025-01-01",1],[10,"SP","2025-03-01",2],[20,"RJ","2025-01-01",1]]}],"solucao":"-- Errado: SP aparece
