<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafio do Dia — DataEng Playbook</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0b0f19;
    --bg-card: rgba(30, 41, 59, 0.45);
    --bg-code: #0f172a;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border-card: rgba(148, 163, 184, 0.12);
    --border-strong: rgba(148, 163, 184, 0.3);
    --sql-color: #0ea5e9;
    --sql-bg: rgba(14, 165, 233, 0.12);
    --pyspark-color: #a78bfa;
    --pyspark-bg: rgba(139, 92, 246, 0.14);
    --accent: #f59e0b;
    --accent-bg: rgba(245, 158, 11, 0.12);
    --radius: 14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem 3rem;
    line-height: 1.6;
    overflow-x: hidden;
  }

  .container { max-width: 860px; margin: 0 auto; }

  nav.top {
    display: flex; gap: 18px; flex-wrap: wrap;
    font-size: 12px; margin-bottom: 1.75rem;
  }
  nav.top a { color: var(--text-muted); text-decoration: none; }
  nav.top a:hover { color: var(--text-primary); }

  header h1 {
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  header p { color: var(--text-secondary); margin-top: .35rem; max-width: 640px; }

  .controls {
    display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
    margin: 1.5rem 0 1.25rem;
  }
  .seg { display: inline-flex; border: 1px solid var(--border-card); border-radius: 999px; overflow: hidden; }
  .seg button {
    background: transparent; border: 0; color: var(--text-secondary);
    font: 500 .8rem 'Inter', sans-serif; padding: .45rem .9rem; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--border-card); color: var(--text-primary); }
  select {
    background: var(--bg-card); color: var(--text-primary);
    border: 1px solid var(--border-card); border-radius: 999px;
    font: 500 .8rem 'Inter', sans-serif; padding: .45rem .8rem;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    padding: 1.5rem;
    backdrop-filter: blur(16px);
  }

  .meta { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .9rem; }
  .pill {
    font: 600 .7rem 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .05em;
    padding: .25rem .6rem; border-radius: 999px; border: 1px solid var(--border-card); color: var(--text-secondary);
  }
  .pill.sql { color: var(--sql-color); background: var(--sql-bg); border-color: transparent; }
  .pill.pyspark { color: var(--pyspark-color); background: var(--pyspark-bg); border-color: transparent; }
  .pill.extra { color: var(--accent); background: var(--accent-bg); border-color: transparent; }

  .ferramenta { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .origem { color: var(--text-secondary); font-size: .9rem; margin-top: .2rem; }
  .origem a { color: var(--text-primary); }

  .tabs { display: flex; gap: .25rem; margin: 1.4rem 0 1rem; border-bottom: 1px solid var(--border-card); }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    color: var(--text-muted); font: 600 .85rem 'Inter', sans-serif; padding: .5rem .8rem; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--text-primary); }

  .enunciado { font-size: 1rem; }
  .enunciado code, .nota code {
    font-family: 'JetBrains Mono', monospace; font-size: .85em;
    background: var(--bg-code); padding: .1rem .35rem; border-radius: 4px;
  }
  .nota { color: var(--text-secondary); font-size: .85rem; margin-top: .8rem; }

  .tabela { margin-top: 1.1rem; }
  .tabela h3 { font: 600 .75rem 'JetBrains Mono', monospace; color: var(--text-secondary); margin-bottom: .35rem; }
  .scroll { overflow-x: auto; border: 1px solid var(--border-card); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font: .8rem 'JetBrains Mono', monospace; }
  th, td { text-align: left; padding: .4rem .7rem; border-bottom: 1px solid var(--border-card); white-space: nowrap; }
  th small { display: block; color: var(--text-muted); font-weight: 400; }
  tr:last-child td { border-bottom: 0; }
  td.nulo { color: var(--text-muted); font-style: italic; }

  details { margin-top: 1.3rem; }
  summary {
    cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--text-secondary);
    list-style: none; display: inline-flex; gap: .4rem; align-items: center;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '▸'; transition: transform .2s; }
  details[open] summary::before { transform: rotate(90deg); }
  .code-wrap { position: relative; margin-top: .7rem; }
  pre {
    background: var(--bg-code); border: 1px solid var(--border-card); border-radius: 10px;
    padding: 1rem; overflow-x: auto; font: .82rem/1.55 'JetBrains Mono', monospace; color: #e2e8f0;
  }
  .copy {
    position: absolute; top: .5rem; right: .5rem;
    background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-card);
    border-radius: 6px; font: 500 .72rem 'Inter', sans-serif; padding: .25rem .55rem; cursor: pointer;
  }

  .acoes { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.25rem; }
  .btn {
    background: transparent; color: var(--text-primary); border: 1px solid var(--border-strong);
    border-radius: 999px; font: 600 .8rem 'Inter', sans-serif; padding: .5rem 1rem; cursor: pointer;
  }
  .btn:hover { background: var(--border-card); }

  .rodape { color: var(--text-muted); font-size: .8rem; margin-top: 1.5rem; }
  .vazio { color: var(--text-secondary); }
</style>
</head>
<body>
<div class="container">
  <nav class="top">
    <a href="index.html">← Hub</a>
    <a href="cheatsheets.html">Cheatsheets</a>
    <a href="plano-12-semanas.html">Plano de 12 semanas</a>
  </nav>

  <header>
    <h1>Desafio do Dia</h1>
    <p>Um tópico dos cheatsheets por dia, em três níveis. O sorteio percorre todos os tópicos antes de repetir qualquer um.</p>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Área">
      <button type="button" data-area="todos">Todos</button>
      <button type="button" data-area="sql">SQL</button>
      <button type="button" data-area="pyspark">PySpark</button>
    </div>
    <select id="semana" aria-label="Semana do plano">
      <option value="">Todas as semanas</option>
    </select>
  </div>

  <main id="desafio" class="card" aria-live="polite"></main>

  <p class="rodape" id="rodape"></p>
</div>

<script>
  const DESAFIOS = {{ DESAFIOS_JSON }};
  const NIVEIS = [["basico", "Básico"], ["intermediario", "Intermediário"], ["avancado", "Avançado"]];
  const INICIO = Date.UTC(2026, 0, 1);

  const guardar = (k, v) => { try { localStorage.setItem("desafio." + k, v); } catch (e) {} };
  const ler = (k, padrao) => { try { return localStorage.getItem("desafio." + k) || padrao; } catch (e) { return padrao; } };

  const estado = {
    area: ler("area", "todos"),
    semana: ler("semana", ""),
    nivel: ler("nivel", "basico"),
    extra: null,            // id sorteado fora do desafio do dia
  };

  // ?id=<desafio> abre um desafio específico (links das trilhas), sem filtros.
  const idPedido = new URLSearchParams(location.search).get("id");
  if (idPedido && DESAFIOS.some(d => d.id === idPedido)) {
    estado.extra = idPedido; estado.area = "todos"; estado.semana = "";
  }

  function hoje() {
    const param = new URLSearchParams(location.search).get("data");   // ?data=AAAA-MM-DD para testes
    const d = param ? new Date(param + "T12:00:00") : new Date();
    return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - INICIO) / 86400000);
  }

  function semente(texto) {
    let h = 2166136261;
    for (const c of texto) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Permutação embaralhada por ciclo: cada tópico sai uma vez por ciclo, em ordem aleatória.
  function permutacao(n, chave, ciclo) {
    const rnd = mulberry32(semente(chave + ":" + ciclo));
    const p = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [p[i], p[j]] = [p[j], p[i]];
    }
    return p;
  }

  function ordemDoCiclo(n, chave, ciclo) {
    if (n <= 2) return Array.from({ length: n }, (_, i) => i);   // alterna sem repetir
    const p = permutacao(n, chave, ciclo);
    {
      const anterior = permutacao(n, chave, ciclo - 1);
      if (p[0] === anterior[n - 1]) [p[0], p[1]] = [p[1], p[0]];   // evita repetir na virada do ciclo
    }
    return p;
  }

  function filtrados() {
    return DESAFIOS
      .filter(d => estado.area === "todos" || d.area === estado.area)
      .filter(d => !estado.semana || String(d.semana) === estado.semana);
  }

  function escolher(lista) {
    const n = lista.length;
    const dia = hoje();
    const ciclo = Math.floor(dia / n);
    const posicao = ((dia % n) + n) % n;
    const chave = estado.area + "|" + estado.semana;
    return { desafio: lista[ordemDoCiclo(n, chave, ciclo)[posicao]], ciclo: ciclo + 1, posicao: posicao + 1, n };
  }

  function escapar(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function textoRico(s) {
    return escapar(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
  }

  function tabela(t) {
    const tipos = t.tipos || [];
    const cab = t.colunas.map((c, i) => `<th>${escapar(c)}${tipos[i] ? `<small>${escapar(tipos[i])}</small>` : ""}</th>`).join("");
    const linhas = t.linhas.map(l => "<tr>" + l.map(v =>
      v === null ? '<td class="nulo">null</td>' : `<td>${escapar(typeof v === "object" ? JSON.stringify(v) : v)}</td>`
    ).join("") + "</tr>").join("");
    return `<div class="tabela"><h3>${escapar(t.tabela)}</h3><div class="scroll"><table><thead><tr>${cab}</tr></thead><tbody>${linhas}</tbody></table></div></div>`;
  }

  function render() {
    document.querySelectorAll("[data-area]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.area === estado.area)));
    document.getElementById("semana").value = estado.semana;

    const lista = filtrados();
    const alvo = document.getElementById("desafio");
    if (!lista.length) {
      alvo.innerHTML = '<p class="vazio">Nenhum desafio para este filtro.</p>';
      document.getElementById("rodape").textContent = "";
      return;
    }

    const doDia = escolher(lista);
    const d = (estado.extra && lista.find(x => x.id === estado.extra)) || doDia.desafio;
    const ehExtra = d.id !== doDia.desafio.id;
    const nivel = d.niveis[estado.nivel] ? estado.nivel : "basico";
    const corpo = d.niveis[nivel];
    const lingua = d.area === "sql" ? "SQL" : "PySpark";

    alvo.innerHTML = `
      <div class="meta">
        <span class="pill ${d.area}">${lingua}</span>
        ${d.semana ? `<a class="pill" href="plano-12-semanas.html">Semana ${d.semana}</a>` : ""}
        ${ehExtra ? '<span class="pill extra">Treino extra</span>' : ""}
      </div>
      <div class="ferramenta">${escapar(d.ferramenta)}</div>
      <div class="origem">${escapar(d.arquivo)} · <a href="${escapar(d.link)}">${escapar(d.secao)}</a></div>

      <div class="tabs" role="tablist" aria-label="Nível">
        ${NIVEIS.map(([k, rotulo]) => `<button type="button" role="tab" data-nivel="${k}" aria-selected="${k === nivel}">${rotulo}</button>`).join("")}
      </div>

      <div class="enunciado">${textoRico(corpo.enunciado)}</div>
      ${corpo.dados ? corpo.dados.map(tabela).join("") : '<p class="nota">Proposta genérica: aplique na sua base, escolhendo uma tabela que tenha a situação descrita.</p>'}

      <details>
        <summary>Ver solução proposta</summary>
        <div class="code-wrap">
          <button type="button" class="copy">Copiar</button>
          <pre><code>${escapar(corpo.solucao)}</code></pre>
        </div>
      </details>

      <div class="acoes">
        <button type="button" class="btn" id="outro">Sortear outro</button>
        ${ehExtra ? '<button type="button" class="btn" id="voltar">Voltar ao desafio do dia</button>' : ""}
      </div>`;

    document.getElementById("rodape").textContent =
      `Ciclo ${doDia.ciclo} · desafio ${doDia.posicao} de ${doDia.n} deste filtro. O desafio do dia muda à meia-noite e é o mesmo em qualquer dispositivo.`;

    alvo.querySelectorAll("[data-nivel]").forEach(b => b.addEventListener("click", () => {
      estado.nivel = b.dataset.nivel; guardar("nivel", estado.nivel); render();
    }));
    alvo.querySelector(".copy").addEventListener("click", e => {
      navigator.clipboard.writeText(corpo.solucao).then(() => {
        e.target.textContent = "Copiado"; setTimeout(() => { e.target.textContent = "Copiar"; }, 1500);
      });
    });
    document.getElementById("outro").addEventListener("click", () => {
      const outros = lista.filter(x => x.id !== d.id);
      if (outros.length) { estado.extra = outros[Math.floor(Math.random() * outros.length)].id; render(); }
    });
    const voltar = document.getElementById("voltar");
    if (voltar) voltar.addEventListener("click", () => { estado.extra = null; render(); });
  }

  const semanas = [...new Set(DESAFIOS.map(d => d.semana).filter(Boolean))].sort((a, b) => a - b);
  const select = document.getElementById("semana");
  semanas.forEach(s => select.insertAdjacentHTML("beforeend", `<option value="${s}">Semana ${s}</option>`));
  if (!semanas.includes(Number(estado.semana))) estado.semana = "";

  document.querySelectorAll("[data-area]").forEach(b => b.addEventListener("click", () => {
    estado.area = b.dataset.area; estado.extra = null; guardar("area", estado.area); render();
  }));
  select.addEventListener("change", () => {
    estado.semana = select.value; estado.extra = null; guardar("semana", estado.semana); render();
  });

  render();
</script>
</body>
</html>
